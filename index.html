      mainQuestions:`<p>В чём разница между «непризнанным режимом» и «несостоявшимся государством»? Когда международное сообщество считает вмешательство (R2P) оправданным?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Эта тема — концентрат сложных вопросов международного права: что делает государство государством и когда признание обязательно.</p>
<h3>Непризнанные и частично признанные</h3><p><b>Афганистан</b> под контролем «Талибана» с <b>2021 года</b> не признан большинством государств — пример непризнанного де-факто режима.</p>
<h3>Несостоявшиеся государства</h3><p><b>Ливия</b> после <b>2011 года</b> — классический пример «failed state», разделённого между конкурирующими правительствами; ключевой кейс для доктрины <b>R2P</b>.</p>
<h3>Долгие конфликты и эмбарго</h3><p><b>Сирия</b> — гражданская война с <b>2011 года</b> и множество резолюций Совбеза ООН. <b>Куба</b> — под эмбарго США с 1960-х. <b>Венесуэла</b> — спор о легитимности власти.</p>
<h3>Переход от диктатуры к демократии</h3><p><b>Чили</b> пережила диктатуру и провела конституционную реформу после <b>2019 года</b>.</p>
<h3>Что запомнить</h3><ul><li>Непризнанный де-факто режим: Афганистан (2021).</li><li>Failed state: Ливия после 2011 года — база доктрины R2P.</li><li>Долгий конфликт с резолюциями ООН: Сирия (с 2011).</li></ul>`,
      facts:`<p>Доктрина R2P одобрена на Всемирном саммите ООН 2005 года, но её применение (Ливия, 2011) остаётся предметом острых споров о границах суверенитета.</p>`,
      connections:`<p>Связь с «Правом»: критерии государственности, доктрина R2P. Связь с «Латынью»: casus belli.</p>`,
      application:`<p>При разборе кейсов про интервенции указывай оба полюса аргументации: суверенитет и невмешательство vs защита гражданского населения (R2P).</p>`}

  latin: [
    {topic:"Основные принципы права", title:"Общие принципы права на латыни: pacta sunt servanda и jus cogens",
      mainQuestions:`<p>Почему договоры вообще должны соблюдаться? Что делает некоторые нормы международного права императивными, не подлежащими отмене по соглашению сторон?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Латинские максимы — не украшение речи, а сжатые формулы принципов, лежащих в основе всей правовой системы. Владение ими мгновенно поднимает уровень аргументации на экзамене.</p>
<h3>Базовый принцип договорного права</h3><p><b>Pacta sunt servanda</b> («договоры должны соблюдаться») — краеугольный камень международного права, закреплённый в <b>Венской конвенции о праве международных договоров</b>. Исключение — <b>rebus sic stantibus</b>: договор действует, пока сохраняются условия его заключения; коренное изменение обстоятельств может быть основанием прекращения.</p>
<h3>Императивные нормы</h3><p><b>Jus cogens</b> — императивные нормы международного права, отклонение от которых недопустимо ни при каких условиях (запрет геноцида, рабства, агрессии). Им противопоставлено обычное договорное право, которое стороны могут изменять по соглашению.</p>
<h3>Обязательства перед всеми</h3><p><b>Erga omnes</b> — обязательства государства перед всем международным сообществом в целом, а не перед отдельным партнёром по договору. <b>Opinio juris</b> — убеждённость государств в юридической обязательности практики, второй элемент образования международного обычая наряду с самой практикой.</p>
<h3>Что запомнить</h3><ul><li>Pacta sunt servanda — обязательность договоров; rebus sic stantibus — исключение при смене обстоятельств.</li><li>Jus cogens — нормы, от которых нельзя отступить никогда.</li><li>Erga omnes и opinio juris — элементы обязательств «перед всеми» и образования обычая.</li></ul>`,
      facts:`<p>Классические примеры jus cogens — запрет геноцида, рабства и пыток; они действуют даже для государств, формально не подписавших ни одного договора об этом.</p>`,
      connections:`<p>Связь с «Правом»: источники международного права. Связь с «Историей»: Венская конвенция 1969 года как кодификация обычного права договоров.</p>`,
      application:`<p>В эссе про международные договоры сразу указывай пару pacta sunt servanda / rebus sic stantibus как базу и исключение — это готовая структура ответа.</p>`},
    {topic:"Основные принципы права", title:"Обязательства, вина и ответственность в латинских максимах",
      mainQuestions:`<p>Чем различаются объективная и субъективная стороны преступления? Как латинские максимы формализуют принцип личной виновной ответственности?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Уголовно-правовые латинские формулы — самый частый источник заданий на сопоставление терминов, потому что они образуют парные, легко запоминаемые конструкции.</p>
<h3>Парные формулы законности</h3><p><b>Nullum crimen sine lege</b> («нет преступления без закона») и <b>nulla poena sine lege</b> («нет наказания без закона») — фундамент принципа законности в уголовном праве, дополняемый максимой <b>nulla poena sine culpa</b> («нет наказания без вины»).</p>
<h3>Две стороны преступления</h3><p><b>Actus reus</b> — объективная сторона (само деяние), <b>mens rea</b> — субъективная сторона (умысел или неосторожность). Оба элемента должны быть доказаны для осуждения — ключевое понятие англосаксонского уголовного права.</p>
<h3>Гарантии обвиняемого</h3><p><b>In dubio pro reo</b> — все неустранимые сомнения толкуются в пользу обвиняемого. <b>Ne bis in idem</b> — запрет повторного наказания за одно деяние, аналог англосаксонского double jeopardy.</p>
<h3>Что запомнить</h3><ul><li>Nullum crimen / nulla poena sine lege — принцип законности.</li><li>Actus reus + mens rea — обе стороны преступления обязательны.</li><li>In dubio pro reo и ne bis in idem — процессуальные гарантии обвиняемого.</li></ul>`,
      facts:`<p>Требование одновременного доказывания actus reus и mens rea объясняет, почему случайное причинение вреда без умысла или неосторожности обычно не образует состав преступления.</p>`,
      connections:`<p>Связь с «Правом»: презумпция невиновности, бремя доказывания. Связь с «Юридическим английским»: defendant, burden of proof.</p>`,
      application:`<p>При разборе казусов уголовного права всегда проверяй оба элемента — actus reus и mens rea — прежде чем делать вывод о виновности.</p>`},
    {topic:"Судебный процесс и доказывание", title:"Судебный процесс и доказывание: от habeas corpus до onus probandi",
      mainQuestions:`<p>Какие латинские формулы защищают личную свободу от произвольного задержания? Кто должен доказывать обвинение в состязательном процессе?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Процессуальные максимы формируют скелет справедливого судебного разбирательства — от момента задержания до вынесения окончательного решения.</p>
<h3>Свобода и суд</h3><p><b>Habeas corpus</b> — право на судебную проверку законности задержания, одна из древнейших процессуальных гарантий английского права. <b>Audiatur et altera pars</b> — принцип состязательности: должна быть выслушана и другая сторона.</p>
<h3>Бремя и стандарт доказывания</h3><p><b>Onus probandi</b> — бремя доказывания, по общему правилу лежащее на стороне обвинения. <b>Prima facie</b> — доказательство, достаточное на первый взгляд, без опровержения — формирует первоначальное обвинение до полного разбирательства.</p>
<h3>Окончательность решений</h3><p><b>Res judicata</b> — принцип недопустимости повторного рассмотрения уже решённого спора; обеспечивает стабильность правовой системы. <b>Locus standi</b> — процессуальная правоспособность лица на обращение в суд.</p>
<h3>Что запомнить</h3><ul><li>Habeas corpus — гарантия против произвольного задержания.</li><li>Onus probandi лежит на обвинении; prima facie достаточно для старта процесса.</li><li>Res judicata закрывает пересмотр решённого дела.</li></ul>`,
      facts:`<p>Habeas corpus восходит к английской Великой хартии вольностей (1215) и остаётся действующим механизмом защиты в большинстве систем common law.</p>`,
      connections:`<p>Связь с «Юридическим английским»: plaintiff, defendant, litigation. Связь с «Правом»: due process, presumption of innocence.</p>`,
      application:`<p>В заданиях на перевод процессуальных терминов всегда уточняй, о какой стадии процесса речь: возбуждение (prima facie), рассмотрение (audiatur et altera pars) или итог (res judicata).</p>`},
    {topic:"Юридическая методология", title:"Толкование права: от буквы к духу закона",
      mainQuestions:`<p>Какие существуют способы толкования правовой нормы при пробеле или неясности? Чем отличается толкование от применения права?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Юридическая методология объясняет, КАК судьи и юристы работают с текстом закона, когда он неполон, неясен или устарел.</p>
<h3>Три режима толкования</h3><p><b>Secundum legem</b> — толкование строго по букве закона. <b>Praeter legem</b> — восполнение пробела, не противоречащее духу закона. <b>Contra legem</b> — решение вопреки прямому предписанию закона — недопустимая форма.</p>
<h3>Разрешение коллизий норм</h3><p><b>Lex specialis derogat legi generali</b> — специальный закон отменяет общий. <b>Lex posterior derogat legi priori</b> — более поздний закон отменяет более ранний. <b>Lex superior derogat legi inferiori</b> — вышестоящий закон отменяет нижестоящий. Эти три правила — стандартный инструментарий разрешения противоречий между нормами.</p>
<h3>Пределы полномочий</h3><p><b>Ultra vires</b> — действие за пределами полномочий, <b>intra vires</b> — в их пределах. Часто используется для оспаривания актов органов власти и международных организаций.</p>
<h3>Что запомнить</h3><ul><li>Secundum / praeter / contra legem — три режима толкования по отношению к тексту закона.</li><li>Три правила разрешения коллизий: по иерархии, по времени, по специализации нормы.</li><li>Ultra vires — превышение полномочий, основание для отмены акта.</li></ul>`,
      facts:`<p>При конкуренции всех трёх коллизионных правил приоритет обычно отдаётся иерархии (lex superior), затем специализации (lex specialis), и лишь затем времени принятия (lex posterior).</p>`,
      connections:`<p>Связь с «Правом»: источники и иерархия правовых норм, judicial review. Связь с «Юридическим английским»: statute, precedent.</p>`,
      application:`<p>При коллизии норм в задаче — сначала проверь иерархию актов, потом их специализацию, и только затем дату принятия.</p>`},
    {topic:"Юридическая методология", title:"Международное право на латыни: от uti possidetis до erga omnes",
      mainQuestions:`<p>Как определяются границы новых государств после распада империй? Почему некоторые обязательства государств действуют в отношении всего мира сразу?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Латинские формулы международного права описывают, как формируются и распадаются государства, и что остаётся неизменным при этих процессах.</p>
<h3>Границы новых государств</h3><p><b>Uti possidetis juris</b> — принцип сохранения прежних административных границ при обретении независимости; применялся при деколонизации и распаде СССР/Югославии, предотвращая территориальный хаос.</p>
<h3>Действие договоров во времени и в пространстве</h3><p><b>Pacta tertiis nec nocent nec prosunt</b> — договоры не создают обязательств для третьих лиц, не участвующих в их заключении. <b>Casus foederis</b> — условие, при котором вступают в силу союзнические обязательства (например, ст.5 НАТО).</p>
<h3>Дипломатические статусы</h3><p><b>Persona non grata</b> — дипломат, объявленный нежелательным лицом; <b>persona grata</b> — получивший согласие на аккредитацию (агреман).</p>
<h3>Справедливость сверх нормы</h3><p><b>Ex aequo et bono</b> — разрешение спора на основе справедливости, а не строгой нормы права, допускается ст. 38(2) Статута Международного суда ООН только с согласия сторон.</p>
<h3>Что запомнить</h3><ul><li>Uti possidetis juris — границы наследуются от административного деления.</li><li>Pacta tertiis — договор не связывает третьи государства.</li><li>Persona non/grata — статусы дипломата; ex aequo et bono — решение по справедливости.</li></ul>`,
      facts:`<p>Принцип uti possidetis juris впервые системно применялся при деколонизации Латинской Америки в XIX веке, а затем стал стандартом при распаде СССР и Югославии в 1990-х.</p>`,
      connections:`<p>Связь с «Географией»: границы постсоветских и постъюгославских государств. Связь с «Праву»: критерии государственности, правопреемство.</p>`,
      application:`<p>При разборе территориальных споров всегда проверяй, применим ли uti possidetis juris — это первый аргумент, который ищут эксперты по международному праву.</p>`}
  ],
  legal: [
    {topic:"Договоры и дипломатия", title:"Договоры: заключение и толкование",
      mainQuestions:`<p>Какие стадии проходит международный договор от подписания до вступления в силу? Как государство может ограничить или прекратить своё участие в нём?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Договорное право — фундамент международных отношений: почти всё взаимодействие между государствами оформляется через <b>treaty</b> (договор).</p>
<h3>Жизненный цикл договора</h3><p>Договор проходит стадии: подписание → <b>ratification</b> (ратификация, формальное согласие быть связанным договором, обычно через парламент) → вступление в силу. Государство может присоединиться позже через <b>accession</b> (присоединение к уже действующему договору).</p>
<h3>Гибкость договора</h3><p>При подписании государство может сделать <b>reservation</b> (оговорку), ограничивающую действие отдельных положений для себя. <b>Protocol</b> — дополнительное соглашение к договору; <b>annex</b> — приложение, являющееся его частью; <b>preamble</b> — вводная часть, объясняющая цель договора.</p>
<h3>Прекращение обязательств</h3><p><b>Denunciation</b> — формальный акт выхода из договора. <b>Depositary</b> (обычно Генсек ООН) хранит официальный текст многостороннего договора.</p>
<h3>Что запомнить</h3><ul><li>Signature → ratification → entry into force → (возможно) accession позже.</li><li>Reservation ограничивает обязательства; protocol и annex дополняют текст.</li><li>Depositary хранит текст; denunciation — выход из договора.</li></ul>`,
      facts:`<p>Множество многосторонних договоров ООН используют Генерального секретаря ООН как depositary — это упрощает процедуру присоединения новых государств.</p>`,
      connections:`<p>Связь с «Латынью»: pacta sunt servanda, rebus sic stantibus. Связь с «Правом»: источники международного права.</p>`,
      application:`<p>Чётко разводи ratification (внутреннее одобрение) и accession (присоединение к уже действующему договору) — частая ошибка путать эти термины.</p>`},
    {topic:"Договоры и дипломатия", title:"Дипломатический иммунитет и институты",
      mainQuestions:`<p>Кто и как представляет государство за рубежом? Где проходит граница дипломатического иммунитета?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Дипломатическое право обеспечивает саму возможность межгосударственного общения, защищая представителей государства на чужой территории.</p>
<h3>Представители государства</h3><p><b>Ambassador</b> — высший дипломатический представитель, глава <b>embassy</b> (посольства). <b>Envoy</b> — представитель со специальной миссией. <b>Consulate</b> представляет интересы граждан, а не политические отношения правительств.</p>
<h3>Иммунитет и его пределы</h3><p><b>Diplomatic immunity</b> защищает дипломатов от местной юрисдикции. При злоупотреблении статусом принимающее государство объявляет дипломата <b>persona non grata</b> и требует отзыва.</p>
<h3>Инструменты давления</h3><p><b>Sanction</b> — мера принуждения к соблюдению права. <b>Embargo</b> — официальный запрет торговли. <b>Ceasefire</b> — временное прекращение огня, <b>armistice</b> — более формальное соглашение, часто предшествующее мирному договору.</p>
<h3>Что запомнить</h3><ul><li>Ambassador/envoy представляют государство политически, consulate — защищает граждан.</li><li>Diplomatic immunity ограничена — persona non grata как крайняя мера.</li><li>Sanction, embargo, ceasefire, armistice — градация инструментов давления и деэскалации.</li></ul>`,
      facts:`<p>Венская конвенция о дипломатических сношениях 1961 года остаётся основным источником регулирования дипломатического иммунитета по сей день.</p>`,
      connections:`<p>Связь с «Латынью»: persona non grata, persona grata. Связь с «Правом»: критерии государственности.</p>`,
      application:`<p>Не путай embassy (учреждение) и ambassador (человек) — частый источник ошибок в переводе.</p>`},
    {topic:"Судопроизводство и права человека", title:"Права человека и судопроизводство",
      mainQuestions:`<p>Кто есть кто в судебном процессе? Чем litigation отличается от arbitration и mediation?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Английский — рабочий язык большинства международных судов по правам человека; знание процессуальной лексики необходимо для чтения решений.</p>
<h3>Стороны процесса</h3><p><b>Plaintiff</b> — истец; <b>defendant</b> — ответчик или подсудимый. <b>Litigation</b> — судебное разбирательство, в противовес <b>arbitration</b> (арбитражу) и <b>mediation</b> (медиации) как альтернативным способам разрешения споров.</p>
<h3>Доказательства и решение</h3><p>Стороны представляют <b>testimony</b> (показания), ссылаются на <b>precedent</b> (прецедент). Итог — <b>verdict</b> (вердикт присяжных) или судебное решение.</p>
<h3>Защита прав человека</h3><p><b>Asylum</b> — убежище от преследований; <b>refugee</b> — беженец согласно Конвенции 1951 года; <b>statelessness</b> — отсутствие признанного гражданства.</p>
<h3>Что запомнить</h3><ul><li>Plaintiff vs defendant; litigation vs arbitration vs mediation.</li><li>Precedent — прошлое решение как основание нового.</li><li>Asylum, refugee, statelessness — ключевая триада права прав человека.</li></ul>`,
      facts:`<p>Многие крупные международные споры разрешаются через arbitration, а не litigation — это быстрее и позволяет выбрать нейтральных арбитров.</p>`,
      connections:`<p>Связь с «Правом»: due process, presumption of innocence. Связь с «Латынью»: audiatur et altera pars, onus probandi.</p>`,
      application:`<p>При переводе судебных документов уточняй роль стороны — plaintiff/claimant или defendant.</p>`},
    {topic:"Судопроизводство и права человека", title:"Международные суды и трибуналы",
      mainQuestions:`<p>Чем постоянный суд отличается от трибунала ad hoc? Что позволяет государству преследовать преступление, совершённое за его пределами?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Система международного правосудия состоит из разных по природе органов — важно не путать их юрисдикцию.</p>
<h3>Постоянные суды и ad hoc трибуналы</h3><p><b>Tribunal</b> — орган, разрешающий споры особого рода; часто создаётся <b>ad hoc</b> для конкретной ситуации (трибуналы по бывшей Югославии и Руанде).</p>
<h3>Пределы юрисдикции</h3><p>Государство может признавать <b>jurisdiction</b> суда полностью, частично или не признавать вовсе. <b>Extradition</b> регулируется отдельными договорами и часто становится предметом отказа по политическим мотивам.</p>
<h3>Ответственность за международные преступления</h3><p><b>Universal jurisdiction</b> позволяет любому государству преследовать за тяжкие международные преступления вне зависимости от места совершения. <b>War crimes tribunal</b> — специализированный орган; после суда возможна <b>amnesty</b>.</p>
<h3>Что запомнить</h3><ul><li>Tribunal может быть постоянным или ad hoc.</li><li>Extradition требует договора и часто получает отказ по политическим мотивам.</li><li>Universal jurisdiction — преследование вне зависимости от места преступления.</li></ul>`,
      facts:`<p>Международный уголовный суд в Гааге — первый постоянный международный уголовный трибунал в истории, создан Римским статутом в 2002 году.</p>`,
      connections:`<p>Связь с «Историей»: Нюрнбергский процесс 1945–1946. Связь с «Латынью»: ad hoc, locus delicti.</p>`,
      application:`<p>Различай постоянные (МУС, МС ООН) и ad hoc (МТБЮ, МТР) трибуналы — вопрос о разнице часто встречается в заданиях.</p>`},
    {topic:"Территория и ответственность государств", title:"Территория, суверенитет и ответственность государств",
      mainQuestions:`<p>Как международное право регулирует изменение территории? Когда экспроприация иностранной собственности законна?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Территория — физическая основа государственности; право строго регулирует, как она может меняться и какую ответственность несёт государство за действия на ней.</p>
<h3>Изменение территории</h3><p><b>Annexation</b> — насильственное присоединение территории, запрещённое современным правом. <b>Occupation</b> — эффективный контроль над иностранной территорией вооружёнными силами. <b>Secession</b> — отделение территории от более крупного государства.</p>
<h3>Экономическая ответственность</h3><p><b>Expropriation</b> — изъятие частной собственности государством; допустимо при выплате быстрой, адекватной и эффективной <b>compensation</b>. <b>Nationalization</b> — передача отрасли под контроль государства. Нарушение стандартов влечёт <b>liability</b> и обязанность выплатить <b>damages</b>.</p>
<h3>Правовые последствия конфликта</h3><p><b>Belligerent</b> — сторона вооружённого конфликта; <b>neutrality</b> — статус неучастия. <b>Breach</b> любого обязательства открывает путь к правовым средствам защиты.</p>
<h3>Что запомнить</h3><ul><li>Annexation запрещена; occupation временна и регулируется отдельно.</li><li>Expropriation допустима только с быстрой, адекватной и эффективной компенсацией.</li><li>Belligerent vs neutral — базовое разграничение статусов в конфликте.</li></ul>`,
      facts:`<p>Стандарт «быстрой, адекватной и эффективной компенсации» при экспроприации известен как формула Халла, по имени госсекретаря США 1930-х годов.</p>`,
      connections:`<p>Связь с «Правом»: ответственность государств, право на самооборону. Связь с «Историей»: присоединение Крыма 2014 года как пример спорной аннексии.</p>`,
      application:`<p>При обсуждении территориальных изменений указывай правовой статус процесса — annexation (запрещена), occupation (временный статус) или secession (внутренний процесс).</p>`}

  law: [
    {topic:"Теория права", title:"Что такое право и зачем оно нужно",
      mainQuestions:`<p>Чем право отличается от морали и обычая? Почему формально законная власть не всегда легитимна?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Прежде чем изучать конкретные отрасли, нужно понять сам феномен права — почему общества создают обязательные правила.</p>
<h3>Два взгляда на природу права</h3><p><b>Естественное право</b> — концепция прав, присущих человеку от природы, независимо от государства; философская основа современных прав человека. <b>Позитивное право</b> — право, установленное и санкционированное государством, действующее независимо от его нравственной оценки.</p>
<h3>Легальность и легитимность</h3><p><b>Легальность</b> — формальное соответствие закону. <b>Легитимность</b> — признание власти обоснованной обществом. Формально легальный режим может быть нелегитимным в глазах общества — источник многих революций в истории.</p>
<h3>Право и правопорядок</h3><p>Итог действия права — <b>правопорядок</b>. Он строится на <b>правоотношениях</b> — связях между субъектами, наделёнными правами и обязанностями, возникающих из <b>юридических фактов</b> (договор, рождение, правонарушение).</p>
<h3>Что запомнить</h3><ul><li>Естественное право — от природы; позитивное — от государства.</li><li>Легальность ≠ легитимность.</li><li>Правоотношение возникает из юридического факта и ведёт к правопорядку.</li></ul>`,
      facts:`<p>Спор между сторонниками естественного и позитивного права обострился после Нюрнбергского процесса: судьи должны были осудить нацистских преступников, формально действовавших «по закону» своего государства.</p>`,
      connections:`<p>Связь с «Латынью»: dura lex sed lex, salus populi suprema lex. Связь с «Литературой»: «Мёртвые души» — сатира на позитивистский формализм чиновничества.</p>`,
      application:`<p>В эссе о природе права сопоставляй естественно-правовой и позитивистский подходы — это готовая структура для сравнительного анализа.</p>`},
    {topic:"Теория права", title:"Источники и система права",
      mainQuestions:`<p>Чем отличаются романо-германская и англосаксонская правовые семьи? Как право заполняет пробелы?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Знание того, откуда берётся право и как оно организовано, — база для понимания любой правовой системы мира.</p>
<h3>Две великие правовые семьи</h3><p><b>Романо-германская правовая семья (civil law)</b> — основана на кодифицированном писаном праве (Франция, Германия, Россия). <b>Англосаксонская правовая семья (common law)</b> — основана на судебном прецеденте (Великобритания, США, Австралия).</p>
<h3>Источники права</h3><p><b>Нормативный акт</b> — официальный документ с обязательными правилами. <b>Судебный прецедент</b> — решение суда, обязательное для аналогичных дел в будущем. <b>Обычное право</b> — правило, ставшее обязательным через длительное применение.</p>
<h3>Восполнение пробелов</h3><p>При отсутствии прямой нормы применяется <b>аналогия закона</b> (сходная норма) или, в крайнем случае, <b>аналогия права</b> (общие принципы права).</p>
<h3>Кодификация</h3><p><b>Кодификация</b> — систематизация норм в едином акте (Гражданский кодекс) — характерна именно для романо-германской традиции.</p>
<h3>Что запомнить</h3><ul><li>Civil law = кодекс и статут; common law = прецедент.</li><li>Источники: нормативный акт, прецедент, обычай.</li><li>Пробелы: сначала аналогия закона, затем аналогия права.</li></ul>`,
      facts:`<p>Corpus Juris Civilis императора Юстиниана (VI век) остаётся исторической основой всей современной романо-германской правовой традиции.</p>`,
      connections:`<p>Связь с «Латынью»: corpus juris, stare decisis, ratio decidendi. Связь с «Юридическим английским»: precedent, statute.</p>`,
      application:`<p>При сравнении правовых систем всегда указывай пару стран-примеров для каждой семьи — это ожидаемый минимум для полного ответа.</p>`},
    {topic:"Международное публичное право", title:"Субъекты и принципы международного публичного права",
      mainQuestions:`<p>Кто является субъектом международного права? Как государства признают друг друга?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Международное право отличается от внутреннего тем, что у него нет единого законодателя — оно строится на согласии государств как главных субъектов.</p>
<h3>Кто является субъектом</h3><p><b>Субъекты международного права</b> — государства (первичные субъекты), международные организации и в ограниченной мере — индивиды. <b>Международная правосубъектность</b> организаций — производная, возникающая из учредительного договора государств.</p>
<h3>Государственный суверенитет</h3><p>Основа Вестфальской системы 1648 года — верховенство власти государства внутри страны и независимость вовне. Из него вытекает <b>принцип невмешательства</b> во внутренние дела (ст.2(7) Устава ООН).</p>
<h3>Как государства взаимодействуют с новыми акторами</h3><p><b>Признание государств</b> — акт подтверждения статуса нового государства; теории признания — конститутивная (признание создаёт государство) и декларативная (признание лишь констатирует факт). <b>Критерии государственности</b> по Монтевидейской конвенции 1933 года: территория, население, власть, способность вступать в сношения.</p>
<h3>Что запомнить</h3><ul><li>Государства — первичные субъекты; организации — производные.</li><li>Суверенитет и невмешательство — два столпа Вестфальской системы.</li><li>Признание: конститутивная vs декларативная теория.</li></ul>`,
      facts:`<p>Спор конститутивной и декларативной теорий признания практически проявляется в вопросах вроде статуса Косово или Абхазии — признанных одними государствами и не признанных другими.</p>`,
      connections:`<p>Связь с «Географией»: непризнанные и частично признанные государства. Связь с «Юридическим английским»: statehood criteria, recognition.</p>`,
      application:`<p>В задачах о статусе спорных территорий проверяй все 4 критерия Монтевидейской конвенции по очереди.</p>`},
    {topic:"Международное публичное право", title:"Ответственность государств и международные споры",
      mainQuestions:`<p>Что происходит при распаде или объединении государств с их обязательствами? Чем контрмеры отличаются от санкций?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Государства, как и физические лица, несут ответственность за противоправные деяния — но механизмы принуждения здесь принципиально иные.</p>
<h3>Правопреемство</h3><p><b>Правопреемство государств</b> — переход прав и обязанностей от одного государства к другому; актуально при распаде СССР и Югославии, когда новым государствам нужно было определить, кто наследует договоры, долги и место в международных организациях.</p>
<h3>Реакция на нарушение</h3><p>Пострадавшее государство может принять <b>контрмеры</b> — соразмерные и временные ответные меры. На уровне сообщества применяется <b>санкционный режим</b> — ограничительные меры Совбеза ООН или отдельных государств.</p>
<h3>Мягкое регулирование</h3><p><b>Мягкое право (soft law)</b> — декларации и резолюции без обязательной силы, но влияющие на поведение государств и часто становящиеся основой будущих договоров.</p>
<h3>Принцип добросовестности</h3><p><b>Эстоппель</b> — запрет отрицать факт, ранее подтверждённый собственным поведением государства; частый аргумент в территориальных спорах.</p>
<h3>Что запомнить</h3><ul><li>Правопреемство актуально при распаде/объединении государств.</li><li>Контрмеры (двусторонние) vs санкции (коллективные).</li><li>Soft law не обязательно, но влиятельно; эстоппель — про последовательность поведения.</li></ul>`,
      facts:`<p>Россия признана государством-продолжателем СССР, что позволило ей автоматически сохранить место постоянного члена Совбеза ООН без процедуры нового приёма.</p>`,
      connections:`<p>Связь с «Историей»: распад СССР 1991 года. Связь с «Латынью»: qui tacet consentire videtur — близко к логике эстоппеля.</p>`,
      application:`<p>Различай «государство-продолжатель» (сохраняет все права и обязательства) и «новое государство» (начинает правосубъектность заново).</p>`},
    {topic:"Международное публичное право", title:"Права человека в международном праве",
      mainQuestions:`<p>Как индивид стал субъектом международного права прав человека? Что защищает due process?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Права человека — область, где индивид выступает не просто объектом защиты, а всё чаще самостоятельным носителем прав.</p>
<h3>Базовый документ</h3><p><b>Всеобщая декларация прав человека (1948)</b> не имеет обязательной силы сама по себе, но легла в основу двух пактов 1966 года и множества обязательных конвенций — основа <b>human rights law</b>.</p>
<h3>Гарантии процесса</h3><p><b>Презумпция невиновности</b> и <b>due process</b> защищают личность от произвола государства. <b>Бремя доказывания</b> в уголовном процессе лежит на обвинении.</p>
<h3>Правовая презумпция как инструмент</h3><p><b>Правовая презумпция</b> — предположение, признаваемое истинным, пока не доказано обратное; презумпция невиновности — важнейший пример.</p>
<h3>Соразмерность ограничений</h3><p><b>Принцип соразмерности</b> требует, чтобы ограничение прав соответствовало преследуемой цели — стандартный тест судов по правам человека.</p>
<h3>Что запомнить</h3><ul><li>Декларация 1948 → пакты 1966 → обязательные конвенции.</li><li>Due process и presumption of innocence — процессуальные гарантии.</li><li>Тест соразмерности — стандарт оценки ограничений прав.</li></ul>`,
      facts:`<p>Всеобщая декларация прав человека была принята Генассамблеей ООН 10 декабря 1948 года без единого голоса «против» — этот день отмечается как День прав человека.</p>`,
      connections:`<p>Связь с «Литературой»: «Один день Ивана Денисовича» — тема нарушения прав человека. Связь с «Юридическим английским»: due process, testimony.</p>`,
      application:`<p>При анализе ограничения прав применяй трёхступенчатый тест: законность основания → легитимная цель → соразмерность средства цели.</p>`},
    {topic:"Уголовное и гуманитарное право", title:"Международное уголовное право и трибуналы",
      mainQuestions:`<p>Чем военное преступление отличается от преступления против человечности и геноцида? Когда применение силы правомерно?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Международное уголовное право — самая молодая отрасль, отвечающая на вопрос: кто несёт личную ответственность за массовые злодеяния.</p>
<h3>Три главных международных преступления</h3><p><b>Военное преступление</b> — серьёзное нарушение законов и обычаев войны. <b>Преступление против человечности</b> — масштабное или систематическое нападение на гражданское население. <b>Геноцид</b> — действия, направленные на уничтожение группы, по Конвенции 1948 года.</p>
<h3>Агрессия и самооборона</h3><p><b>Агрессия</b> определена резолюцией ГА ООН 3314 (1974) как применение силы против суверенитета другого государства. Ей противостоит <b>право на самооборону</b> (ст.51 Устава ООН) — одно из немногих правомерных оснований применения силы без санкции Совбеза, наряду с самой санкцией.</p>
<h3>От Нюрнберга к Гааге</h3><p>Нюрнбергский процесс 1945–1946 годов заложил принципы личной уголовной ответственности; они развились в создание постоянного <b>Международного уголовного суда</b> в 2002 году.</p>
<h3>Что запомнить</h3><ul><li>Военное преступление, преступление против человечности, геноцид — три ключевых состава.</li><li>Легитимное применение силы: самооборона (ст.51) или санкция Совбеза (гл. VII).</li><li>Нюрнберг (1945–46) → МУС (2002).</li></ul>`,
      facts:`<p>Определение агрессии оставалось предметом переговоров почти 30 лет — от создания ООН в 1945 году до резолюции 3314 в 1974 году.</p>`,
      connections:`<p>Связь с «Юридическим английским»: war crimes tribunal, universal jurisdiction. Связь с «Историей»: Нюрнбергский процесс.</p>`,
      application:`<p>При разборе кейсов о преступлениях сначала определи состав (военное преступление / против человечности / геноцид) — от этого зависит применимая юрисдикция.</p>`},
    {topic:"Уголовное и гуманитарное право", title:"Международное гуманитарное право (право войны)",
      mainQuestions:`<p>Чем jus ad bellum отличается от jus in bello? Какие принципы защищают гражданских лиц во время конфликта?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Даже вооружённый конфликт не является правовым вакуумом — международное гуманитарное право (МГП) устанавливает правила ведения боевых действий.</p>
<h3>Jus ad bellum и jus in bello</h3><p><b>Jus ad bellum</b> — право на применение силы (когда можно начинать войну). <b>Jus in bello</b>, оно же <b>международное гуманитарное право</b>, — регулирует поведение сторон уже во время конфликта.</p>
<h3>Базовые принципы ведения боевых действий</h3><p><b>Принцип различия</b> требует отделять комбатантов от гражданского населения. <b>Принцип пропорциональности</b> запрещает действия, ущерб от которых чрезмерен по сравнению с ожидаемым военным преимуществом.</p>
<h3>Статусы участников</h3><p><b>Комбатант</b> вправе участвовать в боевых действиях и, будучи захвачен, получает статус <b>военнопленного</b> по III Женевской конвенции 1949 года. <b>Некомбатант</b> пользуется защитой от прямого нападения.</p>
<h3>Оговорка Мартенса</h3><p>Там, где нет прямой нормы, действуют «законы человечности и требования общественного сознания» — принцип 1899 года, остающийся страховочной сетью гуманитарного права.</p>
<h3>Что запомнить</h3><ul><li>Jus ad bellum (когда воевать) ≠ jus in bello (как воевать).</li><li>Различие и пропорциональность — два кита правил ведения боя.</li><li>Женевские конвенции 1949 года защищают военнопленных и гражданских.</li></ul>`,
      facts:`<p>Оговорка Мартенса была предложена русским юристом-дипломатом Фёдором Мартенсом на Гаагской конференции 1899 года и с тех пор входит в преамбулы ключевых актов МГП.</p>`,
      connections:`<p>Связь с «Латынью»: jus ad bellum, jus in bello, inter arma enim silent leges. Связь с «Юридическим английским»: belligerent, neutrality.</p>`,
      application:`<p>При разборе кейсов о войне разделяй вопрос законности начала конфликта (jus ad bellum) и законности конкретных действий в его ходе (jus in bello) — это разные оценки.</p>`}

  lit: [
    {topic:"Русская классика", title:"Русская классика: право, вина и совесть (Достоевский, Толстой)",
      mainQuestions:`<p>Почему русская классика так настойчиво возвращается к теме суда и наказания? Чем нравственная ответственность отличается от юридической?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Русская литература XIX века — уникальный источник размышлений о праве не как о технике, а как о нравственной проблеме.</p>
<h3>Достоевский: соразмерность кары</h3><p>«<b>Преступление и наказание</b>» (1866) исследует природу вины и раскаяния — вопрос соразмерности кары преступлению. «<b>Братья Карамазовы</b>» (1880) строятся вокруг судебной ошибки: осуждён невиновный, что ставит вопрос о пределах судебного познания истины.</p>

<h3>Что запомнить</h3><ul><li>Достоевский: вина и наказание — нравственная, а не только юридическая категория.</li><li>Толстой: критика судебного формализма как социальный протест.</li><li>Судебная ошибка (Карамазовы) — вечный сюжет о пределах правосудия.</li></ul>`,
      facts:`<p>«Воскресение» было воспринято современниками как настолько острая критика судебной системы, что способствовало отлучению Толстого от церкви в 1901 году.</p>`,
      connections:`<p>Связь с «Правом»: presumption of innocence, судебная ошибка. Связь с «Историей»: судебная реформа 1864 года, введшая суд присяжных в России.</p>`,
      application:`<p>В эссе о соотношении права и морали всегда можно опереться на пару Достоевский (нравственный закон) / Толстой (критика формального закона).</p>`},
    {topic:"Русская классика", title:"Русская классика: власть и абсурд бюрократии (Гоголь, Салтыков-Щедрин, Грибоедов)",
      mainQuestions:`<p>Как русская литература высмеивала произвол чиновничества до появления современного административного права? Чем сатира отличается от прямой критики?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Сатирическая традиция русской литературы — зеркало реального состояния государственного управления имперской России.</p>
<h3>Гоголь и Салтыков-Щедрин</h3><p>«<b>Мёртвые души</b>» (1842) — сатира на бюрократию и злоупотребления чиновничьего аппарата через аферу с фиктивными «душами». «<b>История одного города</b>» (1870) даёт гротескное изображение произвола местной власти — собирательный образ дурного управления.</p>
<h3>Грибоедов и придворное общество</h3><p>«<b>Горе от ума</b>» (1824) — сатира на чиновничье общество николаевской эпохи, конфликт свободной личности и косной системы.</p>
<h3>Радищев: первая критика крепостного права</h3><p>«<b>Путешествие из Петербурга в Москву</b>» (1790) — первая в России развёрнутая критика крепостного права и произвола власти, за которую автор был осуждён.</p>
<h3>Что запомнить</h3><ul><li>Гоголь и Салтыков-Щедрин — сатира как форма правовой критики.</li><li>Радищев (1790) — первый в России литературный протест против крепостного права.</li><li>Сатира часто становилась единственно возможной формой критики власти в условиях цензуры.</li></ul>`,
      facts:`<p>За «Путешествие из Петербурга в Москву» Радищев был приговорён к смертной казни, заменённой ссылкой в Сибирь по личному распоряжению Екатерины II.</p>`,
      connections:`<p>Связь с «Историей»: реформы Александра II, отмена крепостного права 1861 года. Связь с «Правом»: административное право, злоупотребление полномочиями.</p>`,
      application:`<p>При анализе сатирических произведений всегда указывай конкретный правовой или административный порок, который они высмеивают, — это переводит литературный анализ в юридическую плоскость.</p>`},
    {topic:"Мировая классика", title:"Мировая классика: закон и справедливость (Шекспир, Гюго, Диккенс)",
      mainQuestions:`<p>Как европейская классика разбирает конфликт буквы закона и его духа? Почему судебный процесс — частый сюжетный приём?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Европейская классика веками использует зал суда как идеальную сцену для драмы о справедливости.</p>
<h3>Шекспир: буква и дух договора</h3><p>«<b>Венецианский купец</b>» (конец XVI века) — классический разбор в юридических школах: спор о букве и духе заключённого договора, где формальная победа оборачивается моральным поражением. «<b>Король Лир</b>» поднимает вопросы наследования власти и раздела королевства.</p>
<h3>Гюго: несоразмерность наказания</h3><p>«<b>Отверженные</b>» (1862) исследуют несоразмерность наказания (кража хлеба) и вопрос социальной реабилитации бывшего заключённого.</p>
<h3>Диккенс: критика судебной системы</h3><p>«<b>Холодный дом</b>» (1853) — сатира на медлительность и абсурд английского канцлерского суда; «<b>Повесть о двух городах</b>» (1859) изображает революционное правосудие и террор как крайность.</p>
<h3>Что запомнить</h3><ul><li>Шекспир: конфликт буквы и духа договора (Венецианский купец).</li><li>Гюго: несоразмерность наказания и социальная реабилитация.</li><li>Диккенс: критика медлительности и формализма судебной системы.</li></ul>`,
      facts:`<p>Дело Жана Вальжана в «Отверженных» — заключение на 19 лет за кражу хлеба — было основано на реальной практике французского уголовного права начала XIX века.</p>`,
      connections:`<p>Связь с «Правом»: соразмерность наказания, ресоциализация. Связь с «Юридическим английским»: litigation, precedent.</p>`,
      application:`<p>«Венецианский купец» — универсальный пример для любого эссе о буквальном vs телеологическом толковании договора.</p>`},
    {topic:"Мировая классика", title:"Мировая классика: личность против системы (Сервантес, Камю, Кафка)",
      mainQuestions:`<p>Как отдельная личность сталкивается с обезличенной системой власти в мировой литературе? Почему «кафкианский» стало именем нарицательным?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Эта линия мировой литературы исследует, как личность сталкивается с обезличенной, часто абсурдной системой власти или закона.</p>
<h3>Сервантес: субъективность справедливости</h3><p>«<b>Дон Кихот</b>» (части 1605 и 1615 годов) — размышление о справедливости и субъективном восприятии закона: герой судит мир по собственному кодексу чести, вступая в конфликт с реальностью.</p>
<h3>Камю: абсурд уголовного процесса</h3><p>«<b>Посторонний</b>» (1942) — классика для разбора темы уголовного процесса и абсурдности приговора: героя осуждают не столько за убийство, сколько за эмоциональную «инаковость». «<b>Чума</b>» (1947) — аллегория коллективной ответственности перед лицом кризиса.</p>
<h3>Кафка: непрозрачность власти</h3><p>«<b>Процесс</b>» (опубликован в 1925 году) — символ абсурда бюрократического правосудия без прозрачных правил: герой осуждён, так и не узнав обвинения. «<b>Замок</b>» (1926) отражает недоступность и непрозрачность административной власти.</p>
<h3>Что запомнить</h3><ul><li>Дон Кихот — конфликт личного кодекса чести и объективного закона.</li><li>Камю: абсурдность формального приговора («Посторонний»).</li><li>Кафка: «кафкианский» — нарицательное обозначение непрозрачной бюрократии.</li></ul>`,
      facts:`<p>Термин «кафкианский» вошёл в языки мира как обозначение абсурдной, непостижимой бюрократической системы — редкий случай, когда фамилия писателя стала именем нарицательным для правового явления.</p>`,
      connections:`<p>Связь с «Правом»: due process, право на защиту. Связь с «Латынью»: audiatur et altera pars — именно это право нарушено в «Процессе» Кафки.</p>`,
      application:`<p>«Процесс» Кафки — готовый пример для любого вопроса о нарушении процессуальных гарантий и права на защиту.</p>`},
    {topic:"XX век и антиутопии", title:"XX век и антиутопии: право под давлением тоталитаризма (Оруэлл, Замятин, Солженицын)",
      mainQuestions:`<p>Что происходит с правом, когда государство поглощает все сферы жизни личности? Чем художественная антиутопия отличается от документального свидетельства?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Антиутопии XX века — предупреждение о том, что происходит с правом, когда государство поглощает все сферы жизни личности.</p>
<h3>Замятин: первая антиутопия</h3><p>«<b>Мы</b>» (написан в 1920 году) — одна из первых антиутопий, повлиявшая на Оруэлла и Хаксли; общество полностью прозрачно и лишено приватности, право растворено в тотальном учёте.</p>
<h3>Оруэлл: тотальный контроль</h3><p>«<b>1984</b>» (1949) — классика анализа тоталитарного контроля и отсутствия верховенства права: закон подменяется волей партии. «<b>Скотный двор</b>» (1945) иллюстрирует узурпацию власти и подмену изначальных принципов революции.</p>
<h3>Солженицын и Шаламов: документальное свидетельство</h3><p>«<b>Архипелаг ГУЛАГ</b>» (1973) — ключевой источник о репрессиях и внесудебных расправах в СССР. «<b>Один день Ивана Денисовича</b>» (1962) — первое официально опубликованное произведение о ГУЛАГе. «<b>Колымские рассказы</b>» Шаламова — документальное свидетельство о лагерной системе.</p>
<h3>Что запомнить</h3><ul><li>Замятин (1920) → Оруэлл и Хаксли — линия развития жанра антиутопии.</li><li>«1984» — учебный пример отсутствия верховенства права (rule of law).</li><li>Солженицын и Шаламов — документальная, а не художественная антиутопия.</li></ul>`,
      facts:`<p>«Один день Ивана Денисовича» был опубликован в 1962 году с личного разрешения Хрущёва в журнале «Новый мир» — уникальный случай для советской цензуры эпохи.</p>`,
      connections:`<p>Связь с «Правом»: nullum crimen sine lege, внесудебные репрессии. Связь с «Историей»: Большой террор 1937–1938 годов.</p>`,
      application:`<p>При сравнении антиутопий используй пару Замятин/Оруэлл (художественное предупреждение) и Солженицын/Шаламов (документальное свидетельство).</p>`}

  art: [
    {topic:"Возрождение и барокко", title:"Возрождение: рождение личности в искусстве",
      mainQuestions:`<p>Что изменилось в искусстве, когда художники начали ставить в центр внимания человека? Почему именно Флоренция стала колыбелью Возрождения?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Возрождение — момент, когда искусство впервые сознательно поставило в центр человека, его тело и разум, а не только религиозный канон.</p>
<h3>От Джотто к раннему Ренессансу</h3><p><b>Джотто ди Бондоне</b> (фрески капеллы Скровеньи, 1305) считается первым художником, вернувшим в живопись объём и человеческую эмоцию. <b>Мазаччо</b> в «Троице» (1425–1428) впервые последовательно применил <b>линейную перспективу</b>.</p>
<h3>Высокое Возрождение: три гения</h3><p><b>Леонардо да Винчи</b> («Мона Лиза», 1503–1519) — универсальный человек Ренессанса. <b>Микеланджело</b> («Давид», 1501–1504) воплотил идеал гражданской доблести Флорентийской республики. <b>Рафаэль</b> («Афинская школа», 1509–1511) объединил античную философию и христианский гуманизм.</p>
<h3>Северное Возрождение</h3><p><b>Ян ван Эйк</b> («Портрет четы Арнольфини», 1434) — одна из первых картин маслом с детальным символизмом; <b>Дюрер</b> использовал гравюру как инструмент массового распространения идей Реформации.</p>
<h3>Что запомнить</h3><ul><li>Джотто (1305) → Мазаччо (перспектива) → Высокое Возрождение (Леонардо, Микеланджело, Рафаэль).</li><li>Флоренция — колыбель гражданского гуманизма в искусстве.</li><li>Северное Возрождение (ван Эйк, Дюрер) — параллельная, более детализированная традиция.</li></ul>`,
      facts:`<p>«Давид» Микеланджело был установлен на главной площади Флоренции как открытый политический символ — гражданин-республиканец, противостоящий тирании.</p>`,
      connections:`<p>Связь с «Историей»: расцвет итальянских городов-республик XV века. Связь с «Литературой»: гуманизм Возрождения и «Божественная комедия» Данте как его предвестник.</p>`,
      application:`<p>При анализе картины Возрождения указывай город/двор-заказчика — это ключ к пониманию политического контекста произведения.</p>`},
    {topic:"Возрождение и барокко", title:"Барокко и рококо: власть, драма и роскошь",
      mainQuestions:`<p>Как искусство служило абсолютистской власти? Чем драматизм барокко отличается от лёгкости рококо?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Барокко и рококо — стили, обслуживающие абсолютистскую власть: первый через драму и монументальность, второй через утончённость придворной жизни.</p>
<h3>Драма света и тени</h3><p><b>Караваджо</b> («Призвание апостола Матфея», 1599–1600) ввёл резкий контраст света и тени (<b>кьяроскуро</b>). <b>Рембрандт</b> («Ночной дозор», 1642) переосмыслил групповой портрет как динамическую композицию.</p>
<h3>Барокко на службе двора</h3><p><b>Веласкес</b> («Менины», 1656) — сложная многоуровневая композиция о природе изображения и взгляда. <b>Рубенс</b> служил дипломатом при нескольких европейских дворах, совмещая искусство и политику.</p>
<h3>Рококо: лёгкость аристократии</h3><p><b>Ватто</b> и <b>Фрагонар</b> воплотили лёгкость и галантность придворного искусства XVIII века накануне революции.</p>
<h3>Что запомнить</h3><ul><li>Кьяроскуро (Караваджо) — резкий контраст света и тени.</li><li>«Менины» Веласкеса — эталон рефлексии искусства о власти взгляда.</li><li>Рококо предшествует Французской революции — искусство «уходящей эпохи».</li></ul>`,
      facts:`<p>«Менины» Веласкеса вдохновили десятки философских интерпретаций, включая знаменитый анализ Мишеля Фуко о природе репрезентации и власти.</p>`,
      connections:`<p>Связь с «Историей»: правление Людовика XIV и абсолютизм. Связь с «Правом»: искусство как инструмент легитимации власти монарха.</p>`,
      application:`<p>Барокко = драма и монументальность на службе церкви/короны; рококо = лёгкость и интимность на службе аристократии.</p>`},
    {topic:"От романтизма до модерна", title:"От романтизма до модерна: искусство и свобода",
      mainQuestions:`<p>Как искусство XIX века постепенно освобождалось от заказа двора и церкви? Чем реализм отличается от импрессионизма?</p>`,
      materialText:`<h3>Почему это важно</h3><p>XIX век — время, когда искусство начинает служить личному видению художника и общественным идеям, а не только заказчику.</p>
<h3>Романтизм: чувство против разума</h3><p><b>Делакруа</b> («Свобода, ведущая народ», 1830) — прямая аллегория Июльской революции. <b>Гойя</b> («Расстрел повстанцев 3 мая 1808 года», 1814) — одно из первых антивоенных полотен в истории.</p>
<h3>Реализм: искусство простых людей</h3><p><b>Курбе</b> («Похороны в Орнане», 1849–1850) — манифест реалистического изображения простых людей. В России эту линию продолжили <b>передвижники</b>: «Бурлаки на Волге» Репина (1870–1873).</p>
<h3>Импрессионизм и постимпрессионизм</h3><p><b>Моне</b> («Впечатление. Восходящее солнце», 1872) дал название целому направлению. <b>Ван Гог</b> и <b>Сезанн</b> перешли от фиксации мгновения к экспрессии и анализу формы, подготовив почву для кубизма.</p>
<h3>Модерн (ар-нуво)</h3><p><b>Климт</b> («Поцелуй», 1907–1908) — вершина «золотого периода», синтез декоративности и символизма на грани веков.</p>
<h3>Что запомнить</h3><ul><li>Романтизм = политическая аллегория и эмоция (Делакруа, Гойя).</li><li>Реализм = простые люди без идеализации (Курбе, передвижники).</li><li>Импрессионизм → постимпрессионизм — путь от мгновения к форме.</li></ul>`,
      facts:`<p>Название «импрессионизм» изначально было ироничным упрёком критика, но художники приняли термин как знамя движения.</p>`,
      connections:`<p>Связь с «Историей»: Июльская революция 1830 года, реформы Александра II и передвижники. Связь с «Литературой»: реализм в живописи и прозе XIX века идут параллельно.</p>`,
      application:`<p>При сравнении стилей указывай, что стало ГЛАВНЫМ предметом изображения (аллегория, простой человек, свет, форма) — стержень для различения романтизма, реализма и импрессионизма.</p>`},
    {topic:"XX век и современность", title:"XX век: искусство как протест",
      mainQuestions:`<p>Как искусство XX века превратилось в прямое политическое высказывание? Чем кубизм отличается от супрематизма?</p>`,
      materialText:`<h3>Почему это важно</h3><p>XX век превращает искусство в прямое политическое высказывание — от антивоенных полотен до критики тоталитаризма.</p>
<h3>Рождение авангарда</h3><p><b>Пикассо</b> («Авиньонские девицы», 1907) ознаменовал рождение <b>кубизма</b>. <b>Малевич</b> («Чёрный квадрат», 1915) — манифест <b>супрематизма</b>, беспредметного искусства.</p>
<h3>Искусство против войны и тоталитаризма</h3><p>«<b>Герника</b>» Пикассо (1937) — прямой отклик на бомбардировку баскского города во время Гражданской войны в Испании, ставший международным символом протеста.</p>
<h3>Дадаизм и сюрреализм: бунт против смысла</h3><p><b>Дюшан</b> («Фонтан», 1917) радикально пересмотрел само понятие произведения искусства. <b>Дали</b> («Постоянство памяти», 1931) — образ «мягких часов» как символ относительности времени.</p>
<h3>Советское искусство: от авангарда к соцреализму</h3><p>«Рабочий и колхозница» Мухиной (1937) стала символом советского павильона на Всемирной выставке в Париже.</p>
<h3>Что запомнить</h3><ul><li>Кубизм (1907) и супрематизм (1915) — два пути к разрушению традиционной формы.</li><li>«Герника» (1937) — эталонный пример искусства как политического протеста.</li><li>Дадаизм/сюрреализм бросают вызов смыслу и логике после Первой мировой.</li></ul>`,
      facts:`<p>«Фонтан» Дюшана — обычный писсуар, подписанный псевдонимом, — был отвергнут выставочным комитетом в 1917 году, но сегодня считается одним из самых влиятельных произведений XX века.</p>`,
      connections:`<p>Связь с «Историей»: Гражданская война в Испании, Первая мировая война. Связь с «Правом»: искусство как инструмент политической легитимации.</p>`,
      application:`<p>«Герника» — универсальный пример для любого эссе об искусстве как форме политического высказывания и международного символа.</p>`},
    {topic:"XX век и современность", title:"Современное искусство и международные символы",
      mainQuestions:`<p>Что стирает границы между жанрами в современном искусстве? Чем перформанс отличается от традиционного произведения?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Современное искусство стирает границы между жанрами, институциями и рынком, ставя вопрос: что вообще может считаться произведением искусства.</p>
<h3>Поп-арт: искусство массовой культуры</h3><p><b>Уорхол</b> («Банки супа Кэмпбелл», 1962) стёр границу между массовой культурой и искусством. <b>Лихтенштейн</b> увеличил эстетику комиксов до масштабов живописи.</p>
<h3>От тела к пространству</h3><p><b>Перформанс</b> (Марина Абрамович, «Ритм 0», 1974) превратил тело художника в материал исследования пределов доверия. <b>Инсталляция</b> (Яёи Кусама, «Бесконечная комната зеркал», с 1965) создаёт иммерсивную среду вместо статичного объекта.</p>
<h3>Искусство протеста в общественном пространстве</h3><p><b>Стрит-арт</b>: «Девочка с воздушным шаром» Бэнкси (2002) — один из самых узнаваемых образов уличного искусства XXI века.</p>
<h3>Цифровая эра</h3><p>«Everydays» Beeple (2021, Christie's, $69 млн) — первый крупно проданный <b>NFT</b>-артворк, обозначивший новый этап рынка искусства.</p>
<h3>Что запомнить</h3><ul><li>Поп-арт стирает границу между рекламой/массовой культурой и искусством.</li><li>Перформанс и инсталляция смещают акцент с объекта на процесс/пространство.</li><li>NFT (2021) — новый институт подтверждения подлинности цифрового произведения.</li></ul>`,
      facts:`<p>Личность Бэнкси остаётся официально неподтверждённой — анонимность стала частью его художественной стратегии.</p>`,
      connections:`<p>Связь с «Правом»: интеллектуальная собственность, авторское право в цифровую эпоху (NFT). Связь с «Юридическим английским»: copyright, trademark.</p>`,
      application:`<p>При обсуждении современного искусства уточняй: это про ОБЪЕКТ (поп-арт, NFT) или про ПРОЦЕСС/ОПЫТ зрителя (перформанс, инсталляция).</p>`}

    {topic:"Приветствия и знакомство", title:"Приветствия, вежливость и знакомство",
      mainQuestions:`<p>Как выбор формы tu/Lei меняет весь дальнейший разговор? Чем buonasera отличается от buonanotte?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Первые фразы формируют впечатление и задают регистр общения — формальный (Lei) или неформальный (tu).</p>
<h3>Два регистра вежливости</h3><p><b>Come stai?</b> (неформ., tu) vs <b>Come sta?</b> (формал., Lei) — выбор формы задаёт всю тональность разговора. То же для извинения: <b>scusami</b> (tu) vs <b>mi scusi</b> (Lei).</p>
<h3>Время суток и прощание</h3><p><b>Buongiorno</b> — до вечера, <b>buonasera</b> — примерно с 17:00, <b>buonanotte</b> — только прощание перед сном. При прощании: <b>arrivederci</b> нейтрально, <b>ArrivederLa</b> — подчёркнуто формально.</p>
<h3>Представление себя</h3><p><b>Mi chiamo...</b> использует возвратный глагол chiamarsi. <b>Di dove sei?</b> — вопрос о происхождении, ответ через essere + di + место: <b>Sono russo/russa</b>.</p>
<h3>Что запомнить</h3><ul><li>tu (неформ.) vs Lei (формал.) — выбор формы задаёт регистр всего разговора.</li><li>Buongiorno/buonasera/buonanotte различаются по времени суток и функции.</li><li>Mi chiamo (возвратный глагол) — стандартное представление.</li></ul>`,
      facts:`<p>Форма вежливости Lei исторически восходит к обращению в третьем лице как знаку уважения — похожая логика лежит в основе испанского usted.</p>`,
      connections:`<p>Связь с общей темой вежливости в дипломатическом протоколе — сравни с категорией «Юридический английский»: ambassador, envoy.</p>`,
      application:`<p>На экзамене по диалогам сразу определяй регистр (tu/Lei) по контексту ситуации — это первое, что нужно решить перед выбором лексики.</p>`},
    {topic:"Повседневное общение", title:"Повседневное общение: город, время, покупки",
      mainQuestions:`<p>Как задать вопрос о месте и времени по-итальянски? Чем vorrei вежливее, чем voglio?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Базовые бытовые конструкции — основа выживания в италоязычной среде: транспорт, покупки, рестораны.</p>
<h3>Вопросы в городе</h3><p><b>Dove si trova...?</b> — безличная конструкция с si для вопроса о местонахождении. <b>Dov'è il bagno?</b> — практичный вопрос в путешествии.</p>
<h3>Время</h3><p><b>Che ora è?</b> / <b>Che ore sono?</b> — равнозначные варианты вопроса о времени; ответ через <b>Sono le...</b> (множественное число часов, кроме è l'una).</p>
<h3>Покупки и рестораны</h3><p><b>Quanto costa?</b> — вопрос цены. <b>Vorrei...</b> — вежливая форма желания (condizionale от volere) для заказа. <b>Il conto, per favore</b> — стандартная фраза завершения обеда.</p>

      facts:`<p>Condizionale (vorrei вместо voglio) — общая черта романских языков для смягчения прямых просьб, аналог английского I would like.</p>`,
      connections:`<p>Связь с «Юридическим английским»: due diligence в контексте вежливых формул делового общения.</p>`,
      application:`<p>Vorrei + существительное — универсальная вежливая конструкция для любой просьбы в магазине, кафе, отеле.</p>`},
    {topic:"Повседневное общение", title:"Деловое и учебное общение на итальянском",
      mainQuestions:`<p>Как рассказать о своей специальности по-итальянски? Чем отличается «делать профессию» от «быть кем-то»?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Учебная и деловая лексика позволяет рассказать о себе в профессиональном контексте.</p>
<h3>Рассказ о специальности</h3><p><b>Sto studiando legge</b> использует настоящее длительное время (stare + gerundio). Более формальный вариант — <b>Frequento la facoltà di giurisprudenza</b>.</p>
<h3>Профессия</h3><p><b>Che lavoro fai?</b> использует глагол fare («делать») в значении рода занятий. Ответ: <b>Faccio l'avvocato</b> — с определённым артиклем перед профессией.</p>
<h3>Просьбы о ясности</h3><p><b>Non capisco</b> — «я не понимаю». <b>Puoi ripetere, per favore?</b> — просьба повторить. <b>Più lentamente, per favore</b> — просьба говорить медленнее.</p>
<h3>Что запомнить</h3><ul><li>Stare + gerundio передаёт процесс («сейчас изучаю»).</li><li>Fare + определённый артикль + профессия — «работать кем-то».</li><li>Non capisco / puoi ripetere / più lentamente — базовый набор при непонимании.</li></ul>`,
      facts:`<p>Конструкция stare + gerundio по форме почти идентична английскому Present Continuous, что облегчает её освоение.</p>`,
      connections:`<p>Связь с «Юридическим английским»: litigation, due diligence — параллельная профессиональная лексика.</p>`,
      application:`<p>При составлении диалога о себе используй пару Sto studiando (процесс) + Frequento (факт учёбы) для полного ответа.</p>`},
    {topic:"Мнение и согласие", title:"Выражение мнения, согласия и несогласия",
      mainQuestions:`<p>Как вежливо выразить несогласие по-итальянски? Чем secondo me отличается от a mio parere?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Умение вежливо выразить несогласие — ключевой навык дипломатичного общения в итальянской деловой культуре.</p>
<h3>Согласие и несогласие</h3><p><b>Sono d'accordo</b> — «я согласен». <b>Non sono d'accordo</b> — прямое несогласие; для смягчения используют <b>«Non sono del tutto d'accordo»</b> — деловая культура ценит дипломатичность.</p>
<h3>Выражение мнения</h3><p><b>Secondo me</b> («по-моему») — самая частая вводная фраза; более формальный синоним — <b>a mio parere</b>. <b>Che ne pensi?</b> — запрос мнения собеседника.</p>
<h3>Уверенность и сомнение</h3><p><b>Certo</b> — уверенность, <b>forse</b> — сомнение, <b>magari!</b> — эмоциональный отклик желания. <b>Hai ragione</b> — признание правоты (avere ragione — буквально «иметь правоту»).</p>

      facts:`<p>Итальянская деловая культура ценит непрямые формулировки несогласия сильнее, чем англосаксонская — прямое «no» на переговорах считается почти грубым.</p>`,
      connections:`<p>Связь с «Юридическим английским»: good faith, due diligence. Связь с «Правом»: принцип добросовестности.</p>`,
      application:`<p>В диалогах на несогласие используй смягчённую формулу non sono del tutto d'accordo — это более «естественный» итальянский.</p>`},

  lingvo: [
    {topic:"Дипломаты и политики XIX–XX века", title:"Великие дипломаты и миротворцы XIX–XX века",
      mainQuestions:`<p>Как конкретные люди формировали международный порядок, который мы изучаем в других категориях? Что связывает Венский конгресс, Версаль и рождение ЕС?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Персоналии — ключи к пониманию, КАК конкретные люди формировали международный порядок.</p>
<h3>Архитекторы Венской системы</h3><p><b>Меттерних</b> и <b>Талейран</b> — архитекторы Венского конгресса 1814–1815 годов, заложившие принцип баланса сил на столетие вперёд.</p>
<h3>От Версаля к Лиге Наций</h3><p><b>Вудро Вильсон</b> — автор «14 пунктов» и инициатор идеи Лиги Наций. В Версале его партнёрами были <b>Дэвид Ллойд Джордж</b> (Великобритания) и <b>Жорж Клемансо</b> («Тигр», Франция) — «большая тройка», определявшая жёсткие условия для Германии.</p>
<h3>ООН и её первые генсеки</h3><p><b>Даг Хаммаршёльд</b> погиб при исполнении обязанностей в 1961 году. Его преемники — <b>Кофи Аннан</b> (концепция R2P) и <b>Антониу Гутерреш</b> — продолжили миротворческую традицию.</p>
<h3>Отцы европейской интеграции</h3><p><b>Робер Шуман</b> и <b>Жан Монне</b> заложили институциональную основу будущего Европейского союза, начав с Европейского объединения угля и стали в 1951 году.</p>

      facts:`<p>«Декларация Шумана» была оглашена 9 мая 1950 года — эта дата отмечается сегодня как официальный День Европы.</p>`,

      application:`<p>Каждую персоналию привязывай к конкретному событию/документу — экзаменаторы часто спрашивают именно эту связку «кто → что подписал/создал».</p>`},
    {topic:"Современные лидеры и главы государств", title:"Современные лидеры и главы государств",
      mainQuestions:`<p>Что объединяет лидеров Движения неприсоединения? Чем реформы Горбачёва отличались от реформ Дэн Сяопина?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Понимание современных лидеров даёт контекст для анализа текущих международных процессов.</p>

    {topic:"Аббревиатуры: международные организации", title:"Международные организации и их аббревиатуры",
      mainQuestions:`<p>Как быстро расшифровывать незнакомую аббревиатуру международной организации? Чем ЕСПЧ отличается от институтов ЕС?</p>`,

<h3>Правосудие и права человека</h3><p><b>МУС</b> — постоянный суд по военным преступлениям, развивает принципы Нюрнберга. <b>МТБЮ</b> и <b>МУТР</b> — ad hoc трибуналы по Югославии и Руанде. <b>ЕСПЧ</b> относится к Совету Европы, а не к ЕС.</p>
<h3>Новые институты</h3><p><b>НБР</b> (банк БРИКС, 2014) и <b>АБИИ</b> (2016, инициатива Китая) — новые многосторонние банки развития, рассматриваемые как альтернатива Бреттон-Вудским институтам.</p>

      facts:`<p>НБР и АБИИ появились в 2014–2016 годах как прямой ответ развивающихся экономик на недостаточное представительство в традиционных Бреттон-Вудских институтах.</p>`,

  hist: [
    {topic:"Всемирная история: до 1945 года", title:"Мир до 1914: баланс сил и империи",
      mainQuestions:`<p>Как система суверенных государств возникла из религиозных войн Европы? Что связывает Вестфаль, Наполеона и Гаагские конференции?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Мир до Первой мировой войны — эпоха империй и баланса сил, чьи механизмы объясняют логику современных международных отношений.</p>
