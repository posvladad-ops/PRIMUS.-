          <label>Дата: <input type="date" id="theDateStart" value="${draft.dateStart||todayISO()}"></label>
          <label>по (если несколько дней): <input type="date" id="theDateEnd" value="${draft.dateEnd||''}"></label>
        </div>
      </div>

      <div class="te-section">
        <div class="te-section-title">2 · Главные вопросы и ключевые слова</div>
        <div class="field"><label>Главные вопросы (можно заполнить после лекции)</label><textarea id="theQuestions" placeholder="На какие вопросы отвечает лекция? Можно списком.">${stripHtml(draft.mainQuestions||'')}</textarea></div>
        <div class="field"><label>Ключевые слова — то, что помечено кнопкой «Ключевое слово + карточка» в тексте лекции. По каждому заведётся карточка при сохранении.</label>
          <div class="kw-editor" id="kwEditor"></div>
          <input id="kwAddInput" placeholder="Добавить своё ключевое слово и нажать Enter">
        </div>
      </div>

      <div class="te-section">
        <div class="te-section-title">3 · Материал лекции</div>
        ${richFieldFull('theMaterial','Текст лекции — выделяй кнопкой «Ключевое слово + карточка» то, что должно уйти в ключевые слова и в карточки. Знак (?) рядом с непонятным местом — ИИ разберёт его отдельно и подробно.', draft.materialText, true)}
        ${richFieldFull('theNotes','Заметки, идеи и вопросы по ходу лекции', draft.notes, false)}
        <div class="field">
          <label>Файлы к лекции — презентация, скан, фото доски, что угодно</label>
          <div class="te-files" id="teFiles"></div>
          <button class="btn" id="btnAttachFile" type="button">Прикрепить файл</button>
          <input type="file" id="theFileInput" style="display:none">
          <div class="te-file-hint">До 2 МБ на файл — они лежат прямо в этой лекции на твоём устройстве.</div>
        </div>
      </div>

      <div class="te-section te-section-later">
        <div class="te-section-title">4 · Осмысление — заполняется вручную или через ИИ после лекции</div>
        ${richFieldFull('theExplain','Выжимка простыми словами', draft.explanation, false)}
        ${richFieldFull('theUnclear','Разбор непонятного — всё, что помечено в тексте знаком (?)', draft.unclear, false)}
        ${richFieldFull('theFacts','Интересные факты — копнуть глубже', draft.facts, false)}
        ${richFieldFull('theConn','Связь с другими темами', draft.connections, false)}
        ${richFieldFull('theApp','Как и где использовать', draft.application, false)}
      </div>

      <div class="te-ai-row">
        <button class="btn" id="btnCopyForAi">Скопировать для ИИ</button>
        <button class="btn" id="btnImportAi">Вставить обработку от ИИ</button>
      </div>
      ${aiInstructionsHtml('Как заполнить осмысление и карточки через ИИ', [
        'Нажми «Скопировать для ИИ» — скопируется текст лекции и готовый запрос по шаблону PRIMUS.',
        'Вставь скопированное в чат с любым ИИ-ассистентом (Claude, ChatGPT, Gemini и т.д.).',
        'Дождись ответа — это будет JSON, скопируй его целиком.',
        'Нажми «Вставить обработку от ИИ», вставь ответ и нажми «Применить» — поля осмысления и карточки заполнятся сами.',
        'Проверь результат и нажми «Сохранить материал» внизу.'
      ])}

      <div class="te-save-note" id="teSaveNote">
        <b>Не забудь сохранить материал.</b> Лекция записывается на устройство только по кнопке
        «Сохранить материал» — черновик подстраховывает, но полагаться на него не стоит.
        Ответственность за сохранность своих материалов и файлов лежит на пользователе:
        делай экспорт прогресса в разделе Storage.
      </div>
      <div class="te-footer">
        <button class="btn" id="teCancel">Отмена</button>
        <span class="te-dirty" id="teDirty"></span>
        <button class="btn btn-primary" id="teSave">Сохранить материал</button>
      </div>
    </div>
  `;
  wireRichToolbars();

  // ---- Черновик и защита от потери материала ----
  // Всё, что набрано, каждые несколько секунд уходит в черновик (STORE.theoryDraft), а уход со
  // страницы при несохранённых правках перехватывается. Сам материал всё равно записывается
  // только кнопкой «Сохранить материал» — об этом прямо написано над кнопкой.
  let dirty = false;
  function markDirty(){
    if(!dirty){
      dirty = true;
      const d = document.getElementById('teDirty');
      if(d) d.textContent = 'Есть несохранённые изменения';
    }
    THEORY_DIRTY = true;
    scheduleDraftSave();
  }
  function currentVals(){
    return {
      title: document.getElementById('theTitle').value.trim() || 'Без названия',
      topicId: document.getElementById('theoryTopicSelect').value,
      dateStart: document.getElementById('theDateStart').value || todayISO(),
      dateEnd: document.getElementById('theDateEnd').value || '',
      mainQuestions: esc(document.getElementById('theQuestions').value.trim()).replace(/\n/g,'<br>'),
      keywords: keywords,
      materialText: document.getElementById('theMaterial').innerHTML.trim(),
      notes: document.getElementById('theNotes').innerHTML.trim(),
      explanation: document.getElementById('theExplain').innerHTML.trim(),
      unclear: document.getElementById('theUnclear').innerHTML.trim(),
      facts: document.getElementById('theFacts').innerHTML.trim(),
      connections: document.getElementById('theConn').innerHTML.trim(),
      application: document.getElementById('theApp').innerHTML.trim(),
      attachments: attachments
    };
  }
  let draftTimer = null;
  function flushDraft(){
    try{
      STORE.theoryDraft = Object.assign({catKey:key, materialId:THEORY_EDIT_STATE?THEORY_EDIT_STATE.materialId:null, savedAt:new Date().toISOString()}, currentVals());
      saveStore();
    }catch(e){}
  }
  THEORY_FLUSH_DRAFT = flushDraft;
  function scheduleDraftSave(){
    clearTimeout(draftTimer);
    draftTimer = setTimeout(flushDraft, 1500);
  }
  function clearDraft(){
    clearTimeout(draftTimer);
    THEORY_FLUSH_DRAFT = null;
    dirty = false; THEORY_DIRTY = false;
    if(STORE.theoryDraft){ STORE.theoryDraft = null; saveStore(); }
  }
  ['theTitle','theQuestions','theDateStart','theDateEnd','theoryTopicSelect'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', markDirty);
  });
  ['theMaterial','theNotes','theExplain','theFacts','theConn','theApp'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', markDirty);
  });

  // ---- Файлы, прикреплённые к лекции ----
  let attachments = (draft.attachments||[]).slice();
  function drawAttachments(){
    const wrap = document.getElementById('teFiles');
    if(!wrap) return;
    wrap.innerHTML = attachments.length
      ? attachments.map((a,i)=>`<span class="te-file-chip"><a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a><span class="te-file-size">${Math.round((a.size||0)/1024)} КБ</span><button type="button" data-delfile="${i}" title="Убрать">✕</button></span>`).join('')
      : '<span style="font-size:11.5px;color:var(--text-faint)">Файлов пока нет</span>';
    wrap.querySelectorAll('[data-delfile]').forEach(b=>b.onclick=()=>{
      if(!confirm('Убрать этот файл из лекции?')) return;
      attachments.splice(+b.dataset.delfile,1); drawAttachments(); markDirty();
    });
  }
  drawAttachments();
  document.getElementById('btnAttachFile').onclick=()=>document.getElementById('theFileInput').click();
  document.getElementById('theFileInput').onchange=(e)=>{
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(file.size > 2*1024*1024){
      openInfoModal('Файл слишком большой', 'Файлы хранятся прямо на устройстве вместе с лекцией, поэтому лимит — 2 МБ. Сожми файл или приложи ссылку в заметках.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      attachments.push({name:file.name, type:file.type, size:file.size, data:reader.result});
      drawAttachments(); markDirty();
    };
    reader.readAsDataURL(file);
  };

  let keywords = (draft.keywords||[]).slice();
  function drawKeywords(){
    document.getElementById('kwEditor').innerHTML = keywords.map((k,i)=>`<span class="kw-chip editable">${esc(k)}<button data-kwdel="${i}">✕</button></span>`).join('') || '<span style="font-size:11.5px;color:var(--text-faint)">Пока нет — выдели слово в тексте лекции и нажми «Ключевое слово + карточка»</span>';
    document.querySelectorAll('[data-kwdel]').forEach(btn=>btn.onclick=()=>{ keywords.splice(+btn.dataset.kwdel,1); drawKeywords(); });
  }
  drawKeywords();
  document.getElementById('kwAddInput').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const v = e.target.value.trim();
      if(v && !keywords.includes(v)) keywords.push(v);
      e.target.value='';
      drawKeywords();
      markDirty();
    }
  });
  // Ключевые слова теперь берутся не из жирного текста, а только из того, что помечено
  // кнопкой «Ключевое слово + карточка». Жирный — просто жирный.
  let pendingKwCards = []; // [{word, context}] — по ним заведутся карточки при сохранении
  onKeywordMarked = (word, context)=>{
    if(!keywords.includes(word)) keywords.push(word);
    if(!pendingKwCards.some(p=>p.word===word)) pendingKwCards.push({word, context});
    drawKeywords();
    markDirty();
  };
  document.getElementById('theMaterial').addEventListener('blur',()=>{
    const found = extractKeywordsFromHtml(document.getElementById('theMaterial').innerHTML);
    found.forEach(k=>{ if(!keywords.includes(k)) keywords.push(k); });
    drawKeywords();
  });

  // Новая лекция по умолчанию — свой отдельный сет карточек, названный по теме лекции.
  // Если пользователь сам вручную выбрал существующую тему курса в списке — уважаем этот выбор
  // (значит, осознанно объединяет несколько лекций в одну тему) и больше не трогаем его автоматически.
  let topicManuallySet = !!editing;
  const theoryTopicSelectEl = document.getElementById('theoryTopicSelect');
  if(theoryTopicSelectEl){
    theoryTopicSelectEl.addEventListener('change', ()=>{ topicManuallySet = true; });
  }
  document.getElementById('theTitle').addEventListener('blur', ()=>{
    if(topicManuallySet) return;
    const title = document.getElementById('theTitle').value.trim();
    if(!title) return;
    const tId = resolveTopicByName(key, title);
    if(theoryTopicSelectEl){
      if(!theoryTopicSelectEl.querySelector(`option[value="${tId}"]`)){
        const t = getCategoryTopics(key).find(t=>t.id===tId);
        if(t) theoryTopicSelectEl.insertAdjacentHTML('beforeend', `<option value="${t.id}">${esc(t.name)}</option>`);
      }
      theoryTopicSelectEl.value = tId;
    }
  });

  document.getElementById('teCancel').onclick=()=>{
    if(dirty && !confirm('Закрыть без сохранения? Несохранённые изменения потеряются.')) return;
    clearDraft();
    THEORY_EDIT_STATE=null; renderTheory(body,key);
  };
  document.getElementById('teSave').onclick=()=>{
    const vals = Object.assign(currentVals(), { date: draft.dateStart || todayISO() });
    if(!STORE.materials[key]) STORE.materials[key]=[];
    let createdMaterial = null;
    if(editing){ Object.assign(editing, vals); }
    else {
      createdMaterial = Object.assign({id:uid('mat')}, vals);
      STORE.materials[key].push(createdMaterial);
    }
    // Слова, помеченные кнопкой «Ключевое слово + карточка», заводятся карточками
    // в теме этой лекции — одна лекция = один сет карточек.
    let madeCards = 0;
    if(pendingKwCards.length){
      const isCustom = !CATEGORY_META.find(m=>m.key===key);
      const existing = (APP_DATA[key] ? APP_DATA[key].cards : []);
      const type = (APP_DATA[key] && APP_DATA[key].meta.type) || 'custom';
      pendingKwCards.forEach(({word, context})=>{
        const dup = existing.some(c=>{
          const face = renderCardFace(type, c);
          return face && stripHtml(String(face.top||'')).trim().toLowerCase() === word.toLowerCase();
        });
        if(dup) return;
        const newCard = Object.assign(
          {id:uid(key), catKey:key, level:0, next_review:todayISO(), topicId: vals.topicId},
          cardFieldsFromKeyword(key, word, context)
        );
        if(isCustom){ if(!STORE.customCards[key]) STORE.customCards[key]=[]; STORE.customCards[key].push(newCard); }
        else { if(!STORE.extraCards[key]) STORE.extraCards[key]=[]; STORE.extraCards[key].push(newCard); }
        madeCards++;
      });
      pendingKwCards = [];
    }
    clearDraft();
    saveStore();
    buildAllData();
    THEORY_EDIT_STATE=null;
    renderTheory(body,key);
    if(createdMaterial) openLectureSavedModal(createdMaterial, key, madeCards, body);
    else if(madeCards) openInfoModal('Сохранено', `Материал сохранён. По ключевым словам заведено карточек: <b>${madeCards}</b> — они в теме «${esc(topicName(key, vals.topicId))}».`);
  };

  document.getElementById('btnCopyForAi').onclick=()=>{
    const text = buildTheoryAiExport(key, {
      title: document.getElementById('theTitle').value.trim(),
      dateStart: document.getElementById('theDateStart').value,
      dateEnd: document.getElementById('theDateEnd').value,
      mainQuestions: document.getElementById('theQuestions').value.trim(),
      keywords,
      materialText: document.getElementById('theMaterial').innerHTML,
      notes: document.getElementById('theNotes').innerHTML
    });
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>openInfoModal('Скопировано','Текст лекции скопирован — вставь его в чат с любым ИИ.'))
        .catch(()=>showCopyFallback(text));
    } else showCopyFallback(text);
  };
  document.getElementById('btnImportAi').onclick=()=>openTheoryAiImportModal(key, body);
}

function showCopyFallback(text){
  document.getElementById('modalBody').innerHTML = `<h3>Скопируй вручную</h3><textarea style="min-height:260px;width:100%" readonly>${esc(text)}</textarea><div class="modal-actions"><button class="btn btn-primary" id="mCloseCopy">Готово</button></div>`;
  document.getElementById('mCloseCopy').onclick=closeOverlay;
  openOverlay();
}
// После создания новой лекции — сразу предлагаем отправить её на повторение.
// Если нажать «Позже», лекция останется без повторения, но в списке у неё будет
// своя кнопка «Добавить в spaced repetition», так что потеряться она не может.
function openLectureSavedModal(m, key, madeCards, body){
  const intervals = SR_INTERVALS.join(', ');
  document.getElementById('modalBody').innerHTML = `
    <h3>Материал сохранён</h3>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:10px">
      Лекция «<b>${esc(m.title)}</b>» записана.${madeCards?` По ключевым словам заведено карточек: <b>${madeCards}</b>.`:''}
    </p>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:14px">
      Отправь её на повторение — платформа сама напомнит вернуться к ней через ${intervals} дней
      и будет показывать её в разделе Spaced Repetition.
    </p>
    <div class="modal-actions">
      <button class="btn" id="mLecLater">Позже</button>
      <button class="btn btn-primary" id="mLecToSr">Отправить на повторение</button>
    </div>
  `;
  document.getElementById('mLecLater').onclick=closeOverlay;
  document.getElementById('mLecToSr').onclick=()=>{
    scheduleLectureInitial(m, key, todayISO());
    saveStore();
    closeOverlay();
    if(body) renderTheory(body, key);
    renderNav();
    openInfoModal('Отправлено на повторение', `Первое повторение — <b>${esc(fmtDate(m.nextReview))}</b>. Лекция появится в разделе Spaced Repetition на вкладке «Лекции».`);
  };
  openOverlay();
}

function buildTheoryAiExport(key, d){
  const catName = APP_DATA[key] ? APP_DATA[key].meta.name : key;
  const dateStr = d.dateEnd && d.dateEnd!==d.dateStart ? `${d.dateStart} — ${d.dateEnd}` : d.dateStart;
  const fieldKeys = APP_DATA[key] ? (APP_DATA[key].meta.fields || ['front','back']) : ['front','back'];
  return `ПРЕДМЕТ: ${catName}
ТЕМА: ${d.title}
ДАТА: ${dateStr}

ГЛАВНЫЕ ВОПРОСЫ (черновик):
${d.mainQuestions||'(не заполнено)'}

КЛЮЧЕВЫЕ СЛОВА: ${d.keywords.join(', ')||'(пока нет)'}

ТЕКСТ ЛЕКЦИИ:
${stripHtml(d.materialText)}

ЗАМЕТКИ:
${stripHtml(d.notes)}

---
Ты помогаешь студенту юридического направления, который готовится к олимпиадам и поступлению.
Обработай лекцию выше по шаблону PRIMUS. и верни ТОЛЬКО JSON, без пояснений вокруг него.

ОБЩИЕ ТРЕБОВАНИЯ К ФОРМАТУ
- Поля "explanation"/"facts"/"connections"/"application"/"unclear" — это HTML, а не сплошной абзац:
  <h3> для разделов, <h4> для подзаголовков, <b> для терминов, <ul><li>/<ol><li> для любых перечислений
  (каждый пункт на своей строке). Никакого markdown — только HTML-теги.

ЗНАК ВОПРОСА (?) — ОБЯЗАТЕЛЬНО ПРОВЕРЬ
- Если где-то в тексте лекции или в заметках стоит «(?)» — это места, которые студент НЕ ПОНЯЛ.
- Для каждого такого места дай в поле "unclear" отдельный разбор: <h4>цитата непонятного места</h4>,
  затем объяснение с нуля, максимально понятным языком, от простого к сложному, с бытовой аналогией,
  и в конце — одной строкой связь именно с темой этой лекции («зачем это здесь и как связано с ${d.title||'темой'}»).
- Если знаков «(?)» в тексте нет — верни "unclear": "".

"facts" — «Интересные факты, копнуть глубже». Это не список банальностей, а рабочая навигация:
  <h3>Неочевидное</h3> — 3-5 фактов именно по этой теме, которых нет в самом тексте лекции;
  <h3>Что почитать</h3> — конкретика с названиями: автор + работа + что именно там смотреть
  (например: «Гуго Гроций, „О праве войны и мира“ (1625) — книга I, о справедливой войне»);
  документы/статьи называй точно (Устав ООН, ст. 2(4); Венская конвенция 1969, ст. 62 и т.п.);
  <h3>Куда копать дальше</h3> — 2-4 смежные темы с одной строкой, ЧТО именно в них искать и ЗАЧЕМ
  это нужно по отношению к текущей теме.
  Не пиши расплывчато («почитайте о международном праве») — только конкретные названия и адреса.

"connections" — «Связь с другими темами». Не просто перечисление предметов, а логические цепочки:
  каждый пункт строится как «А → Б → вывод»: от чего это выросло, во что превратилось дальше,
  и что из этого следует. Обязательно свяжи с другими предметами платформы (право, история,
  литература, искусство, юр. английский) и покажи, как одно объясняет другое, а не просто соседствует.

"application" — «Как использовать». Самый разжёванный раздел: развёрнуто ответь на каждый главный
  вопрос лекции, покажи, где именно эта тема даёт преимущество (эссе, устный ответ, кейс, олимпиадная
  задача), и дай 1-2 готовые формулировки-заготовки, которые можно вставить в ответ.

"cards" — карточки по этой лекции. Требования жёсткие, потому что плохие карточки бесполезны:
  - 8-15 карточек, каждая проверяет ОДНУ мысль, которую действительно нужно помнить;
  - берём только существенное: термины, даты-поворотные точки, принципы, различия между
    похожими понятиями. Никаких случайных фраз, вырванных из текста, и никакой воды;
  - лицевая сторона — короткий чёткий вопрос или термин; оборотная — точный ответ на 1-3 предложения,
    который сам по себе понятен, без обращения к лекции;
  - там, где уместно, рядом с русским термином давай английский эквивалент/аббревиатуру
    (ООН — UN/UNSC, МУС — ICC, ЕС — EU) — это нужно для юридического английского;
  - не указывай "topic" у карточек: они и так все попадут в один сет по названию лекции;
  - поля карточек этого предмета строго такие ключи, без замены и пропусков:
    ${fieldKeys.map(f=>`"${f}"`).join(', ')}.

Верни JSON вида:
{"mainQuestions":"...", "keywords":["...","..."], "explanation":"...", "facts":"...", "connections":"...", "application":"...", "unclear":"...", "cards":[{"fields":{${fieldKeys.map(f=>`"${f}":"..."`).join(', ')}}}]}`;
}
function openTheoryAiImportModal(key, body){
  document.getElementById('modalBody').innerHTML = `
    <h3>Вставить обработку от ИИ</h3>
    ${aiInstructionsHtml('Как это работает', [
      'Сначала нажми «Скопировать для ИИ» на странице лекции и вставь в чат с любым ИИ-ассистентом.',
      'Скопируй ответ ИИ целиком — это должен быть JSON.',
      'Вставь его в поле ниже и нажми «Применить».'
    ])}
    <div class="field"><textarea id="aiJson" style="min-height:200px" placeholder="Вставь сюда JSON, который вернул ИИ"></textarea></div>
    <div class="modal-actions"><button class="btn" id="mCancelAi">Отмена</button><button class="btn btn-primary" id="mSaveAi">Применить</button></div>
  `;
  document.getElementById('mCancelAi').onclick=closeOverlay;
  document.getElementById('mSaveAi').onclick=()=>{
    let parsed;
    try{ parsed = JSON.parse(document.getElementById('aiJson').value); }
    catch(e){ openInfoModal('Ошибка','Не удалось прочитать JSON — проверь формат.'); return; }
    if(parsed.mainQuestions) document.getElementById('theQuestions').value = stripHtml(parsed.mainQuestions);
    if(parsed.materialText) document.getElementById('theMaterial').innerHTML = parsed.materialText;
    if(parsed.explanation) document.getElementById('theExplain').innerHTML = parsed.explanation;
    if(parsed.unclear) document.getElementById('theUnclear').innerHTML = parsed.unclear;
    if(parsed.facts) document.getElementById('theFacts').innerHTML = parsed.facts;
    if(parsed.connections) document.getElementById('theConn').innerHTML = parsed.connections;
    if(parsed.application) document.getElementById('theApp').innerHTML = parsed.application;
    if(Array.isArray(parsed.keywords)){
      const kwEditor = document.getElementById('kwEditor');
      if(kwEditor){
        parsed.keywords.forEach(k=>{ if(k) kwEditor.insertAdjacentHTML('beforeend', `<span class="kw-chip">${esc(k)}</span>`); });
      }
    }
    let cardCount = 0;
    if(Array.isArray(parsed.cards) && parsed.cards.length){
      const data = APP_DATA[key];
      const isCustom = !CATEGORY_META.find(m=>m.key===key);
      const fieldKeys = (data.meta.fields || (data.meta.type==='custom'?['front','back','note']:['front','back']));
      // Все карточки одной лекции — в одну тему (сет), названную по лекции: 1 лекция = 1 сет карточек,
      // не разбитый по темам, которые могла бы напридумывать AI для отдельных карточек.
      const titleVal = document.getElementById('theTitle').value.trim() || 'Без названия';
      const lectureTopicId = resolveTopicByName(key, titleVal);
      const topicSelectEl = document.getElementById('theoryTopicSelect');
      if(topicSelectEl){
        if(!topicSelectEl.querySelector(`option[value="${lectureTopicId}"]`)){
          const t = getCategoryTopics(key).find(t=>t.id===lectureTopicId);
          if(t) topicSelectEl.insertAdjacentHTML('beforeend', `<option value="${t.id}">${esc(t.name)}</option>`);
        }
        topicSelectEl.value = lectureTopicId;
      }
      parsed.cards.forEach(c=>{
        const vals = {};
        fieldKeys.forEach(f=>{ vals[f] = (c.fields && c.fields[f]) || ''; });
        const id = uid(key);
        const newCard = Object.assign({id, catKey:key, level:0, next_review:todayISO(), topicId:lectureTopicId}, vals);
        if(isCustom){ if(!STORE.customCards[key]) STORE.customCards[key]=[]; STORE.customCards[key].push(newCard); }
        else { if(!STORE.extraCards[key]) STORE.extraCards[key]=[]; STORE.extraCards[key].push(newCard); }
        cardCount++;
      });
      saveStore();
      buildAllData();
    }
    closeOverlay();
    openInfoModal('Готово', `Поля заполнены${cardCount?`, создано карточек: <b>${cardCount}</b>`:''}. Не забудь нажать «Сохранить материал».`);
  };
  openOverlay();
}

/* ---------- richField с поддержкой маркера (highlighter) и большого размера для материала ---------- */
// Мягкие маркеры в палитре платформы — полупрозрачные, чтобы текст всегда читался.
const RT_HIGHLIGHTS = [
  {val:'rgba(244,224,138,.45)', title:'Жёлтый маркер',      swatch:'rgba(244,224,138,.55)'},
  {val:'rgba(94,36,48,.20)',    title:'Винный маркер',      swatch:'rgba(94,36,48,.35)'},
  {val:'rgba(140,128,88,.24)',  title:'Хаки маркер',        swatch:'rgba(140,128,88,.40)'},
  {val:'rgba(42,58,84,.20)',    title:'Тёмно-синий маркер', swatch:'rgba(42,58,84,.35)'}
];

    `<button type="button" class="rt-btn hl" data-cmd="hiliteColor" data-val="${h.val}" style="background:${h.swatch}" title="${h.title}"></button>`

  return `<div class="field">
    <label>${esc(label)}</label>
    <div class="rt-toolbar" data-for="${id}">
      <button type="button" class="rt-btn b" data-cmd="bold" title="Жирный">B</button>
      <button type="button" class="rt-btn i" data-cmd="italic" title="Курсив">I</button>
      <button type="button" class="rt-btn u" data-cmd="underline" title="Подчёркнутый">U</button>
      <button type="button" class="rt-btn s" data-cmd="strikeThrough" title="Зачёркнутый">S</button>
      <span class="rt-sep"></span>
      <button type="button" class="rt-btn rt-h1" data-cmd="heading" data-val="h3" title="Заголовок">H1</button>
      <button type="button" class="rt-btn rt-h2" data-cmd="heading" data-val="h4" title="Подзаголовок">H2</button>
      <button type="button" class="rt-btn" data-cmd="heading" data-val="p" title="Обычный текст">¶</button>
      <span class="rt-sep"></span>
      <button type="button" class="rt-btn" data-cmd="insertUnorderedList" title="Список точками">•</button>
      <button type="button" class="rt-btn" data-cmd="insertOrderedList" title="Нумерованный список">1.</button>
      <button type="button" class="rt-btn" data-cmd="dashlist" title="Список чёрточками">—</button>
      <span class="rt-sep"></span>
      <button type="button" class="rt-btn" data-cmd="divider" title="Разделительная линия">⎯</button>
      <button type="button" class="rt-btn" data-cmd="table" title="Вставить таблицу">▦</button>
      <span class="rt-sep"></span>
      ${hlBtns}
      <button type="button" class="rt-btn" data-cmd="hiliteColor" data-val="transparent" title="Убрать маркер">✕</button>
      ${kwBtn}
    </div>
    <div class="tbl-tools" data-tools-for="${id}" hidden>
      <span class="tbl-tools-label">Таблица:</span>
      <button type="button" class="btn" data-tbl="addRowBelow">+ строка</button>
      <button type="button" class="btn" data-tbl="delRow">− строка</button>
      <button type="button" class="btn" data-tbl="addColRight">+ столбец</button>
      <button type="button" class="btn" data-tbl="delCol">− столбец</button>
      <button type="button" class="btn" data-tbl="toggleHeader">Шапка вкл/выкл</button>
      <button type="button" class="btn" data-tbl="delTable">Удалить таблицу</button>
    </div>
    <div class="rt-editable ${isMain?'te-material-box':'te-notes-box'}" contenteditable="true" id="${id}">${html||''}</div>
  </div>`;
}

/* ---------- Практика: 5 режимов ---------- */
const PRACTICE_MODES = [
  {id:"task", label:"Задачи"},
  {id:"case", label:"Кейсы"},
  {id:"match", label:"Соответствие"},
  {id:"fill", label:"Вставка слова"},
  {id:"open", label:"Открытый вопрос"}
];
function renderPractice(body,key){
  const data = APP_DATA[key];
  if(PRACTICE_STATE.cat!==key){
    PRACTICE_STATE = { cat:key, mode:"task", idx:0, correct:0, total:0, olympiadOnly:false, revealed:false, matchLeft:null, matchDone:[] };
  }
  const modeCounts = {};
  PRACTICE_MODES.forEach(m=>{ modeCounts[m.id] = data.tasks.filter(t=>t.mode===m.id).length; });

  let tabsHtml = '<div class="mode-tabs">';
  PRACTICE_MODES.forEach(m=>{
    tabsHtml += `<button class="mode-tab ${PRACTICE_STATE.mode===m.id?'active':''}" data-mode="${m.id}">${m.label} <span class="mode-count">${modeCounts[m.id]}</span></button>`;
  });
  tabsHtml += '</div>';

  const pool = data.tasks.filter(t=>t.mode===PRACTICE_STATE.mode && (!PRACTICE_STATE.olympiadOnly || t.olympiad));
  const pct = PRACTICE_STATE.total ? Math.round(100*PRACTICE_STATE.correct/PRACTICE_STATE.total) : 0;

  body.innerHTML = `
    <div class="practice-wrap">
      ${tabsHtml}
      <div class="btn-row" style="margin-bottom:10px"><button class="btn" id="btnAddTasks">Добавить задания по теме</button></div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${PRACTICE_STATE.total}</div><div class="lbl">пройдено</div></div>
        <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">правильных</div></div>
        <div class="stat-box"><div class="num">${pool.length}</div><div class="lbl">доступно в этом режиме</div></div>
      </div>
      <div class="toggle-row"><button class="switch ${PRACTICE_STATE.olympiadOnly?'on':''}" id="olympSwitch"></button> Олимпиадный уровень</div>
      <div class="task-card" id="taskCard"></div>
    </div>
  `;
  document.getElementById('btnAddTasks').onclick=()=>openAddTasksModal(key,body);
  body.querySelectorAll('.mode-tab').forEach(tab=>tab.onclick=()=>{
    PRACTICE_STATE.mode = tab.dataset.mode; PRACTICE_STATE.idx=0; PRACTICE_STATE.revealed=false; PRACTICE_STATE.matchLeft=null; PRACTICE_STATE.matchDone=[];
    renderPractice(body,key);
  });
  document.getElementById("olympSwitch").onclick=()=>{
    PRACTICE_STATE.olympiadOnly=!PRACTICE_STATE.olympiadOnly; PRACTICE_STATE.idx=0; renderPractice(body,key);
  };

  if(pool.length===0){
    document.getElementById("taskCard").innerHTML = `<div class="empty-state">В этом режиме пока нет заданий для темы «${esc(data.meta.name)}».</div>`;
    return;
  }
  const task = pool[PRACTICE_STATE.idx % pool.length];
  renderTaskCard(document.getElementById("taskCard"), task, key, pool, body);
}

function openAddTasksModal(key, body){
  document.getElementById('modalBody').innerHTML = `
    <h3>Добавить задания по теме</h3>
    ${aiInstructionsHtml('Как это работает', [
      'Отправь свой материал по теме в чат с любым ИИ-ассистентом и попроси собрать по нему практику для PRIMUS.',
      `Режимы заданий: <code>task</code>, <code>case</code>, <code>fill</code>, <code>open</code> (нужны <code>prompt</code>/<code>answer</code>/<code>explanation</code>), <code>match</code> (вместо этого — <code>"pairs":[{"left":"...","right":"..."}]</code>).`,
      'Попроси вернуть JSON-массив вида <code>[{"topic":"Название темы","mode":"task","prompt":"...","options":["...","...","...","..."],"answer":"...","explanation":"..."}]</code>.',
      'Вставь готовый JSON в поле ниже и нажми «Добавить».'
    ])}
    <div class="field"><textarea id="tasksJson" style="min-height:180px" placeholder="Вставь готовый JSON сюда"></textarea></div>
    <div class="modal-actions"><button class="btn" id="mCancelTasks">Отмена</button><button class="btn btn-primary" id="mSaveTasks">Добавить</button></div>
  `;
  document.getElementById('mCancelTasks').onclick=closeOverlay;
  document.getElementById('mSaveTasks').onclick=()=>{
    let parsed;
    try{ parsed = JSON.parse(document.getElementById('tasksJson').value); }
    catch(e){ openInfoModal('Ошибка', 'Не получилось прочитать JSON — проверь, что скобки и кавычки на месте.'); return; }
    if(!Array.isArray(parsed)){ openInfoModal('Ошибка', 'Ожидается массив заданий в квадратных скобках — [ ... ].'); return; }
    if(!STORE.customTasks[key]) STORE.customTasks[key]=[];
    let count = 0;
    parsed.forEach(t=>{
      const topicId = resolveTopicByName(key, t.topic);
      STORE.customTasks[key].push({
        id: uid('ct'), topicId, mode: t.mode||'task',
        prompt: t.prompt||'', options: t.options||null, pairs: t.pairs||null,
        answer: t.answer||'', explanation: t.explanation||'', olympiad: !!t.olympiad
      });
      count++;
    });
    saveStore();
    buildAllData();
    closeOverlay();
    renderAll();
    openInfoModal('Готово', `Добавлено заданий: <b>${count}</b>.`);
  };
  openOverlay();
}

function gradeAndAdvance(key, task, correct){
  PRACTICE_STATE.total++;
  if(correct) PRACTICE_STATE.correct++;
  const card = findCard(key, task.cardId);
  if(card) review(card, correct);
  saveStore();
}

function renderTaskCard(el, task, key, pool, body){
  const modeLabels = {task:"Задача",case:"Кейс",match:"Соответствие",fill:"Вставка слова",open:"Открытый вопрос"};
  let html = `<div class="task-type">${modeLabels[task.mode]}${task.olympiad?' <span class="olympiad-tag">Олимпиадный уровень</span>':''}</div>`;

  if(task.mode==="match"){
    renderMatchTask(el, task, key, body);
    return;
  }

  html += `<div class="task-prompt">${esc(task.prompt)}</div>`;
  if(task.options){
    html += '<div class="opt-list">';
    task.options.forEach(o=>{ html+=`<div class="opt" data-opt="${encodeURIComponent(o)}">${esc(o)}</div>`; });
    html += '</div>';
  } else if(task.mode==="open"){
    html += `<textarea class="open-answer" id="openAnswer" placeholder="Напиши свой ответ своими словами..."></textarea>
              <button class="btn" id="btnReveal">Показать ответ</button>`;
  } else {
    html += `<button class="btn" id="btnReveal">Показать ответ</button>`;
  }
  html += `<div class="answer-box" id="answerBox"><div class="a-label">Пояснение</div><div>${esc(task.explanation)}</div></div>`;
  html += `<div class="grade-row" id="gradeRow" style="display:none">
      <button class="btn btn-good" id="btnGood">Я ответил(а) правильно</button>
      <button class="btn btn-bad" id="btnBad">Я ошибся(лась)</button>
    </div>`;
  html += `<div class="task-footer"><span></span><button class="btn" id="btnNext">Следующее задание</button></div>`;
  el.innerHTML = html;

  if(task.options){
    el.querySelectorAll('.opt').forEach(optEl=>{
      optEl.onclick=()=>{
        if(PRACTICE_STATE.revealed) return;
        PRACTICE_STATE.revealed = true;
        const chosen = decodeURIComponent(optEl.dataset.opt);
        el.querySelectorAll('.opt').forEach(o=>{
          const val = decodeURIComponent(o.dataset.opt);
          if(val===task.answer) o.classList.add('correct');
          else if(val===chosen) o.classList.add('wrong');
        });
        document.getElementById('answerBox').classList.add('show');
        gradeAndAdvance(key, task, chosen===task.answer);
      };
    });
  } else {
    document.getElementById('btnReveal').onclick=()=>{
      document.getElementById('answerBox').classList.add('show');
      document.getElementById('gradeRow').style.display='flex';
      document.getElementById('btnReveal').style.display='none';
    };
    document.getElementById('btnGood').onclick=()=>{ if(!PRACTICE_STATE.revealed){PRACTICE_STATE.revealed=true; gradeAndAdvance(key,task,true);} document.getElementById('gradeRow').style.display='none'; };
    document.getElementById('btnBad').onclick=()=>{ if(!PRACTICE_STATE.revealed){PRACTICE_STATE.revealed=true; gradeAndAdvance(key,task,false);} document.getElementById('gradeRow').style.display='none'; };
  }

  document.getElementById('btnNext').onclick=()=>{
    PRACTICE_STATE.idx++; PRACTICE_STATE.revealed=false;
    renderPractice(body, key);
  };
}

function renderMatchTask(el, task, key, body){
  const leftItems = shuffle(task.pairs.map((p,i)=>({...p, idx:i})));
  const rightItems = shuffle(task.pairs.map((p,i)=>({...p, idx:i})));
  let html = `<div class="task-prompt">${esc(task.prompt)}</div>
    <div class="match-grid">
      <div class="match-col" id="matchLeft">${leftItems.map(p=>`<div class="match-item" data-idx="${p.idx}">${esc(p.left)}</div>`).join('')}</div>
      <div class="match-col" id="matchRight">${rightItems.map(p=>`<div class="match-item" data-idx="${p.idx}">${esc(p.right)}</div>`).join('')}</div>
    </div>
    <div class="task-footer"><span id="matchProgress">Найдено пар: 0 из ${task.pairs.length}</span><button class="btn" id="btnNextMatch">Следующее задание</button></div>`;
  el.innerHTML = html;
  PRACTICE_STATE.matchLeft = null;
  PRACTICE_STATE.matchDone = [];

  function selectItem(itemEl, side){
    const idx = +itemEl.dataset.idx;
    if(itemEl.classList.contains('correct')) return;
    if(side==='left'){
      el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.classList.remove('selected'));
      itemEl.classList.add('selected');
      PRACTICE_STATE.matchLeft = idx;
    } else {
      if(PRACTICE_STATE.matchLeft===null) return;
      const isMatch = PRACTICE_STATE.matchLeft===idx;
      const leftEl = el.querySelector(`#matchLeft [data-idx="${PRACTICE_STATE.matchLeft}"]`);
      if(isMatch){
        itemEl.classList.add('correct'); if(leftEl) leftEl.classList.add('correct');
        PRACTICE_STATE.matchDone.push(idx);
        const card = findCard(key, task.pairs[idx].cardId);
        if(card) review(card, true);
        PRACTICE_STATE.total++; PRACTICE_STATE.correct++;
      } else {
        itemEl.classList.add('wrong'); if(leftEl) leftEl.classList.add('wrong');
        setTimeout(()=>{ itemEl.classList.remove('wrong'); if(leftEl) leftEl.classList.remove('wrong'); },500);
        const card = findCard(key, task.pairs[idx].cardId);
        if(card) review(card, false);
        PRACTICE_STATE.total++;
      }
      saveStore();
      PRACTICE_STATE.matchLeft = null;
      el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.classList.remove('selected'));
      const progEl = document.getElementById('matchProgress');
      if(progEl) progEl.textContent = `Найдено пар: ${PRACTICE_STATE.matchDone.length} из ${task.pairs.length}`;
    }
  }
  el.querySelectorAll('#matchLeft .match-item').forEach(i=>i.onclick=()=>selectItem(i,'left'));
  el.querySelectorAll('#matchRight .match-item').forEach(i=>i.onclick=()=>selectItem(i,'right'));
  document.getElementById('btnNextMatch').onclick=()=>{ renderPractice(body,key); };
}

/* ---------- Тест / проверка знаний — финальное закрепление темы с дедлайном ---------- */
const FT_SECTIONS = [
  {id:'key', label:'Проверка самого главного'},
  {id:'full', label:'Полный тест'},
  {id:'cases', label:'Кейсы'},
  {id:'questions', label:'Ответы на вопросы'},
  {id:'fun', label:'Интересные задания'}
];
function ftItemCount(t){ return FT_SECTIONS.reduce((n,s)=>n+((t.sections[s.id]||[]).length),0); }
function ftDoneCount(t){ return FT_SECTIONS.reduce((n,s)=>n+((t.sections[s.id]||[]).filter(i=>i.done).length),0); }
function renderFinalTest(body, key){
  if(!STORE.finalTests[key]) STORE.finalTests[key] = [];
  const tests = STORE.finalTests[key];
  const today = todayISO();
  let html = `<div class="btn-row" style="margin-bottom:10px"><button class="btn btn-primary" id="btnAddFinalTest">Добавить тест по теме</button></div>
  ${aiInstructionsHtml('Финальное закрепление темы — с дедлайном', [
    'Выбери тему и, если нужно, поставь дедлайн — когда должна быть готова проверка.',
    'Нажми «Скопировать запрос для ИИ» и вставь в чат с любым ИИ-ассистентом вместе с материалом лекции.',
    'Скопируй ответ ИИ (JSON) и вставь его при создании/редактировании теста.',
    'Внутри — 5 разделов: проверка самого главного, полный тест, кейсы, ответы на вопросы, интересные задания.'
  ])}`;
  if(tests.length===0){
    html += `<div class="empty-state">Пока нет тестов. Сначала пройди тему в Теории/Карточках/Практике, потом закрепи здесь финальной проверкой.</div>`;
  } else {
    tests.slice().sort((a,b)=>(a.deadline||'9999')<(b.deadline||'9999')?-1:1).forEach(t=>{
      const total = ftItemCount(t), done = ftDoneCount(t);
      const pct = total ? Math.round(100*done/total) : 0;
      const overdue = t.deadline && t.deadline < today && !t.completed;
      const deadlineLabel = t.deadline ? `${overdue?'Просрочено — ':'Дедлайн: '}${esc(fmtDate(t.deadline))}` : 'Без дедлайна';
      html += `<div class="ft-item" data-ft="${t.id}">
        <div class="ft-top">
          <div><div class="theory-topic">${esc(topicName(key,t.topicId))}</div><div class="ft-title">${esc(t.title)}${t.completed?' <span class="theory-sr" style="color:var(--good)">пройден ✓</span>':''}</div></div>
          <div class="ft-deadline ${overdue?'bad':''}">${deadlineLabel}</div>
        </div>
        <div class="ft-progress-bar"><div class="ft-progress-fill" style="width:${pct}%"></div></div>
        <div class="ft-sub">${done} из ${total} пройдено · ${pct}%</div>
        <div class="theory-actions">
          <button class="btn btn-primary" data-ft-go="${t.id}">${total?'Пройти':'Добавить задания'}</button>
          <button class="btn" data-ft-edit="${t.id}">Изменить</button>
          <button class="btn" data-ft-del="${t.id}">Удалить</button>
        </div>
      </div>`;
    });
  }
  body.innerHTML = html;
  document.getElementById('btnAddFinalTest').onclick=()=>openFinalTestModal(key, null, body);
  body.querySelectorAll('[data-ft-go]').forEach(btn=>btn.onclick=()=>{
    const t = tests.find(x=>x.id===btn.dataset.ftGo);
    if(!t) return;
    if(ftItemCount(t)===0) openFinalTestModal(key, t, body);
    else startFinalTestSession(key, t, body);
  });
  body.querySelectorAll('[data-ft-edit]').forEach(btn=>btn.onclick=()=>openFinalTestModal(key, tests.find(x=>x.id===btn.dataset.ftEdit), body));
  body.querySelectorAll('[data-ft-del]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Удалить этот тест? Его можно будет вернуть из корзины в разделе Storage.')) return;
    const ft = tests.find(x=>x.id===btn.dataset.ftDel);
    if(ft) trashPush('finaltest', ft.title, {test:JSON.parse(JSON.stringify(ft))}, key, getCategoryDisplayName(key));
    STORE.finalTests[key] = tests.filter(x=>x.id!==btn.dataset.ftDel);
    saveStore(); renderFinalTest(body,key);
  });
}

function buildFinalTestAiExport(key, topicNameStr){
  const catName = APP_DATA[key] ? APP_DATA[key].meta.name : key;
  const sectionsHint = FT_SECTIONS.map(s=>`"${s.id}"`).join(', ');
  return `ПРЕДМЕТ: ${catName}
ТЕМА: ${topicNameStr}

Собери финальную проверку знаний по этой теме (используй мою лекцию и карточки по ней, которые я тебе даю отдельно/выше в чате) по шаблону PRIMUS. Нужно 5 разделов:
1) Проверка самого главного — 4-6 коротких вопросов на ключевые факты/определения.
2) Полный тест — 8-12 вопросов, которые целиком покрывают тему.
3) Кейсы — 2-3 прикладные ситуации с разбором.
4) Ответы на вопросы — открытые вопросы на понимание и рассуждение (не факт-чек).
5) Интересные задания — 2-3 нестандартных/творческих задания, необязательно с одним верным ответом.

Каждый пункт — вопрос/задание (q) и подробный образцовый ответ (a, можно HTML с <b>/<ul><li>). Верни JSON вида:
{"key":[{"q":"...","a":"..."}], "full":[{"q":"...","a":"..."}], "cases":[{"q":"...","a":"..."}], "questions":[{"q":"...","a":"..."}], "fun":[{"q":"...","a":"..."}]}
Ключи ровно такие: ${sectionsHint}.`;
}

function openFinalTestModal(key, editing, listBody){
  const topics = getCategoryTopics(key);
  let topicSelect = `<select id="ftTopicSelect">`;
  topics.forEach(t=>{ topicSelect += `<option value="${t.id}" ${(editing?editing.topicId:'general')===t.id?'selected':''}>${esc(t.name)}</option>`; });
  topicSelect += `</select>`;
  document.getElementById('modalBody').innerHTML = `
    <h3>${editing?'Изменить тест':'Добавить тест по теме'}</h3>
    <div class="field"><label>Тема</label>${topicSelect}</div>
    <div class="field"><label>Название теста</label><input id="ftTitle" value="${esc(editing?editing.title:'')}" placeholder="Например: Итоговая проверка — Конституционное право"></div>
    <div class="field"><label>Дедлайн</label><input type="date" id="ftDeadline" value="${editing&&editing.deadline?editing.deadline:''}"></div>
    <div class="btn-row" style="margin-bottom:8px"><button class="btn" id="btnCopyFtAi">Скопировать запрос для ИИ</button></div>
    <div class="field"><label>Вставь сюда JSON от ИИ ${editing&&ftItemCount(editing)?'(необязательно — оставь пустым, чтобы не менять задания)':''}</label><textarea id="ftJson" style="min-height:160px" placeholder='{"key":[...],"full":[...],"cases":[...],"questions":[...],"fun":[...]}'></textarea></div>
    <div class="modal-actions"><button class="btn" id="mCancelFt">Отмена</button><button class="btn btn-primary" id="mSaveFt">Сохранить</button></div>
  `;
  document.getElementById('btnCopyFtAi').onclick=()=>{
    const tId = document.getElementById('ftTopicSelect').value;
    const text = buildFinalTestAiExport(key, topicName(key,tId));
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>openInfoModal('Скопировано','Запрос скопирован — вставь его в чат с любым ИИ вместе с материалом лекции.')).catch(()=>showCopyFallback(text));
    } else showCopyFallback(text);
  };
  document.getElementById('mCancelFt').onclick=closeOverlay;
  document.getElementById('mSaveFt').onclick=()=>{
    const title = document.getElementById('ftTitle').value.trim() || 'Без названия';
    const topicId = document.getElementById('ftTopicSelect').value;
    const deadline = document.getElementById('ftDeadline').value || null;
    const jsonRaw = document.getElementById('ftJson').value.trim();
    let sections = editing ? editing.sections : {key:[],full:[],cases:[],questions:[],fun:[]};
    if(jsonRaw){
      let parsed;
      try{ parsed = JSON.parse(jsonRaw); }
      catch(e){ openInfoModal('Ошибка','Не удалось прочитать JSON — проверь формат.'); return; }
      sections = {};
      FT_SECTIONS.forEach(s=>{
        sections[s.id] = (Array.isArray(parsed[s.id]) ? parsed[s.id] : []).map(it=>({q:it.q||'', a:it.a||'', done:false}));
      });
    }
    if(!STORE.finalTests[key]) STORE.finalTests[key] = [];
    if(editing){
      Object.assign(editing, {title, topicId, deadline, sections});
    } else {
      STORE.finalTests[key].push({id:uid('ft'), topicId, title, deadline, createdDate:todayISO(), completed:false, completedDate:null, sections});
    }
    saveStore();
    closeOverlay();
    renderFinalTest(listBody, key);
  };
  openOverlay();
}

let FT_SESSION = null; // {key, testId, items:[{sectionLabel,q,a,done}], idx, revealed}
function startFinalTestSession(key, t, listBody){
  const items = [];
  FT_SECTIONS.forEach(s=>{
    (t.sections[s.id]||[]).forEach(it=>items.push({sectionLabel:s.label, sectionId:s.id, q:it.q, a:it.a, done:!!it.done}));
  });
  if(items.length===0) return;
  FT_SESSION = {key, testId:t.id, items, idx:0, revealed:false};
  renderFinalTestSession(listBody);
  openOverlay();
}
function renderFinalTestSession(listBody){
  const s = FT_SESSION;
  const it = s.items[s.idx];
  const doneCount = s.items.filter(i=>i.done).length;
  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="art-cat">${esc(it.sectionLabel)}</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">${s.idx+1} / ${s.items.length} · пройдено ${doneCount}</span>
    </div>
    <div class="theory-block"><div class="tb-label">Задание</div><div class="tb-body" style="font-size:14px;color:var(--text)">${it.q||'<span style="opacity:.5">пусто</span>'}</div></div>
    ${s.revealed ? `<div class="theory-block"><div class="tb-label">Ответ</div><div class="tb-body">${it.a||'<span style="opacity:.5">пусто</span>'}</div></div>` : `<div class="btn-row" style="margin-bottom:12px"><button class="btn" id="ftReveal">Показать ответ</button></div>`}
    <div class="toggle-row" style="margin-bottom:10px"><button class="switch ${it.done?'on':''}" id="ftMarkDone"></button> Пройдено</div>
    <div class="modal-actions">
      <button class="btn" id="ftClose">Закрыть</button>
      <button class="btn" id="ftPrev" ${s.idx===0?'disabled':''}>‹ Назад</button>
      <button class="btn btn-primary" id="ftNext">${s.idx===s.items.length-1?'Завершить':'Вперёд ›'}</button>
    </div>
  `;
  document.getElementById('ftClose').onclick=()=>{ finishFinalTestSession(listBody); };
  const revealBtn = document.getElementById('ftReveal');
  if(revealBtn) revealBtn.onclick=()=>{ s.revealed=true; renderFinalTestSession(listBody); };
  document.getElementById('ftMarkDone').onclick=()=>{ it.done=!it.done; renderFinalTestSession(listBody); };
  document.getElementById('ftPrev').onclick=()=>{ if(s.idx>0){ s.idx--; s.revealed=false; renderFinalTestSession(listBody); } };
  document.getElementById('ftNext').onclick=()=>{
    if(s.idx<s.items.length-1){ s.idx++; s.revealed=false; renderFinalTestSession(listBody); }
    else finishFinalTestSession(listBody);
  };
}
function finishFinalTestSession(listBody){
  const s = FT_SESSION;
  const key = s.key;
  const t = (STORE.finalTests[key]||[]).find(x=>x.id===s.testId);
  if(t){
    let i = 0;
    FT_SECTIONS.forEach(sec=>{
      (t.sections[sec.id]||[]).forEach(item=>{ item.done = s.items[i].done; i++; });
    });
    const total = ftItemCount(t), done = ftDoneCount(t);
    if(total>0 && done===total){ t.completed = true; t.completedDate = todayISO(); }
    saveStore();
  }
  FT_SESSION = null;
  closeOverlay();
  renderFinalTest(listBody, key);
}

// Разграничение: карточки и лекции — разные ритмы повторения, разные действия, поэтому отдельные вкладки,
// а не общий список вперемешку.
let SR_TAB = 'cards';
function renderReview(main){
  main.innerHTML = `<div class="topbar"><div><h2>Spaced Repetition</h2><div class="desc">Карточки и лекции, срок повторения которых наступил</div></div></div>
    <div class="mode-tabs" style="margin-bottom:14px">
      <button class="mode-tab ${SR_TAB==='cards'?'active':''}" id="srTabCards">Карточки</button>
      <button class="mode-tab ${SR_TAB==='lectures'?'active':''}" id="srTabLectures">Лекции</button>
    </div>
    <div id="reviewBody"></div>`;
  document.getElementById('srTabCards').onclick=()=>{ SR_TAB='cards'; renderReview(main); };
  document.getElementById('srTabLectures').onclick=()=>{ SR_TAB='lectures'; renderReview(main); };
  if(SR_TAB==='lectures'){ renderReviewLectures(main); return; }
  renderReviewCards(main);
}
function renderReviewCards(main){
  const due = reviewDueCards();
  const rb = document.getElementById("reviewBody");
  rb.innerHTML = `<div class="btn-row" style="margin-bottom:14px"><button class="btn btn-primary" id="btnAddToReview">Добавить карточку на повторение</button></div><div id="reviewBody2"></div>`;
  document.getElementById('btnAddToReview').onclick=()=>openAddToReviewModal(main);
  const rb2 = document.getElementById("reviewBody2");
  if(due.length===0){ rb2.innerHTML = `<div class="empty-state">Все карточки повторены. Загляни завтра!</div>`; return; }

  // группировка по категории+теме
  const groups = {};
  due.forEach(c=>{
    const topicId = getCardTopicId(c.catKey, c);
    const gKey = c.catKey+"::"+topicId;
    if(!groups[gKey]) groups[gKey] = { catKey:c.catKey, topicId, cards:[] };
    groups[gKey].cards.push(c);
  });
  const groupList = Object.values(groups).sort((a,b)=>b.cards.length-a.cards.length);

  let html = `<div class="review-summary">Сегодня на повторение: <b>${due.length} карточек</b></div><div class="review-groups" id="reviewGroups">`;
  groupList.forEach(g=>{
    const catName = APP_DATA[g.catKey] ? APP_DATA[g.catKey].meta.name : g.catKey;
    html += `<div class="review-group" data-g="${esc(g.catKey)}::${esc(g.topicId)}">
      <span class="rg-mark"></span>
      <span class="rg-text"><b>${esc(catName)}</b> (тема: ${esc(topicName(g.catKey,g.topicId))})</span>
      <span class="rg-count">${g.cards.length} карточек</span>
    </div>`;
  });
  html += `</div><button class="btn btn-primary" id="btnStartReview" style="margin-top:16px">Начать повторение</button><div id="reviewSession"></div>`;
  rb2.innerHTML = html;

  let activeFilter = null;
  rb2.querySelectorAll('.review-group').forEach(g=>g.onclick=()=>{
    rb2.querySelectorAll('.review-group').forEach(x=>x.classList.remove('active'));
    if(activeFilter===g.dataset.g){ activeFilter=null; } else { activeFilter=g.dataset.g; g.classList.add('active'); }
  });
  document.getElementById('btnStartReview').onclick=()=>{
    const queue = activeFilter ? due.filter(c=>(c.catKey+"::"+getCardTopicId(c.catKey,c))===activeFilter) : due.slice();
    runReviewSession(document.getElementById('reviewSession'), queue, false);
  };
}

function reviewDueMaterials(){
  const today = todayISO();
  const out = [];
  allCategoryKeys().forEach(catKey=>{
    (STORE.materials[catKey]||[]).forEach(m=>{
      if(m.nextReview && m.nextReview<=today) out.push({catKey, m});
    });
  });
  return out;
}
function renderReviewLectures(main){

  let html = `<div class="review-summary">Сегодня на повторение: <b>${due.length} лекций</b></div>`;
  due.forEach(({catKey,m})=>{
    const catName = getCategoryDisplayName(catKey);
    html += `<div class="review-group" data-lecmat="${m.id}" data-leccat="${catKey}" style="cursor:default">
      <span class="rg-mark"></span>

function runReviewSession(container, queue, isRno){
  let idx = 0;
  function showCard(){
    if(idx>=queue.length){ container.innerHTML = `<div class="empty-state">Повторение завершено — молодец!</div>`; return; }
    const c = queue[idx];
    const meta = APP_DATA[c.catKey] ? APP_DATA[c.catKey].meta : null;
    const type = meta ? (meta.type||"custom") : "custom";
    const {top,sub,body,usage} = renderCardFace(type,c);
    container.innerHTML = `
      <div class="stat-row"><div class="stat-box"><div class="num">${idx+1}/${queue.length}</div><div class="lbl">карточек в очереди</div></div></div>
      <div class="task-card">
        <div class="task-type">${meta?esc(meta.name):''} ${isRno?'· WON':''}</div>
        <div class="task-prompt">${top}</div>
        <div style="color:var(--accent-strong);font-weight:600;margin-bottom:8px">${sub}</div>
        <button class="btn" id="btnRevealRev">Показать ответ</button>
        <div class="answer-box" id="answerBoxRev"><div class="a-label">Детали</div><div>${body}</div>${usage?`<div class="fc-usage" style="margin-top:8px">Perfect Usage: ${usage}</div>`:''}</div>
        <div class="grade-row" id="gradeRowRev" style="display:none">
          <button class="btn btn-good" id="btnGoodRev">Помню</button>
          <button class="btn btn-bad" id="btnBadRev">Забыл(а)</button>
        </div>
      </div>`;
    document.getElementById('btnRevealRev').onclick=()=>{
      document.getElementById('answerBoxRev').classList.add('show');
      document.getElementById('gradeRowRev').style.display='flex';
      document.getElementById('btnRevealRev').style.display='none';
    };
    document.getElementById('btnGoodRev').onclick=()=>{ review(c,true,{isRno}); idx++; showCard(); };
    document.getElementById('btnBadRev').onclick=()=>{ review(c,false,{isRno}); idx++; showCard(); };
  }
  showCard();
}

  due.forEach(c=>{

    if(q.length<2){ resultsEl.innerHTML = '<div class="empty-state" style="padding:20px">Введи хотя бы 2 буквы</div>'; return; }

// Вставка текста в любое редактируемое поле платформы всегда идёт шрифтом/стилем платформы,
// а не тем, что принёс источник (Word/Google Docs/сайт/чат с ИИ) — исходное форматирование обрезается,
// переносы строк сохраняются. Делегирование на document — работает для полей, отрисованных когда угодно.
document.addEventListener('paste', function(e){
  const editable = e.target.closest && e.target.closest('.rt-editable[contenteditable="true"], [contenteditable="true"]');
  if(!editable) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  const html = esc(text).replace(/\r\n|\r|\n/g, '<br>');
  document.execCommand('insertHTML', false, html);
});

// Запоминаем последнее выделение внутри редактируемых полей. На телефоне (iOS особенно) тап по кнопке
// панели успевает сбросить выделение до того, как сработает click — и жирный/подчёркнутый/маркер
// «не работают». Поэтому выделение сохраняем заранее и восстанавливаем перед самой командой.
let LAST_RT_RANGE = null;
let LAST_RT_FIELD = null;
document.addEventListener('selectionchange', ()=>{
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return;
  const node = sel.anchorNode;
  if(!node) return;
  const el = node.nodeType===1 ? node : node.parentElement;
  const editable = el && el.closest && el.closest('.rt-editable[contenteditable="true"]');
  if(editable){
    LAST_RT_RANGE = sel.getRangeAt(0).cloneRange();
    LAST_RT_FIELD = editable;
  }
  if(typeof syncTableTools === 'function') syncTableTools();
});
// Команды панели, которых нет в execCommand: заголовки, список чёрточками, разделитель,
// таблица и «ключевое слово + карточка». Возвращает true, если команда обработана здесь.
function runRichCustomCommand(cmd, val, editable){
  if(cmd==='heading'){
    // formatBlock в разных браузерах хочет разный формат аргумента — пробуем оба
    try{ if(!document.execCommand('formatBlock', false, val)) document.execCommand('formatBlock', false, '<'+val+'>'); }
    catch(e){ try{ document.execCommand('formatBlock', false, '<'+val+'>'); }catch(e2){} }
    return true;
  }
  if(cmd==='dashlist'){
    document.execCommand('insertUnorderedList');
    // помечаем именно тот список, внутри которого оказался курсор
    const sel = window.getSelection();
    if(sel && sel.rangeCount){
      let node = sel.getRangeAt(0).startContainer;
      if(node.nodeType===3) node = node.parentElement;
      const ul = node && node.closest ? node.closest('ul') : null;
      if(ul) ul.classList.add('dash-list');
    }
    return true;
  }
  if(cmd==='divider'){
    document.execCommand('insertHTML', false, '<hr class="lecture-divider"><p><br></p>');
    return true;
  }
  if(cmd==='table'){
    const row = (cells, tag)=>`<tr>${cells.map(c=>`<${tag}>${c}</${tag}>`).join('')}</tr>`;
    const html = `<table class="lec-table"><tbody>`
      + row(['&nbsp;','&nbsp;','&nbsp;'],'th')
      + row(['&nbsp;','&nbsp;','&nbsp;'],'td')
      + row(['&nbsp;','&nbsp;','&nbsp;'],'td')
      + `</tbody></table><p><br></p>`;
    document.execCommand('insertHTML', false, html);
    return true;
  }
  if(cmd==='kwcard'){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0 || sel.isCollapsed){
      openInfoModal('Сначала выдели слово', 'Выдели в тексте слово или фразу, а потом нажми «Ключевое слово + карточка» — оно станет ключевым словом и по нему заведётся карточка.');
      return true;
    }
    const word = sel.toString().trim();
    if(!word) return true;
    // контекст для оборотной стороны карточки — предложение/абзац, в котором стоит слово
    let blockNode = sel.getRangeAt(0).startContainer;
    if(blockNode.nodeType===3) blockNode = blockNode.parentElement;
    const block = blockNode && blockNode.closest ? (blockNode.closest('li,p,h3,h4,div.rt-editable')||editable) : editable;
    const blockText = (block ? block.textContent : '').replace(/\s+/g,' ').trim();
    let context = blockText;
    const sentences = blockText.split(/(?<=[.!?])\s+/);
    const hit = sentences.find(s=>s.includes(word));
    if(hit && hit.length>=20) context = hit.trim();
    document.execCommand('insertHTML', false, `<span class="kw-mark">${esc(word)}</span>`);
    if(typeof onKeywordMarked === 'function') onKeywordMarked(word, context);
    return true;
  }
  return false;
}
// Заполняется редактором лекции, чтобы отмеченное слово сразу попало в овалы ключевых слов и в карточки.
let onKeywordMarked = null;

/* ---------- Редактирование таблиц прямо в лекции (как в заметках iPhone) ---------- */
let ACTIVE_TABLE_CELL = null; // ячейка, в которой стоит курсор
function currentTableCell(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0) return null;
  let node = sel.anchorNode;
  if(!node) return null;
  if(node.nodeType===3) node = node.parentElement;
  if(!node || !node.closest) return null;
  const cell = node.closest('td,th');
  if(!cell) return null;
  const table = cell.closest('table.lec-table');
  if(!table || !table.closest('.rt-editable[contenteditable="true"]')) return null;
  return cell;
}
// Показывает панель управления таблицей у того поля, в таблице которого сейчас курсор.
function syncTableTools(){
  const cell = currentTableCell();
  ACTIVE_TABLE_CELL = cell;
  const field = cell ? cell.closest('.rt-editable') : null;
  document.querySelectorAll('.tbl-tools').forEach(tools=>{
    tools.hidden = !(field && tools.dataset.toolsFor === field.id);
  });
}
// Ставит курсор в ячейку и делает её активной — чтобы следующая операция работала
// даже после удаления строки/столбца, в которых стояла предыдущая активная ячейка.
function focusTableCell(cell){
  if(!cell || !cell.isConnected) return;
  ACTIVE_TABLE_CELL = cell;
  try{
    const r = document.createRange();
    r.selectNodeContents(cell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}
function tableOp(op){
  // кешированная ячейка могла быть удалена предыдущей операцией — тогда берём живую
  let cell = ACTIVE_TABLE_CELL;
  if(!cell || !cell.isConnected) cell = currentTableCell();
  if(!cell || !cell.isConnected) return;
  const table = cell.closest('table.lec-table');
  if(!table) return;
  const row = cell.parentElement;
  const rows = Array.from(table.rows);
  const colIdx = Array.from(row.cells).indexOf(cell);
  const editable = table.closest('.rt-editable');
  const mkCell = (tag)=>{ const c = document.createElement(tag); c.innerHTML = '&nbsp;'; return c; };

  if(op==='addRowBelow'){
    const nr = table.insertRow(row.rowIndex+1);
    for(let i=0;i<row.cells.length;i++) nr.appendChild(mkCell('td'));
    focusTableCell(nr.cells[Math.min(colIdx, nr.cells.length-1)]);
  }
  else if(op==='delRow'){
    if(rows.length<=1){ openInfoModal('Нельзя', 'В таблице должна остаться хотя бы одна строка.'); return; }
    const nextRow = table.rows[row.rowIndex+1] || table.rows[row.rowIndex-1];
    row.remove();
    if(nextRow) focusTableCell(nextRow.cells[Math.min(colIdx, nextRow.cells.length-1)]);
  }
  else if(op==='addColRight'){
    rows.forEach(r=>{
      const ref = r.cells[colIdx];
      const tag = (ref && ref.tagName==='TH') ? 'th' : 'td';
      const c = mkCell(tag);
      if(ref && ref.nextSibling) r.insertBefore(c, ref.nextSibling);
      else r.appendChild(c);
    });
    focusTableCell(row.cells[colIdx+1]);
  }
  else if(op==='delCol'){
    if(row.cells.length<=1){ openInfoModal('Нельзя', 'В таблице должен остаться хотя бы один столбец.'); return; }
    rows.forEach(r=>{ if(r.cells[colIdx]) r.cells[colIdx].remove(); });
    focusTableCell(row.cells[Math.min(colIdx, row.cells.length-1)]);
  }
  else if(op==='toggleHeader'){
    const first = table.rows[0];
    const isHeader = first.cells[0] && first.cells[0].tagName==='TH';
    Array.from(first.cells).forEach(c=>{
      const nc = document.createElement(isHeader ? 'td' : 'th');
      nc.innerHTML = c.innerHTML;
      c.replaceWith(nc);
    });
    if(row === first) focusTableCell(first.cells[Math.min(colIdx, first.cells.length-1)]);
  }
  else if(op==='delTable'){
    if(!confirm('Удалить таблицу целиком?')) return;
    table.remove();
    ACTIVE_TABLE_CELL = null;
    syncTableTools();
  }
  if(editable) editable.dispatchEvent(new Event('input', {bubbles:true}));
}
function wireTableTools(){
  document.querySelectorAll('.tbl-tools [data-tbl]').forEach(btn=>{
    btn.addEventListener('mousedown',(e)=>e.preventDefault());
    btn.addEventListener('touchstart',(e)=>e.preventDefault(), {passive:false});
    btn.addEventListener('click',()=>tableOp(btn.dataset.tbl));
  });
}

function wireRichToolbars(){
  document.querySelectorAll('.rt-toolbar .rt-btn').forEach(btn=>{
    // preventDefault и на mousedown, и на touchstart — чтобы тап по кнопке не уводил фокус
    // из поля и не схлопывал выделение (на тач-устройствах одного mousedown не хватает).
    btn.addEventListener('mousedown',(e)=>e.preventDefault());
    btn.addEventListener('touchstart',(e)=>e.preventDefault(), {passive:false});
    const run = ()=>{
      const targetField = btn.closest('.rt-toolbar').dataset.for;
      const editable = document.getElementById(targetField) || document.querySelector(`.rt-editable[data-f="${targetField}"]`);
      if(!editable) return;
      editable.focus();
      // восстанавливаем выделение, которое было в этом поле до тапа по кнопке
      if(LAST_RT_RANGE && LAST_RT_FIELD===editable){
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(LAST_RT_RANGE);
      }
      const cmd = btn.dataset.cmd, val = btn.dataset.val || null;
      if(runRichCustomCommand(cmd, val, editable)){
        const selC = window.getSelection();
        if(selC && selC.rangeCount){ LAST_RT_RANGE = selC.getRangeAt(0).cloneRange(); LAST_RT_FIELD = editable; }
        editable.dispatchEvent(new Event('input', {bubbles:true}));
        return;
      }
      try{
        const ok = document.execCommand(cmd, false, val);
        // Safari не поддерживает hiliteColor — там за маркер отвечает backColor
        if(!ok && cmd==='hiliteColor') document.execCommand('backColor', false, val);
      }catch(err){
        if(cmd==='hiliteColor'){ try{ document.execCommand('backColor', false, val); }catch(e2){} }
      }
      editable.dispatchEvent(new Event('input', {bubbles:true}));
      // запоминаем новое выделение, чтобы можно было нажать вторую кнопку подряд
      const sel2 = window.getSelection();
      if(sel2 && sel2.rangeCount){ LAST_RT_RANGE = sel2.getRangeAt(0).cloneRange(); LAST_RT_FIELD = editable; }
    };
    btn.addEventListener('click', run);
  });
  wireTableTools();
}

function resolveTopicByName(catKey, name){
  if(!name) return "general";
  const topics = getCategoryTopics(catKey);
  const found = topics.find(t=>t.name.toLowerCase().trim()===String(name).toLowerCase().trim());
  if(found) return found.id;
  return addTopic(catKey, name);
}

/* ---------- Импорт теории+карточек из JSON (материал от Claude в чате) ---------- */
function importTheoryJSON(key, file, body){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ openInfoModal('Ошибка', 'Файл повреждён или это не JSON. Проверь, что содержимое — валидный JSON, который я тебе дала.'); return; }
    const data = APP_DATA[key];
    const isCustom = !CATEGORY_META.find(m=>m.key===key);
    const fieldKeys = (data.meta.fields || (data.meta.type==='custom'?['front','back','note']:['front','back'])).slice();
    let matCount=0, cardCount=0;

    function pushCards(cardsArr, forcedTopicId){
      (cardsArr||[]).forEach(c=>{
        const topicId = forcedTopicId || resolveTopicByName(key, c.topic);
        const vals = {};
        fieldKeys.forEach(f=>{ vals[f] = (c.fields && c.fields[f]) || ''; });
        const id = uid(key);
        const newCard = Object.assign({id, catKey:key, level:0, next_review:todayISO(), topicId}, vals);
        if(isCustom){ if(!STORE.customCards[key]) STORE.customCards[key]=[]; STORE.customCards[key].push(newCard); }
        else { if(!STORE.extraCards[key]) STORE.extraCards[key]=[]; STORE.extraCards[key].push(newCard); }
        cardCount++;
      });
    }

    // Каждая лекция — ровно один сет карточек: тема сета = тема лекции (resolveTopicByName по названию лекции,
    // либо явно переданный m.topic, если лекция сознательно филится в уже существующую более широкую тему).
    (parsed.materials||[]).forEach(m=>{
      const dateStart = m.dateStart || m.date || todayISO();
      const topicId = m.topic ? resolveTopicByName(key, m.topic) : resolveTopicByName(key, m.title||'Без названия');
      if(!STORE.materials[key]) STORE.materials[key]=[];
      const mat = {
        id:uid('mat'), topicId,
        title: m.title||'Без названия', dateStart, dateEnd: m.dateEnd||'',
        mainQuestions: m.mainQuestions || m.mainQuestion || '',
        keywords: Array.isArray(m.keywords) ? m.keywords : [],
        materialText: m.materialText || '', notes: m.notes || '',
        explanation: m.explanation||'', unclear: m.unclear||'', facts: m.facts||'', connections: m.connections||'', application: m.application||'',
        attachments: Array.isArray(m.attachments) ? m.attachments : [],
        date: dateStart
      };
      scheduleLectureInitial(mat, key, dateStart);
      STORE.materials[key].push(mat);
      matCount++;
      // карточки, вложенные в саму лекцию — все идут в её собственную тему, без исключений
      if(Array.isArray(m.cards) && m.cards.length) pushCards(m.cards, topicId);
    });

    // карточки верхнего уровня, не привязанные ни к одной лекции — старое поведение (тема по c.topic)
    pushCards(parsed.cards, null);

    saveStore();
    buildAllData();
    renderAll();
    openInfoModal('Импорт завершён', `Добавлено материалов: <b>${matCount}</b>, карточек: <b>${cardCount}</b>.`);
  };
  reader.readAsText(file);
}

function theoryToCardDefaults(fieldDefs, material){
  const vals = {};
  fieldDefs.forEach(([f],i)=>{
    if(i===0) vals[f]=material.mainQuestion;
    else if(i===1) vals[f]=material.explanation;
    else if(i===fieldDefs.length-1) vals[f]=[material.connections,material.application].filter(Boolean).join(' ');
    else vals[f]=material.facts||'';
  });
  return vals;
}

/* ==========================================================================
   КОРЗИНА — подстраховка: всё недавно удалённое можно вернуть из раздела Storage.
   ========================================================================== */
const TRASH_LIMIT = 40; // держим корзину небольшой, чтобы не упереться в лимит localStorage
const TRASH_TYPE_LABELS = {
  card:'Карточка', material:'Лекция', notebook:'Тетрадь', note:'Заметка',
  finaltest:'Тест', timerecord:'Запись времени', category:'Предмет'
};
function trashPush(type, label, payload, catKey, sub){
  if(!STORE.trash) STORE.trash = [];
  STORE.trash.unshift({
    id: uid('trash'), type, label: label||'Без названия', sub: sub||'',
    catKey: catKey||null, deletedAt: new Date().toISOString(), payload
  });
  if(STORE.trash.length > TRASH_LIMIT) STORE.trash.length = TRASH_LIMIT;
}
function restoreFromTrash(trashId){
  const i = (STORE.trash||[]).findIndex(t=>t.id===trashId);
  if(i<0) return false;
  const t = STORE.trash[i];
  const p = t.payload || {};
  const key = t.catKey;
  try{
    if(t.type==='card'){
      if(p.mode==='raw'){
        STORE.deletedCards = (STORE.deletedCards||[]).filter(id=>id!==p.cardId);
      } else if(p.mode==='extra'){
        if(!STORE.extraCards[key]) STORE.extraCards[key]=[];
        STORE.extraCards[key].push(p.card);
      } else if(p.mode==='custom'){
        if(!STORE.customCards[key]) STORE.customCards[key]=[];
        STORE.customCards[key].push(p.card);
      }
      if(p.progress) STORE.cardProgress[p.cardId] = p.progress;
      if(p.override) STORE.cardOverrides[p.cardId] = p.override;
      if(p.topicOverride) STORE.cardTopicOverride[p.cardId] = p.topicOverride;
    }
    else if(t.type==='material'){ if(!STORE.materials[key]) STORE.materials[key]=[]; STORE.materials[key].push(p.material); }
    else if(t.type==='notebook'){ if(!STORE.notebooks[key]) STORE.notebooks[key]=[]; STORE.notebooks[key].push(p.notebook); }
    else if(t.type==='note'){ STORE.notes.push(p.note); }
    else if(t.type==='finaltest'){ if(!STORE.finalTests[key]) STORE.finalTests[key]=[]; STORE.finalTests[key].push(p.test); }
    else if(t.type==='timerecord'){ STORE.timeRecords.push(p.record); }
    else if(t.type==='category'){
      STORE.customCategories.push(p.category);
      if(p.cards) STORE.customCards[p.category.key] = p.cards;
      if(p.materials) STORE.materials[p.category.key] = p.materials;
      if(p.notebooks) STORE.notebooks[p.category.key] = p.notebooks;
      if(p.topics) STORE.customTopics[p.category.key] = p.topics;
    }
  }catch(e){ return false; }
  STORE.trash.splice(i,1);
  saveStore();
  buildAllData();
  return true;
}

function deleteCard(key, cardId){
  const isCustom = !CATEGORY_META.find(m=>m.key===key);
  const card = findCard(key, cardId);
  const face = card ? renderCardFace((APP_DATA[key]&&APP_DATA[key].meta.type)||'custom', card) : null;
  const payload = {
    cardId,
    progress: STORE.cardProgress[cardId] || null,
    override: STORE.cardOverrides[cardId] || null,
    topicOverride: STORE.cardTopicOverride[cardId] || null
  };
  if(isCustom){
    const stored = (STORE.customCards[key]||[]).find(c=>c.id===cardId);
    payload.mode = 'custom'; payload.card = stored ? JSON.parse(JSON.stringify(stored)) : null;
    if(STORE.customCards[key]) STORE.customCards[key] = STORE.customCards[key].filter(c=>c.id!==cardId);
  } else {
    const extraArr = STORE.extraCards[key]||[];
    const stored = extraArr.find(c=>c.id===cardId);
    if(stored){
      payload.mode = 'extra'; payload.card = JSON.parse(JSON.stringify(stored));
      STORE.extraCards[key] = extraArr.filter(c=>c.id!==cardId);
    } else {
      payload.mode = 'raw';
      if(!STORE.deletedCards.includes(cardId)) STORE.deletedCards.push(cardId);
    }
  }
  trashPush('card', (face && stripHtml(face.top)) || 'Карточка', payload, key, getCategoryDisplayName(key));
  delete STORE.cardProgress[cardId];
  delete STORE.cardOverrides[cardId];
  delete STORE.cardTopicOverride[cardId];
  const mi = STORE.mistakeIds.indexOf(cardId); if(mi>-1) STORE.mistakeIds.splice(mi,1);
  saveStore();
  buildAllData();
  renderAll();
}

  const gate = document.getElementById('authGate');
  if(!gate) return;
  if(STORE.auth && STORE.auth.name){
    gate.classList.add('hidden');
    renderAuthGreeting();
    return;
  }
  gate.classList.remove('hidden');
  const nameInput = document.getElementById('authName');
  const passInput = document.getElementById('authPass');
  const errEl = document.getElementById('authError');
  const submit = ()=>{
    const name = nameInput.value.trim();
    const pass = passInput.value.trim().toLowerCase();
    if(!name){ errEl.textContent = 'Введи имя и фамилию'; nameInput.focus(); return; }
    const ok = ACCESS_CODES.some(c=>c.toLowerCase()===pass);
    if(!ok){
      errEl.textContent = 'Неверный пароль';
      passInput.value = '';
      passInput.focus();
      return;
    }
    STORE.auth = { name, loginAt: new Date().toISOString() };
    saveStore();
    gate.classList.add('hidden');
    renderAuthGreeting();
    openWelcomeModal(name);
  };
  document.getElementById('authSubmit').onclick = submit;
  [nameInput, passInput].forEach(inp=>inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); }));
  nameInput.focus();
}

document.getElementById('coverBanner').addEventListener('click', (e)=>{
  if(e.target.closest('#coverRemove')) return;
  document.getElementById('coverInput').click();
});
document.getElementById('coverRemove').addEventListener('click', (e)=>{
  e.stopPropagation();
  STORE.coverImage = null;
  saveStore();
  applyCoverImage();
});
document.getElementById('coverInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Сохраняем оригинальное разрешение (до разумного предела) и максимально
      // высокое качество JPEG — полоса тонкая, но retina-экраны показывают её чётко.
      const maxW = Math.min(img.width, 3000);
      const scale = maxW / img.width;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      STORE.coverImage = canvas.toDataURL('image/jpeg', 0.97);
      saveStore();
      applyCoverImage();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

function applySidebarWidth(w){
  document.getElementById('app').style.gridTemplateColumns = `${w}px 1fr`;
  document.documentElement.style.setProperty('--sidebar-w', w+'px');
}

(function initSidebarResize(){
  const resizer = document.getElementById('sidebarResizer');
  let dragging = false;
  function start(e){ dragging = true; resizer.classList.add('dragging'); e.preventDefault(); }
  function move(clientX){
    if(!dragging) return;
    const w = Math.min(420, Math.max(190, clientX));
    applySidebarWidth(w);
  }
  function end(){
    if(!dragging) return;
    dragging = false; resizer.classList.remove('dragging');
    const w = parseInt(document.getElementById('app').style.gridTemplateColumns);
    STORE.sidebarWidth = w;
    saveStore();
  }
  resizer.addEventListener('mousedown', start);
  document.addEventListener('mousemove', (e)=>move(e.clientX));
  document.addEventListener('mouseup', end);
  resizer.addEventListener('touchstart', (e)=>start(e), {passive:false});
  document.addEventListener('touchmove', (e)=>{ if(dragging && e.touches[0]) move(e.touches[0].clientX); }, {passive:false});
  document.addEventListener('touchend', end);
})();

/* ---------- Линия под подзаголовком: пересчитывается от реальной ширины текста,
   а не от захардкоженных px — иначе съезжает при ресайзе сайдбара ---------- */
(function initBrandDivider(){
  const brand = document.querySelector('.brand');
  const h1 = document.querySelector('.brand h1');
  const sub = document.querySelector('.brand .sub');
  const divider = document.querySelector('.brand-divider');
  if(!brand || !h1 || !sub || !divider) return;
  const MM = 96/25.4; // 1мм в css-px
  const GAP_BELOW = 1.48; // фиксированный зазор линия→подзаголовок — двигаются как единый блок

  // Ширину текста меряем через отсоединённый от потока клон (position:absolute
  // внутри .brand), а не изменяя width у настоящего .sub — иначе .brand на
  // мгновение меняет размер, ResizeObserver, который следит за .brand, ловит
  // это сам и на некоторых мобильных браузерах уходит в гонку/неправильный кадр,
  // из-за чего линия иногда «подпрыгивает» выше логотипа.
  function measureIntrinsicWidth(){
    const clone = sub.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.visibility = 'hidden';
    clone.style.pointerEvents = 'none';
    clone.style.width = 'max-content';
    clone.style.margin = '0';
    clone.style.left = '0';
    clone.style.top = '0';
    brand.appendChild(clone);
    const w = clone.getBoundingClientRect().width;
    brand.removeChild(clone);
    return w;
  }

  function layout(){
    const brandRect = brand.getBoundingClientRect();
    if(!brandRect.width) return; // сайдбар свёрнут — блок скрыт, считать нечего

    const subRect = sub.getBoundingClientRect();
    const textWidth = measureIntrinsicWidth();

    const left = (subRect.left - brandRect.left) - MM;
    const maxWidth = brandRect.width - left - 4;
    const width = Math.max(0, Math.min(textWidth + MM*2, maxWidth));
    const top = (subRect.top - brandRect.top) - GAP_BELOW;

    divider.style.left = left + 'px';
    divider.style.width = width + 'px';
    divider.style.top = top + 'px';
  }

  // На iOS при повороте экрана env(safe-area-inset-top) какое-то время отдаёт
  // старое/промежуточное значение, а ResizeObserver может не поймать момент,
  // когда оно наконец устоится — поэтому после поворота досчитываем layout()
  // ещё несколько раз с задержкой, а не полагаемся только на один кадр.
  function relayoutSoon(){
    layout();
    requestAnimationFrame(layout);
    setTimeout(layout, 150);
    setTimeout(layout, 400);
    setTimeout(layout, 800);
  }

  new ResizeObserver(layout).observe(brand);
  window.addEventListener('orientationchange', relayoutSoon);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', relayoutSoon);
  document.fonts && document.fonts.ready.then(layout);
  layout();
})();
