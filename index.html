    {topic:"Всемирная история: до 1945 года", title:"Мировые войны: причины и последствия (1914–1945)",
      mainQuestions:`<p>Как экономические последствия Версаля привели ко Второй мировой войне? Почему Лига Наций не смогла предотвратить катастрофу?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Тридцать лет между 1914 и 1945 годами полностью пересобрали мировой порядок — от империй к системе наций под эгидой международных организаций.</p>
<h3>Путь к катастрофе</h3><p><b>Балканские войны</b> (1912–1913) обострили противоречия накануне <b>Первой мировой войны</b> (1914–1918). <b>Версальский договор</b> (1919) наложил репарации на Германию, тяготы которых способствовали приходу Гитлера к власти в 1933 году.</p>
<h3>Провал превентивной дипломатии</h3><p><b>Лига Наций</b> (1920) стала первой всемирной организацией коллективной безопасности, но её слабость и <b>Мюнхенское соглашение</b> (1938) не смогли предотвратить <b>Вторую мировую войну</b> (1939–1945).</p>
<h3>Новый порядок из пепла</h3><p><b>Ялтинская конференция</b> (1945) определила послевоенные сферы влияния; в том же году создана <b>ООН</b>, а <b>Нюрнбергский процесс</b> заложил основы международного уголовного права.</p>
<h3>Что запомнить</h3><ul><li>Версаль (1919) → кризис → приход Гитлера (1933) → Вторая мировая (1939).</li><li>Лига Наций — предшественница ООН, провалилась без участия США.</li><li>1945: Ялта + ООН + Нюрнберг — три опоры нового порядка.</li></ul>`,
      facts:`<p>Атомные бомбардировки Хиросимы и Нагасаки в 1945 году остаются единственным в истории случаем боевого применения ядерного оружия.</p>`,
      connections:`<p>Связь с «Правом»: Нюрнбергский процесс, jus ad bellum. Связь с «Литературой»: «На Западном фронте без перемен» Ремарка.</p>`,
      application:`<p>Причинно-следственную цепочку Версаль→кризис→Гитлер→война используй как готовый пример анализа исторических причин в эссе.</p>`},
    {topic:"Всемирная история: после 1945 года", title:"Холодная война: причины и логика конфронтации",
      mainQuestions:`<p>Чем прямая конфронтация отличалась от опосредованных конфликтов холодной войны? Что показал Карибский кризис?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Холодная война — особая логика идеологического противостояния, определившая мировую политику на 45 лет.</p>
<h3>Начало противостояния</h3><p>Фултонская речь Черчилля и доктрина Трумэна (1946–1947) обозначили начало <b>холодной войны</b>. <b>Хельсинкский заключительный акт</b> (1975) закрепил принципы безопасности и нерушимости границ в Европе.</p>
<h3>Кризисы на грани войны</h3><p><b>Карибский кризис</b> (1962) — ядерное противостояние из-за размещения ракет на Кубе, подтолкнувшее к <b>Договору о нераспространении ядерного оружия</b> (1968).</p>
<h3>Опосредованные конфликты</h3><p><b>Вьетнамская война</b> (1955–1975) — классический пример конфликта сверхдержав через третьи страны. <b>Договор о космосе</b> (1967) — пример превентивного регулирования новой сферы конфронтации.</p>
<h3>Что запомнить</h3><ul><li>1946–47 — начало холодной войны (Фултон, доктрина Трумэна).</li><li>Карибский кризис (1962) → разрядка → ДНЯО (1968).</li><li>Вьетнам — пример опосредованного конфликта сверхдержав.</li></ul>`,
      facts:`<p>Договор о космосе 1967 года запрещает размещение оружия массового поражения на орбите — редкий пример упреждающего международного регулирования.</p>`,
      connections:`<p>Связь с «Правом»: право на самооборону, коллективная оборона. Связь с «Лингвострановедением»: НАТО, ОБСЕ.</p>`,
      application:`<p>При анализе холодной войны различай прямую конфронтацию (Карибский кризис) и опосредованную (Вьетнам).</p>`},
    {topic:"Всемирная история: после 1945 года", title:"Деколонизация и новый мировой порядок",
      mainQuestions:`<p>Как деколонизация изменила состав ООН? Что связывает Бреттон-Вудс и современную мировую экономику?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Вторая половина XX века — время, когда карта мира почти утроилась по числу независимых государств за счёт деколонизации.</p>
<h3>Волна независимости</h3><p><b>Деколонизация Азии и Африки</b> (1950–1970-е) изменила состав ООН. Символические вехи — провозглашение <b>Государства Израиль</b> (1948) и <b>Суэцкий кризис</b> (1956), обозначивший закат колониального влияния Британии и Франции.</p>
<h3>Новый международный порядок</h3><p><b>Бреттон-Вудская конференция</b> (1944) создала МВФ и Всемирный банк. Позже возникла <b>ВТО</b> (1995) как преемница ГАТТ.</p>
<h3>Конец биполярного мира</h3><p><b>Падение Берлинской стены</b> (1989) символически завершило холодную войну; <b>распад СССР</b> (1991) породил вопросы правопреемства государств.</p>
<h3>Трагедии переходного периода</h3><p><b>Геноцид в Руанде</b> (1994) и <b>Косовский кризис</b> (1999) стали ключевыми кейсами для развития доктрины гуманитарной интервенции.</p>
<h3>Что запомнить</h3><ul><li>Деколонизация 1950–1970-х утроила число государств-членов ООН.</li><li>Бреттон-Вудс (1944) → современная финансовая архитектура.</li><li>1989–1991: падение стены → распад СССР → конец биполярного мира.</li></ul>`,
      facts:`<p>После деколонизации число государств-членов ООН выросло с 51 в 1945 году до более чем 190 к концу XX века.</p>`,
      connections:`<p>Связь с «Географией»: постколониальный федерализм Африки. Связь с «Правом»: критерии государственности, R2P.</p>`,
      application:`<p>При обсуждении «нового мирового порядка» указывай конкретный институт (ООН, Бреттон-Вудс, ВТО), а не только абстрактные принципы.</p>`},
    {topic:"История России: до 1917 года", title:"Россия до 1917: становление государства и реформы",
      mainQuestions:`<p>Как чередование централизации и реформ формировало российскую государственность? Что связывает Судебник 1497 года и Судебную реформу 1864 года?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Российская государственность формировалась через чередование централизации, кризисов и масштабных реформ.</p>
<h3>От Древней Руси к Московскому царству</h3><p><b>Крещение Руси</b> (988) интегрировало страну в византийскую культурную орбиту. <b>Монгольское нашествие</b> (1237–1240) и <b>Стояние на реке Угре</b> (1480) определили специфику российской государственности. <b>Судебник Ивана III</b> (1497) стал первым общерусским сводом законов.</p>
<h3>Империя и её законодательство</h3><p><b>Реформы Петра I</b> (1696–1725) завершились провозглашением империи в 1721 году. Кодификация Сперанского в 1830-х создала первое системное Полное собрание законов.</p>
<h3>Великие реформы Александра II</h3><p><b>Отмена крепостного права</b> (1861) и <b>судебная реформа</b> (1864, суд присяжных) — важнейшие правовые преобразования империи.</p>
<h3>Кризис империи</h3><p><b>Кровавое воскресенье</b> (1905) стало триггером Первой русской революции, приведшей к Манифесту 17 октября и учреждению Государственной думы.</p>
<h3>Что запомнить</h3><ul><li>Судебник 1497 → кодификация Сперанского 1830-х → Судебная реформа 1864.</li><li>1861 (отмена крепостного права) — ключевая правовая реформа империи.</li><li>1905 → Дума — первый опыт российского парламентаризма.</li></ul>`,
      facts:`<p>Судебная реформа 1864 года ввела в России суд присяжных и принцип состязательности процесса — прямое заимствование передовых европейских стандартов.</p>`,
      connections:`<p>Связь с «Литературой»: «Воскресение» Толстого. Связь с «Правом»: судебный прецедент, кодификация.</p>`,
      application:`<p>При вопросах о правовых реформах России указывай пару реформа-дата и её конкретное содержание.</p>`},
    {topic:"История России: 1917 год — наши дни", title:"Россия 1917–1991: революция и советский период",
      mainQuestions:`<p>Как формально демократическая конституция 1936 года сочеталась с Большим террором? Что привело от НЭПа к форсированной индустриализации?</p>`,
      materialText:`<h3>Почему это важно</h3><p>Советский период — время радикального правового и политического эксперимента, чьи последствия определяют постсоветское пространство по сей день.</p>
<h3>1917 год: два переворота</h3><p><b>Февральская революция</b> свергла монархию; <b>Октябрьская революция</b> привела к власти большевиков. <b>Корниловский мятеж</b> ослабил Временное правительство.</p>
<h3>От Гражданской войны к НЭПу</h3><p><b>Брестский мир</b> (1918) вывел Россию из мировой войны. После <b>Гражданской войны</b> (1918–1922) и образования <b>СССР</b> (1922) была введена <b>НЭП</b> (1921–1928).</p>
<h3>Форсированная модернизация и террор</h3><p><b>Индустриализация и коллективизация</b> (1928–1937) сопровождались массовыми жертвами; <b>Большой террор</b> (1937–1938) стал темой произведений Солженицына и Шаламова. Формально демократичная <b>Конституция СССР 1936 года</b> контрастировала с практикой репрессий.</p>
<h3>От войны к распаду</h3><p><b>Великая Отечественная война</b> (1941–1945) стала решающим вкладом СССР в разгром нацизма. <b>Перестройка</b> Горбачёва (1985–1991) привела к <b>распаду СССР</b> в 1991 году.</p>
<h3>Что запомнить</h3><ul><li>1917: Февраль (монархия пала) → Октябрь (большевики у власти).</li><li>НЭП (1921) → форсированная модернизация (1928) → Большой террор (1937).</li><li>Перестройка (1985) → распад СССР (1991).</li></ul>`,
      facts:`<p>Конституция СССР 1936 года формально провозглашала одни из самых широких демократических прав своего времени — на фоне разворачивавшегося одновременно Большого террора.</p>`,
      connections:`<p>Связь с «Литературой»: «Архипелаг ГУЛАГ», «Колымские рассказы». Связь с «Правом»: nullum crimen sine lege.</p>`,
      application:`<p>При анализе советского права сопоставляй формальный текст закона/конституции с реальной правоприменительной практикой.</p>`},
    {topic:"История России: 1917 год — наши дни", title:"Россия после 1991: новая государственность",
      mainQuestions:`<p>Почему Россия — «государство-продолжатель», а не просто одно из правопреемников СССР? Что изменило вступление в Совет Европы?</p>`,
      materialText:`<h3>Почему это важно</h3><p>1990-е и 2000-е годы — период формирования новой российской государственности и её места в международно-правовой системе.</p>
<h3>Правопреемство и новая конституция</h3><p>После <b>распада СССР</b> (1991) Россия была признана государством-продолжателем СССР, сохранив место в Совбезе ООН. <b>Конституция РФ</b> (1993) закрепила принципы правового государства и разделения властей.</p>
<h3>Интеграция в европейские институты</h3><p><b>Вступление России в Совет Европы</b> (1996) означало признание юрисдикции ЕСПЧ на территории страны.</p>
<h3>Что запомнить</h3><ul><li>Россия — государство-продолжатель СССР (не «новое» государство).</li><li>Конституция РФ 1993 года — действующая правовая основа страны.</li><li>1996 — вступление в Совет Европы и признание юрисдикции ЕСПЧ.</li></ul>`,
      facts:`<p>Статус «государства-продолжателя» позволил России сохранить весь комплекс прав и обязательств СССР без процедуры нового приёма в международные организации.</p>`,
      connections:`<p>Связь с «Правом»: правопреемство государств, ЕСПЧ. Связь с «Юридическим английским»: state succession, ratification.</p>`,
      application:`<p>Чётко различай «государство-продолжатель» (Россия/СССР) и обычное «правопреемство» (остальные бывшие республики) — специфический и часто проверяемый нюанс.</p>`}
  ]
};

function seedLecturePack(){
  if(STORE.contentPackV1) return;
  Object.keys(LECTURE_SEED).forEach(key=>{
    if(!APP_DATA[key]) return;
    if(!STORE.materials[key]) STORE.materials[key]=[];
    LECTURE_SEED[key].forEach(m=>{
      const topicId = resolveTopicByName(key, m.topic);
      STORE.materials[key].push({
        id: uid('mat'), topicId,
        title: m.title, dateStart: todayISO(), dateEnd: '',
        mainQuestions: m.mainQuestions, keywords: [], materialText: m.materialText, notes: '',
        explanation: '', facts: m.facts, connections: m.connections, application: m.application,
        date: todayISO()
      });
    });
  });
  STORE.contentPackV1 = true;
  saveStore();
}

/* ==========================================================================
   20C. СИД: ПЛАН НА 10 ДНЕЙ — прямо в календарь и в планер
   Начинается со следующего дня после первого запуска после обновления.
   ========================================================================== */
const TEN_DAY_PLAN = [
  {subjects:['geo','law'],   lectures:{geo:[0,1,2], law:[0,1]}},
  {subjects:['geo','law'],   lectures:{geo:[3,4],   law:[2,3,4]}},
  {subjects:['latin','law'], lectures:{latin:[0,1,2], law:[5,6]}},
  {subjects:['latin','legal'], lectures:{latin:[3,4], legal:[0,1,2]}},
  {subjects:['legal','hist'], lectures:{legal:[3,4], hist:[0,1,2]}},
  {subjects:['hist','lit'],  lectures:{hist:[3,4,5,6], lit:[0]}},
  {subjects:['lit','art'],   lectures:{lit:[1,2,3,4], art:[0]}},
  {subjects:['art','ita'],   lectures:{art:[1,2,3,4], ita:[0]}},
  {subjects:['ita','lingvo'], lectures:{ita:[1,2,3,4], lingvo:[0]}},
  {subjects:['lingvo'], lectures:{lingvo:[1,2]}, review:true}
];

function seedTenDayPlan(){
  if(STORE.planPackV1) return;
  const catNames = {}; CATEGORY_META.forEach(m=>catNames[m.key]=m.name);
  const colors = ['wine','khaki','accent','good','bad'];
  TEN_DAY_PLAN.forEach((day,i)=>{
    const date = addDays(todayISO(), i);
    const dayNum = i+1;
    const subjLabel = day.subjects.map(s=>catNames[s]).join(' + ');

    STORE.calEvents.push({id:uid('ev'), title:`10 дней · День ${dayNum}: ${subjLabel}`, date, time:'', place:'', category:'Другое', color:colors[i%colors.length]});

    Object.keys(day.lectures).forEach(key=>{
      day.lectures[key].forEach(idx=>{
        const lec = LECTURE_SEED[key] && LECTURE_SEED[key][idx];
        if(!lec) return;
        STORE.planTasks.push({id:uid('plan'), done:false, createdDate:todayISO(), date,
          text:`Лекция: ${catNames[key]} — ${lec.title}`, tier:'min', quadrant:'uiq', deadline:null});
        // сразу отправляем лекцию в spaced repetition — первое повторение через день после её чтения по плану
        const m = STORE.materials[key] && STORE.materials[key][idx];
        if(m) scheduleLectureInitial(m, key, date);
      });
    });
    day.subjects.forEach(key=>{
      STORE.planTasks.push({id:uid('plan'), done:false, createdDate:todayISO(), date,
        text:`Повторить 20 карточек: ${catNames[key]}`, tier:'min', quadrant:'uiq', deadline:null});
    });
    day.subjects.forEach(key=>{
      STORE.planTasks.push({id:uid('plan'), done:false, createdDate:todayISO(), date,
        text:`Практика: ${catNames[key]} (15 заданий + разбор кейса)`, tier:'max', quadrant:'inq', deadline:null});
    });
    if(day.review){
      STORE.planTasks.push({id:uid('plan'), done:false, createdDate:todayISO(), date,
        text:`Финальный повтор: карточки и WON по всем 9 предметам`, tier:'max', quadrant:'inq', deadline:null});
    }
  });
  STORE.planPackV1 = true;
  saveStore();
}

/* ==========================================================================
   20D. ДЕМО-ЛЕКЦИЯ: одна лекция-пример по истории, чтобы сразу было видно,
   как выглядит заполненный конспект и что вообще писать в каждом поле.
   Ставится один раз для нового человека; у тех, у кого уже разблокирован
   полный контент-пак, не появляется вообще.
   ========================================================================== */
function seedDemoLecture(){
  if(STORE.contentPackV1 || STORE.demoLectureV1) return;
  // Чистая база: предметы, в которых для нового человека вообще ничего нет, по умолчанию скрыты,
  // чтобы список не был забит пустыми разделами. Любой из них возвращается в
  // «Управление категориями» → «Скрытые встроенные предметы» → «Вернуть».
  if(!STORE.hiddenCategories) STORE.hiddenCategories = [];
  CATEGORY_META.forEach(meta=>{
    if(DEMO_CARD_COUNTS[meta.key]) return; // история и юр. английский остаются
    if(!STORE.hiddenCategories.includes(meta.key)) STORE.hiddenCategories.push(meta.key);
  });
  if(!STORE.materials.hist) STORE.materials.hist = [];
  const topicId = resolveTopicByName('hist', 'Пример: как заполнять лекцию');
  const m = {
    id: uid('mat'),
    topicId,
    title: 'Вестфальский мир 1648 года',
    dateStart: todayISO(),
    dateEnd: '',
    mainQuestions: 'Что закрепил Вестфальский мир?<br>Почему его считают началом современной системы международного права?',
    keywords: ['Вестфальский мир','суверенитет','принцип невмешательства','Тридцатилетняя война'],
    materialText: `<h3>Что произошло</h3><p>В <b>1648 году</b> серия договоров в Мюнстере и Оснабрюке завершила <b>Тридцатилетнюю войну</b> (1618–1648) — самый разрушительный религиозный конфликт в Европе.</p>
<h3>Что закрепили</h3><ul><li><b>Территориальный суверенитет</b> — власть правителя внутри его границ признаётся высшей.</li><li><b>Принцип невмешательства</b> во внутренние дела других государств.</li><li><b>Юридическое равенство государств</b> — независимо от размера и веры.</li></ul>
<h3>Что запомнить</h3><p>Вестфаль — точка отсчёта <b>Вестфальской системы</b>: мира суверенных государств, договаривающихся между собой как формально равные субъекты.</p>`,
    notes: 'Это лекция-пример. Открой «Изменить», чтобы посмотреть, как заполнены поля, и удали её, когда она станет не нужна.',
    explanation: '<p>До 1648 года верховная власть была спорной: над королём стояли император и Папа. Вестфальский мир зафиксировал, что <b>внутри своих границ государство — высшая власть</b>, а между собой государства равны. Из этой идеи выросло всё современное международное право.</p>',
    facts: `<h3>Факты</h3><ul><li>Переговоры шли <b>пять лет</b> и стали первым в истории общеевропейским мирным конгрессом.</li><li>Стороны заседали в двух городах сразу — католики и протестанты не хотели встречаться лично.</li></ul>
<h3>Что ещё изучить</h3><ul><li>Гуго Гроций, «О праве войны и мира» (1625) — теоретическая база Вестфаля.</li><li>Венский конгресс 1815 года — следующая перестройка европейского порядка.</li></ul>
<h3>Совет</h3><p>«Вестфальский суверенитет» — выражение, которое почти всегда уместно в эссе о том, откуда взялась современная государственность.</p>`,
    connections: '<ul><li><b>Право:</b> суверенитет и невмешательство — статья 2 Устава ООН.</li><li><b>Литература:</b> «Симплициссимус» Гриммельсгаузена — Тридцатилетняя война изнутри.</li><li><b>География:</b> политическая карта Европы после 1648 года.</li></ul>',
    application: `<h3>Где использовать</h3><p><b>В эссе о суверенитете:</b> начинай отсчёт с 1648 года — это показывает, что ты понимаешь, что суверенитет не «был всегда», а появился исторически, как ответ на разрушительную войну.</p>
<p><b>В споре о вмешательстве во внутренние дела:</b> вестфальский принцип невмешательства — это аргумент одной стороны; ему противостоит современная концепция гуманитарной интервенции и R2P. Показать оба полюса — сильный ход.</p>
<p><b>Связь с главными вопросами:</b> «что закрепил» → суверенитет, невмешательство, равенство государств; «почему начало международного права» → потому что впервые появились субъекты, равные юридически, а значит стало возможно право <i>между</i> ними, а не право сильного над слабым.</p>`,
    date: todayISO()
  };
  scheduleLectureInitial(m, 'hist', todayISO());
  STORE.materials.hist.push(m);
  STORE.demoLectureV1 = true;
  saveStore();
}

applyTheme();

buildAllData();
seedDemoLecture();
