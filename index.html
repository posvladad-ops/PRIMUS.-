/* ==========================================================================
   6. SPACED REPETITION + AURA + РНО (интегрированная логика review)
   ========================================================================== */
function awardAura(amount){ STORE.aura = Math.max(0, (STORE.aura||0) + amount); }
function getLevelInfo(){
  const aura = STORE.aura||0;
  const level = Math.floor(aura/200) + 1;
  const into = aura % 200;
  return { level, aura, into, need:200 };
}
function todayProgress(){
  const d = todayISO();
  if(!STORE.dailyProgress[d]) STORE.dailyProgress[d] = {learned:0,tasks:0,rno:0,bonusGiven:false};
  return STORE.dailyProgress[d];
}

function bumpDaily(kind){
  const p = todayProgress();
  p[kind] = (p[kind]||0)+1;
  checkDailyBonus();
}
function checkDailyBonus(){
  const p = todayProgress();
  if(!p.bonusGiven && p.learned>=STORE.dailyGoals.learned && p.tasks>=STORE.dailyGoals.tasks && p.rno>=STORE.dailyGoals.rno){
    p.bonusGiven = true;
    awardAura(30);
    bumpStreak();
  }
}
function bumpStreak(){
  const today = todayISO();
  const yesterday = addDays(today,-1);
  if(STORE.lastActiveDate===yesterday) STORE.streak = (STORE.streak||0)+1;
  else if(STORE.lastActiveDate!==today) STORE.streak = 1;
  STORE.lastActiveDate = today;
}
function markMistake(cardId){ if(!STORE.mistakeIds.includes(cardId)) STORE.mistakeIds.push(cardId); }
function clearMistakeIfMastered(card){
  if(card.level>=3){
    const i=STORE.mistakeIds.indexOf(card.id);
    if(i>-1){ STORE.mistakeIds.splice(i,1); STORE.fixedMistakes = (STORE.fixedMistakes||0)+1; }
  }
}

// Ставит в планер на дату повторения одну сводную задачу на категорию — не плодит
// по задаче на каждую карточку, а просто отмечает «в этот день по расписанию
// spaced repetition нужно кое-что повторить по этому предмету».
function scheduleSpacedReviewReminder(catKey, date){
  if(!STORE.planTasks) STORE.planTasks = [];
  const exists = STORE.planTasks.some(t=>t.srAuto && t.srCat===catKey && t.date===date && !t.done);
  if(exists) return;
  const name = getCategoryDisplayName(catKey);
  STORE.planTasks.push({
    id: uid('plan'), done:false, createdDate:todayISO(), date,
    text: `Повторение: ${name} (spaced repetition)`, tier:'min', quadrant:'uiq', deadline:null,
    srAuto:true, srCat:catKey
  });
}

function review(card, correct, ctx){
  ctx = ctx || {};
  const today = todayISO();
  if(correct){
    card.level = (card.level||0) + 1;
    const intervals = [1,3,7,14,30];
    const days = intervals[Math.min(card.level, intervals.length-1)];
    card.next_review = addDays(today, days);
    if(card.level>=3){
      if(!STORE.learnLog[today]) STORE.learnLog[today]=[];
      if(!STORE.learnLog[today].includes(card.id)){ STORE.learnLog[today].push(card.id); bumpDaily("learned"); }
      clearMistakeIfMastered(card);
    }
    if(card.catKey) scheduleSpacedReviewReminder(card.catKey, card.next_review);
    awardAura(5);
  } else {
    card.level = 0;
    card.next_review = today;
    if(!ctx.skipMistake) markMistake(card.id);
    awardAura(1);
  }
  bumpDaily("tasks");
  if(ctx.isRno) bumpDaily("rno");
  STORE.cardProgress[card.id] = { level:card.level, next_review:card.next_review };
  saveStore();
}

function findCard(catKey, cardId){
  if(!cardId || !APP_DATA[catKey]) return null;
  return APP_DATA[catKey].cards.find(c=>c.id===cardId) || null;
}
function allCategoryKeys(){ return Object.keys(APP_DATA); }
function allCards(){ return allCategoryKeys().flatMap(k=>APP_DATA[k].cards); }
function hasProgress(card){ return !!STORE.cardProgress[card.id]; }
function reviewDueCards(){
  return allCards().filter(c=>hasProgress(c) && !STORE.mistakeIds.includes(c.id) && c.next_review<=todayISO());
}
function rnoDueCards(){
  return allCards().filter(c=>STORE.mistakeIds.includes(c.id) && c.next_review<=todayISO());
}

function renderTrashBlock(main){
  const wrap = document.getElementById('trashBlock');
  if(!wrap) return;
  const trash = STORE.trash || [];
  let html = `<h3 style="font-family:var(--font-display);font-size:16px;margin-bottom:6px">Корзина</h3>
    <div class="desc" style="margin-bottom:12px">Последнее удалённое — на случай, если удалили случайно. Хранятся ${TRASH_LIMIT} последних записей.</div>`;
  if(trash.length===0){
    html += `<div class="empty-state">Корзина пуста.</div>`;
    wrap.innerHTML = html;
    return;
  }
  html += `<div class="btn-row" style="margin-bottom:12px"><button class="btn" id="btnClearTrash">Очистить корзину</button></div>`;
  trash.forEach(t=>{
    const when = t.deletedAt ? fmtDate(t.deletedAt.slice(0,10)) : '';
    html += `<div class="trash-row">
      <span class="trash-type">${esc(TRASH_TYPE_LABELS[t.type]||t.type)}</span>
      <span class="trash-label">${esc(t.label)}${t.sub?` <span style="color:var(--text-faint)">· ${esc(t.sub)}</span>`:''}</span>
      <span class="trash-date">${esc(when)}</span>
      <button class="btn btn-good" data-restore-trash="${t.id}">Вернуть</button>
      <button class="icon-btn" data-purge-trash="${t.id}">Удал.</button>
    </div>`;
  });
  wrap.innerHTML = html;
  document.getElementById('btnClearTrash').onclick=()=>{
    if(!confirm('Очистить корзину полностью? После этого вернуть уже ничего нельзя — это безвозвратно.')) return;
    STORE.trash = []; saveStore(); renderTrashBlock(main);
  };
  wrap.querySelectorAll('[data-restore-trash]').forEach(btn=>btn.onclick=()=>{
    if(restoreFromTrash(btn.dataset.restoreTrash)){ renderAll(); }
    else openInfoModal('Не получилось', 'Не удалось вернуть эту запись.');
  });
  wrap.querySelectorAll('[data-purge-trash]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Удалить эту запись из корзины навсегда? Это безвозвратно.')) return;
    STORE.trash = (STORE.trash||[]).filter(t=>t.id!==btn.dataset.purgeTrash);
    saveStore(); renderTrashBlock(main);
  });
}

/* ---------- Progress: Aura + планер + матрица + календарь + кольца ---------- */
let PLAN_WEEK_OFFSET = 0;
let PLAN_SELECTED_DATE = todayISO();

function weekStart(offsetWeeks){
  const d = new Date(todayISO()+"T00:00:00");
  let dow = d.getDay(); dow = dow===0?6:dow-1; // Пн=0
  d.setDate(d.getDate() - dow + offsetWeeks*7);
  return toISO(d);
}
function fmtPlanDate(iso){
  if(iso===todayISO()) return 'сегодня';
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function checkPlanDayBonus(dateIso){
  const dayTasks = STORE.planTasks.filter(t=>t.date===dateIso);
  if(dayTasks.length===0) return;
  if(!dayTasks.every(t=>t.done)) return;
  if(!STORE.dailyProgress[dateIso]) STORE.dailyProgress[dateIso]={};
  if(!STORE.dailyProgress[dateIso].bonusGiven){
    STORE.dailyProgress[dateIso].bonusGiven = true;
    awardAura(30);
    bumpStreak();
  }
}

function renderWeekStrip(){
  const wrap = document.getElementById('weekStrip');
  if(!wrap) return;
  const start = weekStart(PLAN_WEEK_OFFSET);
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let html = `<button class="mini-btn" id="weekPrev">‹</button><div class="week-days">`;
  for(let i=0;i<7;i++){
    const iso = addDays(start,i);
    const dp = STORE.dailyProgress[iso];
    const done = dp && dp.bonusGiven;
    const isSel = iso===PLAN_SELECTED_DATE;
    const d = new Date(iso+"T00:00:00");
    html += `<div class="week-day-pick ${isSel?'active':''} ${done?'done':''}" data-date="${iso}">
      <div class="wd-label">${days[i]}</div><div class="wd-num">${d.getDate()}</div>
    </div>`;
  }
  html += `</div><button class="mini-btn" id="weekNext">›</button>`;
  wrap.innerHTML = html;
  document.getElementById('weekPrev').onclick=()=>{ PLAN_WEEK_OFFSET--; renderWeekStrip(); };
  document.getElementById('weekNext').onclick=()=>{ PLAN_WEEK_OFFSET++; renderWeekStrip(); };
  wrap.querySelectorAll('.week-day-pick').forEach(el=>el.onclick=()=>{
    PLAN_SELECTED_DATE = el.dataset.date;
    renderWeekStrip(); renderPlanLists();
  });
}

function renderPlanLists(){
  const minWrap = document.getElementById('planMin');
  const maxWrap = document.getElementById('planMax');
  if(!minWrap) return;
  const dayTasks = STORE.planTasks.filter(t=>t.date===PLAN_SELECTED_DATE);
  const minTasks = dayTasks.filter(t=>t.tier==='min');
  const maxTasks = dayTasks.filter(t=>t.tier==='max');
  function taskRow(t){
    const quad = EIS_QUADS.find(q=>q.id===t.quadrant);
    return `<div class="plan-task ${t.done?'done':''}" data-id="${t.id}">
      <span class="pt-check" data-toggle="${t.id}">✓</span>
      ${quad?`<span class="pt-quad" style="background:var(--eis-${quad.cls})"></span>`:''}
      <span class="pt-text" data-edit="${t.id}">${esc(t.text)}</span>
      ${t.deadline?`<span class="pt-deadline">${fmtDeadline(t.deadline)}</span>`:''}
      <button class="pt-del" data-del="${t.id}">✕</button>
    </div>`;
  }
  minWrap.innerHTML = minTasks.map(taskRow).join('') || `<div style="font-size:12px;color:var(--text-faint)">На ${esc(fmtPlanDate(PLAN_SELECTED_DATE))} пока пусто</div>`;
  maxWrap.innerHTML = maxTasks.map(taskRow).join('') || `<div style="font-size:12px;color:var(--text-faint)">На ${esc(fmtPlanDate(PLAN_SELECTED_DATE))} пока пусто</div>`;
  document.getElementById('addMin').onclick=()=>openPlanTaskModal('min', null, null);
  document.getElementById('addMax').onclick=()=>openPlanTaskModal('max', null, null);
  [minWrap,maxWrap].forEach(w=>{
    w.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{
      const t = STORE.planTasks.find(x=>x.id===el.dataset.toggle);
      if(t){ t.done=!t.done; checkPlanDayBonus(t.date); saveStore(); renderPlanLists(); renderEisGrid(); }
    });
    w.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{
      if(!confirm('Точно удалить? Это безвозвратно.')) return;
      STORE.planTasks = STORE.planTasks.filter(x=>x.id!==el.dataset.del);
      saveStore(); renderPlanLists(); renderEisGrid();
    });
    w.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{
      const t = STORE.planTasks.find(x=>x.id===el.dataset.edit);
      if(t) openPlanTaskModal(t.tier, t.id, null);
    });
  });
}

let EIS_COLLAPSED = {};
function renderEisGrid(){
  const eisGrid = document.getElementById('eisGrid');
  if(!eisGrid) return;
  eisGrid.innerHTML = EIS_QUADS.map(q=>{
    const items = STORE.planTasks.filter(t=>t.quadrant===q.id && !t.done);
    const chips = items.slice(0,6).map(t=>`<div class="eq-chip" data-edit2="${t.id}"><span class="eq-chip-toggle" data-toggle2="${t.id}">✓</span>${esc(t.text)}${t.date?`<span class="eq-chip-date">${esc(fmtPlanDate(t.date))}</span>`:''}</div>`).join('');
    const collapsed = !!EIS_COLLAPSED[q.id];
    return `<div class="eis-cell ${q.cls} ${collapsed?'collapsed':''}" data-quad="${q.id}">
      <button class="ec-collapse" data-collapse="${q.id}" title="${collapsed?'Развернуть':'Свернуть'}">${collapsed?'▾':'▴'}</button>
      <button class="ec-add" data-quadadd="${q.id}">+</button>
      <div class="ec-label">${q.label}${collapsed && items.length?`<span class="ec-count">${items.length}</span>`:''}</div>
      <div class="ec-chips">${chips || '<div class="eq-empty">Пусто</div>'}</div>
    </div>`;
  }).join('');
  eisGrid.querySelectorAll('[data-collapse]').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    const id = btn.dataset.collapse;
    EIS_COLLAPSED[id] = !EIS_COLLAPSED[id];
    renderEisGrid();
  });
  eisGrid.querySelectorAll('[data-quadadd]').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    openPlanTaskModal('min', null, null, btn.dataset.quadadd);
  });
  eisGrid.querySelectorAll('[data-toggle2]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const t = STORE.planTasks.find(x=>x.id===el.dataset.toggle2);
    if(t){ t.done=true; checkPlanDayBonus(t.date); saveStore(); renderPlanLists(); renderEisGrid(); }
  }));
  eisGrid.querySelectorAll('[data-edit2]').forEach(el=>el.addEventListener('click',()=>{
    const t = STORE.planTasks.find(x=>x.id===el.dataset.edit2);
    if(t) openPlanTaskModal(t.tier, t.id, null);
  }));
}

/* ---------- Экспорт / импорт всего прогресса (перенос между устройствами) ---------- */
function exportStoreJSON(){
  const blob = new Blob([JSON.stringify(STORE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `primus-stud-progress-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  try{ if(typeof URL.revokeObjectURL === 'function') URL.revokeObjectURL(url); }catch(e){}
}
function importStoreJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('Импорт заменит текущий прогресс в этом браузере данными из файла. Продолжить?')) return;
      STORE = Object.assign(defaultStore(), parsed);
      saveStore();
      buildAllData();
      VIEW = 'progress';
      renderAll();
      openInfoModal('Готово', 'Прогресс успешно импортирован.');
    }catch(e){
      openInfoModal('Ошибка', 'Не удалось прочитать файл — убедись, что это экспорт из PRIMUS.');
    }
  };
  reader.readAsText(file);
}

/* ---------- План: базовый минимум / роскошный максимум + матрица Эйзенхауэра ---------- */
const EIS_QUADS = [
  {id:'uiq', label:'Срочно + Важно', cls:'uiq'},
  {id:'inq', label:'Важно + не срочно', cls:'inq'},
  {id:'uniq', label:'Срочно + не важно', cls:'uniq'},
  {id:'ninq', label:'Не срочно + не важно', cls:'ninq'}
];
function daysUntil(iso){
  if(!iso) return null;
  const diff = Math.ceil((new Date(iso+"T00:00:00") - new Date(todayISO()+"T00:00:00")) / 86400000);
  return diff;
}
function fmtDeadline(iso){
  const d = daysUntil(iso);
  if(d===null) return '';
  if(d<0) return `просрочено на ${Math.abs(d)} дн.`;
  if(d===0) return 'сегодня';
  if(d<31) return `через ${d} дн.`;
  const months = Math.round(d/30.4);
  return `через ~${months} мес.`;
}
function openPlanTaskModal(tier, taskId, _unused, presetQuad){
  const editing = taskId ? STORE.planTasks.find(t=>t.id===taskId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${editing?'Изменить задачу':'Новая задача'}</h3>
    <div class="field"><label>Что нужно сделать</label><input id="ptText" value="${editing?esc(editing.text):''}" placeholder="Например: повторить латынь тему Право"></div>
    <div class="field"><label>День</label><input type="date" id="ptDate" value="${editing?(editing.date||todayISO()):PLAN_SELECTED_DATE}"></div>
    <div class="field"><label>Уровень</label><select id="ptTier">
      <option value="min" ${((editing?editing.tier:tier)==='min')?'selected':''}>Базовый минимум</option>
      <option value="max" ${((editing?editing.tier:tier)==='max')?'selected':''}>Роскошный максимум</option>
    </select></div>
    <div class="field"><label>Квадрат матрицы Эйзенхауэра</label><select id="ptQuad">
      <option value="">Без квадрата</option>
      ${EIS_QUADS.map(q=>`<option value="${q.id}" ${((editing?editing.quadrant:presetQuad)===q.id)?'selected':''}>${q.label}</option>`).join('')}
    </select></div>
    <div class="field"><label>Дедлайн (необязательно, для долгосрочных задач)</label><input type="date" id="ptDeadline" value="${editing&&editing.deadline?editing.deadline:''}"></div>

function shareNote(noteId){
  const n = STORE.notes.find(x=>x.id===noteId);

  const text = `${n.title}\n\n${stripHtml(n.body)}`;
  if(navigator.share){
    navigator.share({title:n.title, text}).catch(()=>{});
  } else {
    const blob = new Blob([text], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`${(n.title||'note').replace(/[^a-zа-я0-9]+/gi,'_')}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    try{ URL.revokeObjectURL(url); }catch(e){}
  }
}

/* ---------- Таймер: Pomodoro + Stopwatch ---------- */
let TIMER_MODE = "pomodoro";
let TIMER_STATE = { running:false, seconds:25*60, intervalId:null, subject:"", isBreak:false, stopwatchSeconds:0 };
function renderOvTimer(body){
  body.innerHTML = `
    <div class="timer-tabs">
      <button class="ov-tab ${TIMER_MODE==='pomodoro'?'active':''}" id="tPomodoro">Pomodoro</button>
      <button class="ov-tab ${TIMER_MODE==='stopwatch'?'active':''}" id="tStopwatch">Секундомер</button>
    </div>
    <input class="timer-subject-input" id="timerSubject" placeholder="Над чем работаешь?" value="${esc(TIMER_STATE.subject)}">
    <div class="timer-display-wrap">
      <div class="flip-clock" id="timerDisplay">${flipTilesHtml(fmtSeconds2(TIMER_MODE==='pomodoro'?TIMER_STATE.seconds:TIMER_STATE.stopwatchSeconds))}</div>
    </div>
    <div class="timer-controls">
      ${timerHasProgress() ? `
        <button class="btn btn-timer-primary" id="timerStartPause">${TIMER_STATE.running?'Стоп':'Продолжить'}</button>
        <button class="btn btn-timer-secondary" id="timerFinish">Закончить</button>
      ` : `
        <button class="btn btn-timer-primary" id="timerStartPause">Старт</button>
      `}
      ${TIMER_MODE==='pomodoro'&&TIMER_STATE.running?'<button class="btn btn-timer-ghost" id="pomoSkip">Пропустить</button>':''}
    </div>
    <div class="time-records">
      <h3>Последние записи</h3>
      <div id="recordsList"></div>
    </div>
  `;
  document.getElementById('timerSubject').addEventListener('input',(e)=>{ TIMER_STATE.subject=e.target.value; });
  document.getElementById('tPomodoro').onclick=()=>{ if(TIMER_STATE.running) return; TIMER_MODE='pomodoro'; TIMER_STATE.seconds=25*60; renderOvTimer(body); };
  document.getElementById('tStopwatch').onclick=()=>{ if(TIMER_STATE.running) return; TIMER_MODE='stopwatch'; renderOvTimer(body); };
  document.getElementById('timerStartPause').onclick=()=>toggleTimer(body);
  const finishBtn = document.getElementById('timerFinish');
  if(finishBtn) finishBtn.onclick=()=>finishAndSave(body);
  const skip = document.getElementById('pomoSkip');
  if(skip) skip.onclick=()=>{ finishPomodoroSession(body); };
  renderRecordsList();
}
// Есть ли незафиксированный прогресс (таймер шёл или на паузе, но ещё не сохранён кнопкой «Закончить»).
function timerHasProgress(){
  return TIMER_STATE.running || (TIMER_MODE==='pomodoro' ? TIMER_STATE.seconds < (TIMER_STATE.isBreak?5*60:25*60) : TIMER_STATE.stopwatchSeconds>0);
}
function fmtSeconds2(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const r=s%60;
  return h>0? `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`; }

/* ---------- Flip-clock тайлы для таймера ---------- */
function flipTilesHtml(str){
  return [...str].map(ch=> ch===':'
    ? `<span class="flip-colon">:</span>`
    : `<span class="flip-digit"><span class="flip-digit-inner">${ch}</span></span>`
  ).join('');
}
function updateFlipTime(container, str){
  if(!container) return;
  const tiles = [...container.children];
  const chars = [...str];
  if(tiles.length !== chars.length){ container.innerHTML = flipTilesHtml(str); return; }
  chars.forEach((ch,i)=>{
    const tile = tiles[i];
    if(tile.classList.contains('flip-colon')) return; // разделитель не меняется
    const inner = tile.querySelector('.flip-digit-inner');
    if(inner.textContent !== ch){
      inner.textContent = ch;
      tile.classList.remove('flip');
      void tile.offsetWidth;
      tile.classList.add('flip');
    }
  });
}
function toggleTimer(body){
  if(TIMER_STATE.running){
    clearInterval(TIMER_STATE.intervalId); TIMER_STATE.running=false; renderOvTimer(body); return;
  }
  TIMER_STATE.running = true;
  TIMER_STATE.intervalId = setInterval(()=>{
    if(TIMER_MODE==='pomodoro'){
      TIMER_STATE.seconds--;
      updateFlipTime(document.getElementById('timerDisplay'), fmtSeconds2(TIMER_STATE.seconds));
      const totalLen = TIMER_STATE.isBreak?5*60:25*60;
      const fill = document.getElementById('pomoFill');
      if(fill) fill.style.width = Math.round(100*(1-TIMER_STATE.seconds/totalLen))+'%';
      if(TIMER_STATE.seconds<=0) finishPomodoroSession(body);
    } else {
      TIMER_STATE.stopwatchSeconds++;
      updateFlipTime(document.getElementById('timerDisplay'), fmtSeconds2(TIMER_STATE.stopwatchSeconds));
    }
  },1000);
  renderOvTimer(body);
}
function finishPomodoroSession(body){
  clearInterval(TIMER_STATE.intervalId); TIMER_STATE.running=false;
  if(!TIMER_STATE.isBreak){
    const dur = 25*60 - Math.max(0,TIMER_STATE.seconds);
    if(dur>10) addTimeRecord(TIMER_STATE.subject||'Без темы', dur, 'pomodoro');
  }
  TIMER_STATE.isBreak = !TIMER_STATE.isBreak;
  TIMER_STATE.seconds = TIMER_STATE.isBreak? 5*60 : 25*60;
  renderOvTimer(body);
}
// «Закончить» — останавливает таймер, сохраняет запись (если прошло больше 10 секунд) и сбрасывает к чистому состоянию.
function finishAndSave(body){
  clearInterval(TIMER_STATE.intervalId);
  TIMER_STATE.running=false;
  if(TIMER_MODE==='pomodoro'){
    if(!TIMER_STATE.isBreak){
      const dur = 25*60 - Math.max(0,TIMER_STATE.seconds);
      if(dur>10) addTimeRecord(TIMER_STATE.subject||'Без темы', dur, 'pomodoro');
    }
    TIMER_STATE.seconds=25*60; TIMER_STATE.isBreak=false;
  }
  else {
    if(TIMER_STATE.stopwatchSeconds>10) addTimeRecord(TIMER_STATE.subject||'Без темы', TIMER_STATE.stopwatchSeconds, 'stopwatch');
    TIMER_STATE.stopwatchSeconds=0;
  }
  renderOvTimer(body);
}
function addTimeRecord(subject, seconds, type){
  STORE.timeRecords.push({id:uid('rec'), subject, seconds, date:todayISO(), type});
  saveStore();
}
function renderRecordsList(){
  const list = document.getElementById('recordsList');
  if(!list) return;
  const recent = STORE.timeRecords.slice().reverse().slice(0,15);
  list.innerHTML = recent.length ? recent.map(r=>`
    <div class="time-record-row"><span class="tr-subject">${esc(r.subject)} <span style="color:var(--text-faint);font-size:10px">(${r.type==='pomodoro'?'Pomodoro':'Секундомер'})</span></span><span class="tr-dur">${fmtSeconds2(r.seconds)} · ${fmtDate(r.date)}</span><button class="icon-btn" data-delrec="${r.id}" title="Удалить">Удал.</button></div>
  `).join('') : `<div style="font-size:12px;color:var(--text-faint)">Записей пока нет</div>`;
  list.querySelectorAll('[data-delrec]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Удалить эту запись? Её можно будет вернуть из корзины в разделе Storage.')) return;
    const rec = STORE.timeRecords.find(x=>x.id===btn.dataset.delrec);
    if(rec) trashPush('timerecord', rec.subject, {record:JSON.parse(JSON.stringify(rec))}, null, `${fmtSeconds2(rec.seconds)} · ${fmtDate(rec.date)}`);
    STORE.timeRecords = STORE.timeRecords.filter(x=>x.id!==btn.dataset.delrec);
    saveStore(); renderRecordsList();
  });
}

let FULLSIDE_VISIBLE = true;
let FULLSIDE_DATE = todayISO();

function renderFullCalSide(){
  const wrap = document.getElementById('fullCalSide');
  if(!wrap) return;
  wrap.innerHTML = `
    <button class="fcs-toggle" id="fcsToggle">${FULLSIDE_VISIBLE?'Скрыть полный календарь':'Показать полный календарь'}</button>

          <span class="fcs-range" id="fcsRange"></span>

        </div>

  document.getElementById('fcsPrev').onclick=()=>{ FULLSIDE_DATE=addDays(FULLSIDE_DATE,-7); renderFullSideDays(); };

function renderFullSideDays(){
  const start = isoWeekStart(FULLSIDE_DATE);
  const rangeEl = document.getElementById('fcsRange');
  if(rangeEl) rangeEl.textContent = `${fmtDate(start)} – ${fmtDate(addDays(start,6))}`;
  const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const today = todayISO();
  const onDone = ()=>{ closeOverlay(); renderFullSideDays(); renderCalendarInto(document.getElementById('calWrap')); };
  let html = '';
  for(let i=0;i<7;i++){
    const iso = addDays(start,i);
    const d = new Date(iso+"T00:00:00");
    const evs = (STORE.calEvents||[]).filter(e=>e.date===iso).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    html += `<div class="fcs-day ${iso===today?'today':''}" data-date="${iso}">
      <div class="fcs-day-head">${dayNames[i]}<b>${d.getDate()}</b></div>
      <div class="fcs-day-events">
      ${evs.map(e=>`<div class="fc-event-row" data-event="${e.id}"><span class="fc-event-dot" style="background:${calColorVar(e.color)}"></span><span class="fcs-title">${esc(e.title)}</span></div>`).join('') || '<div class="fcs-empty">Пусто</div>'}
      </div>
      <button class="fc-week-add" data-add="${iso}">+ Событие</button>
    </div>`;
  }
  const wrap = document.getElementById('fcsDays');
  if(!wrap) return;
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-event]').forEach(row=>{
    row.addEventListener('click',(e)=>{
      e.stopPropagation();
      const ev = (STORE.calEvents||[]).find(x=>x.id===row.dataset.event);
      if(ev) openEventForm(ev, null, onDone);
    });
  });
  wrap.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click',(e)=>{ e.stopPropagation(); openEventForm(null, btn.dataset.add, onDone); });
  });
}

    topics.forEach(t=>{

function donutSVG(pct){
  const r=21, c=2*Math.PI*r, off=c*(1-pct/100), s=54, mid=s/2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="6"/>
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" style="stroke:var(--khaki-ring)" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${mid} ${mid})"/>
    <text x="${mid}" y="${mid+5}" text-anchor="middle" font-size="12" style="fill:var(--text)" font-family="Onest">${pct}%</text>
  </svg>`;
}

/* ---------- Перетаскивание тем пальцем/мышью: весь ряд, без ручки, с плавной анимацией соседей (FLIP) ---------- */
function initTopicDrag(container, key, onCommit){
  if(!container) return;
  const THRESHOLD = 6; // px вертикального сдвига, после которого тап превращается в драг
  let dragEl = null, dragId = null, startY = 0, startTop = 0, pointerId = null;
  let pending = null; // {row, id, startX, startY, pointerId} — ждём, тап это или начало драга

  // FLIP: запоминаем позиции до перестановки DOM, затем проигрываем разницу как анимацию
  function reorderSmoothly(mutate){
    const before = new Map();
    container.querySelectorAll('.topic-row').forEach(el=>{
      if(el!==dragEl) before.set(el.dataset.id, el.getBoundingClientRect().top);
    });
    mutate();
    container.querySelectorAll('.topic-row').forEach(el=>{
      if(el===dragEl) return;
      const prevTop = before.get(el.dataset.id);
      if(prevTop==null) return;
      const dy = prevTop - el.getBoundingClientRect().top;
      if(dy){
        el.style.transition = 'none';
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(()=>{
          el.style.transition = '';
          el.style.transform = '';
        });
      }
    });
  }

  function applyDrag(clientY){
    const delta = clientY - startY;
    dragEl.style.transform = `translateY(${delta}px)`;
    const dragCenter = startTop + delta + dragEl.offsetHeight/2;
    const others = [...container.querySelectorAll('.topic-row')].filter(el=>el!==dragEl);
    let targetIndex = others.length;
    for(let i=0;i<others.length;i++){
      const rowMidOffset = others[i].offsetTop + others[i].offsetHeight/2;
      if(dragCenter < rowMidOffset){ targetIndex = i; break; }
    }
    const currentOrder = [...container.querySelectorAll('.topic-row')].map(el=>el.dataset.id);
    const withoutDrag = currentOrder.filter(id=>id!==dragId);
    withoutDrag.splice(targetIndex, 0, dragId);
    if(withoutDrag.join(',') !== currentOrder.join(',')){
      reorderSmoothly(()=>{
        withoutDrag.forEach(id=>{
          if(id===dragId) return;
          const el = container.querySelector(`.topic-row[data-id="${id}"]`);
          if(el) container.appendChild(el);
        });
      });
    }
  }

  function beginDrag(row, id, anchorY, pid){
    dragEl = row; dragId = id; startY = anchorY; startTop = row.offsetTop; pointerId = pid;
    if(document.activeElement && row.contains(document.activeElement)) document.activeElement.blur();
    dragEl.style.position = 'relative';
    dragEl.classList.add('dragging');
    dragEl.style.zIndex = 5;
    try{ dragEl.setPointerCapture(pid); }catch(err){}
  }

  container.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('button')) return; // кнопки (закрепить/удалить) — обычный тап, без драга
    const row = e.target.closest('.topic-row');
    if(!row) return;
    pending = {row, id: row.dataset.id, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId};
  });
  container.addEventListener('pointermove',(e)=>{
    if(dragEl && e.pointerId===pointerId){ applyDrag(e.clientY); return; }
    if(pending && e.pointerId===pending.pointerId){
      const dx = e.clientX - pending.startX, dy = e.clientY - pending.startY;
      if(Math.abs(dy) > THRESHOLD && Math.abs(dy) > Math.abs(dx)){
        const p = pending; pending = null;
        beginDrag(p.row, p.id, p.startY, p.pointerId);
        applyDrag(e.clientY);
      }
    }
  });
  const end = (e)=>{
    if(pending && e.pointerId===pending.pointerId) pending = null;
    if(!dragEl || e.pointerId!==pointerId) return;
    dragEl.classList.remove('dragging');
    dragEl.style.transform = '';
    dragEl.style.position = '';
    dragEl.style.zIndex = '';
    const finalOrder = [...container.querySelectorAll('.topic-row')].map(el=>el.dataset.id);
    STORE.topicOrder[key] = finalOrder;
    saveStore();
    dragEl = null; dragId = null; pointerId = null;
    onCommit();
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
}

function renderCardsGrid(body,key){
  const data = APP_DATA[key];
  const topics = getCategoryTopicsOrdered(key);
  if(data.cards.length===0){
    body.innerHTML = `<div class="empty-state">Пока нет карточек в этой теме.<br><button class="btn btn-primary" style="margin-top:12px" id="emptyAdd">Добавить первую карточку</button></div>`;
    body.querySelector('#emptyAdd').onclick=()=>openCardModal(key);
    return;
  }
  if(!CARDS_TOPIC_COLLAPSED[key]) CARDS_TOPIC_COLLAPSED[key] = {};
  const savedSession = STORE.studySessions && STORE.studySessions[key];
  const savedValidCount = savedSession ? savedSession.queue.filter(id=>findCard(key,id)).length : 0;
  const type = data.meta.type || "custom";
  function cardHtml(c){
    const {top,sub,body:cardBody,usage} = renderCardFace(type,c);
    const badgeClass = c.level>=3?'mastered':'';
    return `<div class="flashcard" data-open="${c.id}">
      <div class="level-badge ${badgeClass}">ур. ${c.level}</div>
      <div class="fc-topic">${esc(topicName(key,getCardTopicId(key,c)))}</div>
      <div class="fc-top">${top}</div>
      <div class="fc-sub">${sub}</div>
      <div class="fc-body">${cardBody}</div>
      ${usage?`<div class="fc-usage">Perfect Usage: ${usage}</div>`:''}
      ${c.attachmentData?(c.attachmentType&&c.attachmentType.startsWith('image')?`<img class="fc-attach" src="${c.attachmentData}">`:`<div class="rt-attach-chip">Файл: ${esc(c.attachmentName||'вложение')}</div>`):''}
      <div class="fc-actions">
        <button class="icon-btn edit" data-edit="${c.id}" title="Изменить">Ред.</button>
        <button class="icon-btn" data-del="${c.id}" title="Удалить">Удал.</button>
      </div>
    </div>`;
  }
  let chipsHtml = `<div class="filters" id="topicFilters">`;
  let sectionsHtml = '';
  topics.forEach(t=>{
    const tCards = data.cards.filter(c=>getCardTopicId(key,c)===t.id);
    if(tCards.length===0) return;
    const collapsed = !!CARDS_TOPIC_COLLAPSED[key][t.id];
    chipsHtml += `<div class="chip ${collapsed?'':'active'}" data-ctg-toggle="${t.id}" title="${collapsed?'Развернуть':'Свернуть'}">${esc(t.name)} (${tCards.length})</div>`;
    sectionsHtml += `<div class="grid cards-topic-body ${collapsed?'collapsed':''}" data-ctg-section="${t.id}">${tCards.map(cardHtml).join('')}</div>`;
  });
  chipsHtml += '</div>';
  const resumeBanner = savedValidCount>0 ? `<div class="resume-banner">
    <span>Есть незавершённая сессия изучения — осталось ${savedValidCount} карточек.</span>
    <div class="btn-row" style="margin:0"><button class="btn btn-primary" id="btnResumeSession">Продолжить</button><button class="btn" id="btnDiscardSession">Начать заново</button></div>
  </div>` : '';
  let html = resumeBanner + chipsHtml + `<div class="btn-row" style="margin:14px 0"><button class="btn btn-primary" id="btnStudy">Изучить (${data.cards.length})</button><button class="btn" id="btnAddCard2">Добавить карточку</button><button class="btn" id="btnCardSet">Сделать сет карточек</button></div>` + sectionsHtml;
  body.innerHTML = html;
  const resumeBtn = document.getElementById('btnResumeSession');
  if(resumeBtn) resumeBtn.onclick=()=>{
    STUDY_SESSION = { catKey:key, queue:savedSession.queue.filter(id=>findCard(key,id)), idx:Math.min(savedSession.idx,savedValidCount-1), flipped:false, seen:savedSession.seen||0, knew:savedSession.knew||0 };
    renderStudyModal();
    openOverlay();
  };
  const discardBtn = document.getElementById('btnDiscardSession');
  if(discardBtn) discardBtn.onclick=()=>{
    delete STORE.studySessions[key];
    saveStore();
    renderCardsGrid(body,key);
  };
  body.querySelectorAll('[data-ctg-toggle]').forEach(chip=>chip.onclick=()=>{
    const tId = chip.dataset.ctgToggle;
    CARDS_TOPIC_COLLAPSED[key][tId] = !CARDS_TOPIC_COLLAPSED[key][tId];
    renderCardsGrid(body,key);
  });
  body.querySelectorAll('[data-edit]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openCardModal(key, el.dataset.edit); });
  body.querySelectorAll('[data-del]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); if(!confirm('Точно удалить карточку? Это безвозвратно.')) return; deleteCard(key, el.dataset.del); });
  body.querySelectorAll('.flashcard').forEach(card=>card.addEventListener('click',(e)=>{
    if(e.target.closest('.icon-btn')) return;
    startStudySession(key, data.cards.map(c=>c.id), card.dataset.open);
  }));
  document.getElementById('btnStudy').onclick=()=>startStudySession(key, data.cards.map(c=>c.id));
  document.getElementById('btnAddCard2').onclick=()=>openCardModal(key);
  document.getElementById('btnCardSet').onclick=()=>openCardSetModal(key);
}

/* ==========================================================================
   ТЕТРАДЬ (рисование стилусом/пальцем/мышью — Pointer Events + canvas)
   ========================================================================== */
let NOTEBOOK_STATE = null; // {catKey, notebookId, tool, color, width, opacity, redoStacks:{pageId:[strokes]}}
const NB_PAPER_COLORS = { cream:'#F4ECD8', white:'#FFFFFF', black:'#1B1B1B' };
const NB_LINE_COLORS  = { cream:'#B9AD8C', white:'#D8D8D8', black:'#3A3A3A' };
const NB_COLORS = [
  '#1B1B1B','#FFFFFF','#8A8A8A',
  '#5C3418','#6B3F1F','#5E2430','#2F3B2E','#26415C',
  '#F4B8C6','#B8D4F4','#F4E8B8','#C6E8C6'
];
const NB_TOOL_DEFAULTS = {
  pen:{width:3, opacity:1},
  pencil:{width:2, opacity:0.8},
  highlighter:{width:18, opacity:0.32}
};
const NB_STRAIGHTEN_DELAY = 3500; // мс — держать неподвижно 3-4 секунды, чтобы не мешать письму прописью
const NB_STRAIGHTEN_MOVE_TOLERANCE = 7; // px — почти неподвижен
const NB_MIN_POINT_DIST = 2; // px — интерполяция при редких точках (палец), чтобы линия не "полосила"

function renderNotebookTab(body, key){
  const notebooks = STORE.notebooks[key] || [];
  if(NOTEBOOK_STATE && NOTEBOOK_STATE.catKey===key && notebooks.find(n=>n.id===NOTEBOOK_STATE.notebookId)){
    renderNotebookEditor(body, key);
    return;
  }
  let html = `<div class="btn-row" style="margin-bottom:16px"><button class="btn btn-primary" id="btnNewNotebook">Создать тетрадь</button></div>`;
  if(notebooks.length===0){
    html += `<div class="empty-state">Пока нет тетрадей. Создай тетрадь и пиши от руки стилусом — линейка, клетка, точка или пустой лист.</div>`;
  } else {
    html += `<div class="grid">`;
    notebooks.forEach(nb=>{
      html += `<div class="flashcard nb-card" data-open-nb="${nb.id}">
        <div class="fc-top">${esc(nb.name)}</div>
        <div class="fc-body">${nb.pages.length} стр.</div>
        <div class="fc-actions">
          <button class="icon-btn" data-del-nb="${nb.id}">Удал.</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  body.innerHTML = html;
  // Название спрашиваем своей модалкой, а не системным prompt(): в PWA на телефоне системный
  // диалог может не показаться вовсе, и тетрадь тогда просто не создаётся.
  document.getElementById('btnNewNotebook').onclick=()=>{
    document.getElementById('modalBody').innerHTML = `
      <h3>Новая тетрадь</h3>
      <div class="field"><label>Название</label><input id="nbName" value="Новая тетрадь"></div>
      <div class="modal-actions"><button class="btn" id="mCancelNb">Отмена</button><button class="btn btn-primary" id="mSaveNb">Создать</button></div>
    `;
    document.getElementById('mCancelNb').onclick=closeOverlay;
    document.getElementById('mSaveNb').onclick=()=>{
      const name = document.getElementById('nbName').value.trim();
      if(!name) return;
      if(!STORE.notebooks[key]) STORE.notebooks[key]=[];
      const nb = { id:uid('nb'), name, pages:[{ id:uid('pg'), bg:'lined', paper:'cream', strokes:[] }] };
      STORE.notebooks[key].push(nb);
      saveStore();
      NOTEBOOK_STATE = { catKey:key, notebookId:nb.id, tool:'pen', color:NB_COLORS[0], width:NB_TOOL_DEFAULTS.pen.width, opacity:NB_TOOL_DEFAULTS.pen.opacity, redoStacks:{}, newPageBg:'lined', newPagePaper:'cream', zoom:1 };
      closeOverlay();
      renderNotebookTab(body,key);
    };
    document.getElementById('nbName').addEventListener('keydown',(e)=>{ if(e.key==='Enter') document.getElementById('mSaveNb').click(); });
    openOverlay();
  };
  body.querySelectorAll('[data-open-nb]').forEach(el=>el.addEventListener('click',(e)=>{
    if(e.target.closest('[data-del-nb]')) return;
    NOTEBOOK_STATE = { catKey:key, notebookId:el.dataset.openNb, tool:'pen', color:NB_COLORS[0], width:NB_TOOL_DEFAULTS.pen.width, opacity:NB_TOOL_DEFAULTS.pen.opacity, redoStacks:{}, newPageBg:'lined', newPagePaper:'cream', zoom:1 };
    renderNotebookTab(body,key);
  }));
  body.querySelectorAll('[data-del-nb]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(!confirm('Удалить тетрадь целиком, со всеми страницами? Её можно будет вернуть из корзины в разделе Storage.')) return;
    const nb = (STORE.notebooks[key]||[]).find(n=>n.id===el.dataset.delNb);
    if(nb) trashPush('notebook', nb.name, {notebook:JSON.parse(JSON.stringify(nb))}, key, `${getCategoryDisplayName(key)} · ${nb.pages.length} стр.`);
    STORE.notebooks[key] = (STORE.notebooks[key]||[]).filter(n=>n.id!==el.dataset.delNb);
    saveStore();
    renderNotebookTab(body,key);
  }));
}

  document.getElementById('nbBack').onclick=()=>{ NOTEBOOK_STATE=null; renderNotebookTab(body,key); };

  document.getElementById('nbToolPen').onclick=()=>{ setTool('pen'); };
  document.getElementById('nbToolPencil').onclick=()=>{ setTool('pencil'); };

  function setTool(tool){

    canvas.className = 'nb-canvas';

    liveCanvas.className = 'nb-canvas-live';

    const ctx = canvas.getContext('2d');

  function sizeAll(){
    Object.values(pageCtxs).forEach(({canvas,ctx,liveCanvas,liveCtx,page})=>{
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const w = rect.width || 700, h = 900;
      [canvas, liveCanvas].forEach(c=>{
        c.width = Math.max(1, Math.round(w*dpr));
        c.height = Math.max(1, Math.round(h*dpr));
        c.style.width = w+'px';
        c.style.height = h+'px';
      });
      if(ctx) ctx.setTransform(dpr,0,0,dpr,0,0);
      if(liveCtx) liveCtx.setTransform(dpr,0,0,dpr,0,0);
      redrawCanvas(canvas, ctx, page);
    });
  }
  sizeAll();
  window.addEventListener('resize', sizeAll, {once:false});

  document.getElementById('nbUndo').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);
    const target = pageCtxs[targetPageId];
    if(!target || target.page.strokes.length===0) return;
    const stroke = target.page.strokes.pop();
    if(!s.redoStacks[targetPageId]) s.redoStacks[targetPageId]=[];
    s.redoStacks[targetPageId].push(stroke);

    redrawCanvas(target.canvas, target.ctx, target.page);
  };
  document.getElementById('nbRedo').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);

    if(!target || !stack || stack.length===0) return;

    target.page.strokes.push(stroke);
    saveStore();
    redrawCanvas(target.canvas, target.ctx, target.page);
  };
  document.getElementById('nbClear').onclick=()=>{
    const targetPageId = s.lastActivePageId || (nb.pages[nb.pages.length-1] && nb.pages[nb.pages.length-1].id);

    if(!target) return;
    if(!confirm('Очистить эту страницу? Все записи на ней исчезнут — это безвозвратно.')) return;
    target.page.strokes = [];
    s.redoStacks[targetPageId] = [];
    saveStore();
    redrawCanvas(target.canvas, target.ctx, target.page);
  };

  function applyZoom(){
    scrollInner.style.transform = `scale(${s.zoom||1})`;
    scrollInner.style.transformOrigin = 'top center';
    document.getElementById('nbZoomLabel').textContent = Math.round((s.zoom||1)*100)+'%';
  }
  document.getElementById('nbZoomIn').onclick=()=>{ s.zoom = Math.min(2.2, (s.zoom||1)+0.1); applyZoom(); };
  document.getElementById('nbZoomOut').onclick=()=>{ s.zoom = Math.max(0.6, (s.zoom||1)-0.1); applyZoom(); };
  document.getElementById('nbZoomReset').onclick=()=>{ s.zoom = 1; applyZoom(); };
  applyZoom();

  /* ---------- Зум щипком двумя пальцами (палец не рисует — он свободен для жестов) ---------- */
  (function initPinchZoom(){
    const active = new Map(); // pointerId -> {x,y}
    let pinchStartDist = null, pinchStartZoom = 1;
    scrollWrap.addEventListener('pointerdown',(e)=>{
      if(e.pointerType!=='touch') return;
      active.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(active.size===2){
        const pts = [...active.values()];
        pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        pinchStartZoom = s.zoom||1;
      }
    });
    scrollWrap.addEventListener('pointermove',(e)=>{
      if(e.pointerType!=='touch' || !active.has(e.pointerId)) return;
      const prev = active.get(e.pointerId);
      active.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(active.size===2 && pinchStartDist){
        e.preventDefault();
        const pts = [...active.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        s.zoom = Math.min(2.2, Math.max(0.6, pinchStartZoom * (dist/pinchStartDist)));
        applyZoom();
      } else if(active.size===1){
        // один палец — ручной скролл (у канваса touch-action:none, поэтому браузер сам не скроллит)
        e.preventDefault();
        const dy = e.clientY - prev.y;
        scrollWrap.scrollTop -= dy;
      }
    }, {passive:false});
    function releasePointer(e){ active.delete(e.pointerId); if(active.size<2) pinchStartDist=null; }
    scrollWrap.addEventListener('pointerup', releasePointer);
    scrollWrap.addEventListener('pointercancel', releasePointer);
  })();

  function setupPageDrawing(canvas, ctx, liveCanvas, liveCtx, page, s){
    // touch-action:none обязателен — иначе браузер на iPad перехватывает движение
    // стилуса как жест скролла/перелистывания вместо рисования (баг «стилус листает страницы»)
    canvas.style.touchAction = 'none';
    liveCanvas.style.touchAction = 'none';
    let drawing = false;
    let currentStroke = null;
    let holdTimer = null;
    let startPoint = null;
    let activePointerId = null;

    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const zoom = s.zoom||1;
      return {
        x: (e.clientX-rect.left)/zoom,
        y: (e.clientY-rect.top)/zoom,
        pressure: (e.pressure && e.pressure>0) ? e.pressure : 0.5,
        t: Date.now()
      };
    }
    function clearHoldTimer(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
    function armHoldTimer(){
      clearHoldTimer();
      holdTimer = setTimeout(()=>{
        if(!drawing || !currentStroke || currentStroke.points.length<2) return;
        const last = currentStroke.points[currentStroke.points.length-1];
        currentStroke.straightened = true;
        currentStroke.points = [startPoint, last];
        liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
        paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      }, NB_STRAIGHTEN_DELAY);
    }
    function isAllowedPointer(e){
      // Пишет только стилус (Apple Pencil = pointerType 'pen'); мышь разрешена для теста на компьютере.
      // Палец (touch) не рисует — освобождён для скролла и зума щипком.
      return e.pointerType==='pen' || e.pointerType==='mouse';
    }

    canvas.addEventListener('pointerdown',(e)=>{
      if(!ctx || !isAllowedPointer(e)) return;
      e.preventDefault(); // страхуемся от перехвата жеста браузером (не даём стилусу листать/скроллить)
      drawing = true;
      activePointerId = e.pointerId;
      s.lastActivePageId = page.id;
      s.redoStacks[page.id] = [];
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      const p = posFromEvent(e);
      startPoint = p;
      const isEraser = s.tool==='eraser';
      liveCanvas.style.opacity = isEraser ? 0 : (s.opacity!=null?s.opacity:1);
      liveCtx.setTransform((window.devicePixelRatio||1),0,0,(window.devicePixelRatio||1),0,0);
      liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
      currentStroke = {
        color: isEraser ? '#000000' : s.color,
        width: isEraser ? 22 : s.width,
        opacity: isEraser ? 1 : s.opacity,
        tool: s.tool,
        points: [p]
      };
      if(isEraser) eraseSegment(ctx, currentStroke);
      else paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      armHoldTimer();
    });
    canvas.addEventListener('pointermove',(e)=>{
      if(!drawing || !currentStroke || e.pointerId!==activePointerId) return;
      if(!isAllowedPointer(e)) return;
      e.preventDefault();
      const p = posFromEvent(e);
      const last = currentStroke.points[currentStroke.points.length-1];
      const dist = Math.hypot(p.x-last.x, p.y-last.y);
      if(dist < 0.4) return; // игнорируем дрожание меньше субпикселя
      // интерполяция промежуточных точек при редких событиях (палец/медленная связь), чтобы линия не "полосила"
      const steps = Math.min(8, Math.max(1, Math.round(dist / NB_MIN_POINT_DIST)));
      for(let i=1;i<=steps;i++){
        const t = i/steps;
        currentStroke.points.push({
          x: last.x + (p.x-last.x)*t,
          y: last.y + (p.y-last.y)*t,
          pressure: (last.pressure||0.5) + ((p.pressure||0.5)-(last.pressure||0.5))*t,
          t: p.t
        });
      }
      if(currentStroke.tool==='eraser') eraseSegment(ctx, currentStroke);
      else {
        liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
        paintSmoothPath(liveCtx, currentStroke.points, currentStroke.width, currentStroke.tool, currentStroke.color);
      }
      if(dist > NB_STRAIGHTEN_MOVE_TOLERANCE) armHoldTimer();
    });
    function endStroke(e){
      if(!drawing || (e && e.pointerId!==activePointerId)) return;
      drawing = false;
      clearHoldTimer();
      liveCtx.clearRect(0,0,liveCanvas.width,liveCanvas.height);
      if(currentStroke && currentStroke.points.length>1){
        page.strokes.push(currentStroke);
        saveStore();
        redrawCanvas(canvas, ctx, page); // авторитетная перерисовка без полос поверх live-слоя
      }
      currentStroke = null;
      activePointerId = null;
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }
}

/* ---------- Рисование без полос: константная толщина — единый плавный путь;
   переменная толщина (нажим пера) — по сегментам с квадратичным сглаживанием ---------- */
function pseudoNoise(n){
  const x = Math.sin(n*12.9898)*43758.5453;
  return x - Math.floor(x);
}
/* Карандаш: несколько дрожащих полупрозрачных проходов — имитация зерна графита,
   визуально явно отличается от ровной сплошной линии пера. */
function paintPencilTexture(ctx, pts, baseWidth, color){
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const passes = 3;
  for(let p=0;p<passes;p++){
    const seed = p*97 + 13;
    ctx.globalAlpha = 0.36 + 0.13*p;
    ctx.lineWidth = baseWidth * (0.55 + p*0.22);
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const jx = (pseudoNoise(i+seed) - 0.5) * baseWidth * 0.5;
      const jy = (pseudoNoise(i+seed+50) - 0.5) * baseWidth * 0.5;
      const x = pts[i].x+jx, y = pts[i].y+jy;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function paintSmoothPath(ctx, pts, baseWidth, tool, color){
  if(!ctx || pts.length<2) return;
  if(tool==='pencil' && pts.length>2){
    paintPencilTexture(ctx, pts, baseWidth, color);
    return;
  }
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const constWidth = (tool==='highlighter' || tool==='pencil' || tool==='eraser' || pts.length===2);
  if(constWidth){
    ctx.lineWidth = baseWidth;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  } else {
    for(let i=1;i<pts.length;i++){
      ctx.lineWidth = baseWidth * (0.5 + (pts[i].pressure||0.5));
      ctx.beginPath();
      ctx.moveTo(pts[i-1].x, pts[i-1].y);
      ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }
  }
}
/* Ластик реально стирает пиксели (destination-out) — фон страницы (линейка/клетка) не трогается,
   потому что это CSS-разметка ПОД прозрачным канвасом, а не нарисованные пиксели. */
function eraseSegment(ctx, stroke){
  if(!ctx) return;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.globalAlpha = 1;
  paintSmoothPath(ctx, stroke.points, stroke.width, 'eraser', '#000');
  ctx.restore();
}
function redrawCanvas(canvas, ctx, page){
  if(!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.clearRect(0,0,w,h);
  (page.strokes||[]).forEach(stroke=>{
    const pts = stroke.points;
    if(!pts || pts.length<2) return;
    if(stroke.tool==='eraser'){
      eraseSegment(ctx, stroke);
      return;
    }
    const opacity = stroke.opacity!=null ? stroke.opacity : 1;
    if(opacity>=0.98){
      ctx.save();
      ctx.globalAlpha = 1;
      paintSmoothPath(ctx, pts, stroke.width, stroke.tool, stroke.color);
      ctx.restore();
    } else {
      // офф-скрин буфер: рисуем штрих непрозрачно один раз, затем накладываем целиком —
      // так пересечения самого штриха с собой не дают полосатости
      const off = document.createElement('canvas');
      off.width = canvas.width; off.height = canvas.height;
      const octx = off.getContext('2d');
      if(!octx){ paintSmoothPath(ctx, pts, stroke.width, stroke.tool, stroke.color); return; }
      octx.setTransform(dpr,0,0,dpr,0,0);
      paintSmoothPath(octx, pts, stroke.width, stroke.tool, stroke.color);
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.globalAlpha = opacity;
      ctx.drawImage(off, 0, 0);
      ctx.restore();
    }
  });
}

/* ---------- Изучение карточек в стиле Quizlet: флип + Знаю/Не знаю/Повторю ещё ---------- */

// Сохраняет прогресс текущей сессии, чтобы при закрытии (крестик/«Закрыть сессию») она не слетала —
// при следующем открытии этой же категории предложим продолжить, как в Quizlet.
function saveStudySessionProgress(){
  const s = STUDY_SESSION;
  if(!s) return;
  if(!STORE.studySessions) STORE.studySessions = {};
  if(s.queue.length===0){ delete STORE.studySessions[s.catKey]; }
  else { STORE.studySessions[s.catKey] = {queue:s.queue.slice(), idx:s.idx, seen:s.seen, knew:s.knew, savedAt:todayISO()}; }
  saveStore();
}
function startStudySession(catKey, cardIds, startId){
  if(cardIds.length===0) return;
  const saved = STORE.studySessions && STORE.studySessions[catKey];
  if(saved && saved.queue && saved.queue.length>0 && !startId){
    const stillValid = saved.queue.filter(id=>findCard(catKey,id));
    if(stillValid.length>0 && confirm(`Есть незавершённая сессия по этой категории (осталось ${stillValid.length} карточек). Продолжить?`)){
      STUDY_SESSION = { catKey, queue:stillValid, idx:Math.min(saved.idx,stillValid.length-1), flipped:false, seen:saved.seen||0, knew:saved.knew||0 };
      renderStudyModal();
      openOverlay();
      return;
    }
    delete STORE.studySessions[catKey]; saveStore();
  }
  let ids = cardIds.slice();
  if(startId){ ids = [startId, ...ids.filter(id=>id!==startId)]; }
  STUDY_SESSION = { catKey, queue: shuffle(ids), idx:0, flipped:false, seen:0, knew:0 };
  if(startId){ STUDY_SESSION.queue = [startId, ...shuffle(ids.filter(id=>id!==startId))]; }
  renderStudyModal();
  openOverlay();
}
function renderStudyModal(){
  const s = STUDY_SESSION;
  const modal = document.getElementById('modalBody');
  modal.classList.add('modal-lg');
  if(!s || s.queue.length===0){
    if(s && STORE.studySessions) delete STORE.studySessions[s.catKey];
    saveStore();
    modal.innerHTML = `<h3>Сессия завершена</h3><div class="empty-state">Все карточки пройдены: «Знаю» — ${s?s.knew:0} из ${s?s.seen:0} попыток.</div><div class="modal-actions"><button class="btn btn-primary" id="mCloseStudy">Готово</button></div>`;
    document.getElementById('mCloseStudy').onclick=()=>{ modal.classList.remove('modal-lg'); STUDY_SESSION=null; closeOverlay(); buildAllData(); renderAll(); };
    return;
  }
  if(s.idx >= s.queue.length) s.idx = 0;
  const cardId = s.queue[s.idx];
  const card = findCard(s.catKey, cardId);
  if(!card){ s.queue.splice(s.idx,1); renderStudyModal(); return; }
  const type = (APP_DATA[s.catKey]||{}).meta ? APP_DATA[s.catKey].meta.type : "custom";
  const {top,sub,body,usage} = renderCardFace(type,card);
  modal.innerHTML = `
    <h3>Изучение — ${esc(getCategoryDisplayName(s.catKey))}</h3>
    <div class="study-nav">
      <button class="btn" id="btnPrevCard" ${s.queue.length<2?'disabled':''}>‹ Назад</button>
      <div class="study-progress">${s.idx+1} из ${s.queue.length}</div>
      <button class="btn" id="btnNextCard" ${s.queue.length<2?'disabled':''}>Вперёд ›</button>
    </div>
    <div class="study-card-wrap">
      <div class="study-card" id="studyCard">
        <span class="sc-swipe-hint dont">Не знаю</span>
        <span class="sc-swipe-hint know">Знаю</span>
        <span class="sc-topic">${esc(topicName(s.catKey,getCardTopicId(s.catKey,card)))}</span>
        ${s.flipped
          ? `<div><div class="sc-main">${sub}</div><div class="sc-sub">${body}${usage?`<br><br>Perfect Usage: ${usage}`:''}</div></div>`
          : `<div class="sc-main">${top}</div>`}
        <span class="sc-hint">${s.flipped?'Нажми, чтобы увидеть вопрос · листай влево/вправо':'Нажми, чтобы увидеть ответ · листай влево/вправо'}</span>
      </div>
    </div>
    <div class="study-actions">
      <button class="btn btn-dontknow" id="btnDontKnow">Не знаю</button>
      <button class="btn btn-again" id="btnAgain">Повторю ещё</button>
      <button class="btn btn-know" id="btnKnow">Знаю</button>
    </div>
    <div class="modal-actions"><button class="btn" id="mCloseStudy2">Закрыть сессию</button></div>
  `;
  const closeAndRefresh = ()=>{ saveStudySessionProgress(); modal.classList.remove('modal-lg'); STUDY_SESSION=null; closeOverlay(); buildAllData(); renderAll(); };
  document.getElementById('mCloseStudy2').onclick=closeAndRefresh;

  function goPrev(){ s.idx = (s.idx-1+s.queue.length)%s.queue.length; s.flipped=false; renderStudyModal(); }
  function goNext(){ s.idx = (s.idx+1)%s.queue.length; s.flipped=false; renderStudyModal(); }
  document.getElementById('btnPrevCard').onclick=goPrev;
  document.getElementById('btnNextCard').onclick=goNext;

  function requeue(){
    const id = s.queue.splice(s.idx,1)[0];
    s.queue.push(id);
    if(s.idx >= s.queue.length) s.idx = 0;
    s.flipped = false;
    s.seen++;
    saveStudySessionProgress();
    renderStudyModal();
  }
  function markKnow(){
    review(card, true);
    s.queue.splice(s.idx,1);
    if(s.idx >= s.queue.length) s.idx = 0;
    s.flipped=false; s.seen++; s.knew++;
    saveStudySessionProgress();
    renderStudyModal();
  }
  function markDontKnow(){
    // «Работа над ошибками» — только для практики/заданий, не для карточек: свайп «Не знаю» в
    // Quizlet-режиме — обычная часть spaced repetition, не должен попадать в WON.
    review(card, false, {skipMistake:true});
    requeue();
  }
  document.getElementById('btnKnow').onclick=markKnow;
  document.getElementById('btnDontKnow').onclick=markDontKnow;
  document.getElementById('btnAgain').onclick=requeue;

  /* ---- Свайп влево/вправо как в Quizlet: вправо = «Знаю», влево = «Не знаю» ---- */
  const cardEl = document.getElementById('studyCard');
  const hintKnow = cardEl.querySelector('.sc-swipe-hint.know');
  const hintDont = cardEl.querySelector('.sc-swipe-hint.dont');
  const SWIPE_THRESHOLD = 90, TAP_THRESHOLD = 8;
  let dragStartX=0, dragStartY=0, dragging=false, dragActive=false, pointerId=null;

  cardEl.addEventListener('pointerdown',(e)=>{
    dragStartX=e.clientX; dragStartY=e.clientY; dragging=false; dragActive=true; pointerId=e.pointerId;
    try{ cardEl.setPointerCapture(e.pointerId); }catch(err){}
  });
  cardEl.addEventListener('pointermove',(e)=>{
    if(!dragActive || e.pointerId!==pointerId) return;
    const dx = e.clientX-dragStartX, dy = e.clientY-dragStartY;
    if(!dragging){
      if(Math.abs(dx) < TAP_THRESHOLD || Math.abs(dy) > Math.abs(dx)) return;
      dragging = true;
      cardEl.classList.add('dragging');
    }
    cardEl.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    const p = Math.min(1, Math.abs(dx)/SWIPE_THRESHOLD);
    if(dx>0){ hintKnow.style.opacity=p; hintDont.style.opacity=0; }
    else{ hintDont.style.opacity=p; hintKnow.style.opacity=0; }
  });
  const endDrag = (e)=>{
    if(!dragActive || (pointerId!==null && e.pointerId!==pointerId)) return;
    dragActive = false;
    if(!dragging){ pointerId=null; return; } // это был обычный тап — сработает onclick ниже
    cardEl.classList.remove('dragging');
    const dx = e.clientX-dragStartX;
    pointerId = null;
    if(dx > SWIPE_THRESHOLD){
      cardEl.style.transform = `translateX(600px) rotate(24deg)`;
      cardEl.style.opacity = '0';
      setTimeout(markKnow, 140);
    } else if(dx < -SWIPE_THRESHOLD){
      cardEl.style.transform = `translateX(-600px) rotate(-24deg)`;
      cardEl.style.opacity = '0';
      setTimeout(markDontKnow, 140);
    } else {
      cardEl.style.transform = '';
      hintKnow.style.opacity = 0; hintDont.style.opacity = 0;
    }
  };
  cardEl.addEventListener('pointerup', endDrag);
  cardEl.addEventListener('pointercancel', endDrag);
  cardEl.addEventListener('click',()=>{
    if(dragging) return; // клик после свайпа не переворачивает карточку
    s.flipped=!s.flipped; renderStudyModal();
  });
}

/* ---------- Теория (Feynman): главный вопрос + факты + связи ---------- */
let THEORY_EDIT_STATE = null; // {catKey, materialId} — полноэкранный редактор (не модалка!)
let THEORY_DIRTY = false; // в открытой лекции есть несохранённые правки
// Единая проверка перед любым уходом из открытой лекции: напоминаем сохранить материал.
// Возвращает true, если уходить можно.
let THEORY_FLUSH_DRAFT = null; // ставится редактором лекции: немедленно записать черновик
function confirmLeaveTheory(){
  if(!THEORY_EDIT_STATE || !THEORY_DIRTY) return true;
  const ok = confirm('В открытой лекции есть несохранённые изменения.\n\nСначала нажми «Сохранить материал» — иначе они потеряются.\n\nВсё равно уйти без сохранения?');
  if(ok){
    // уходим — но черновик дописываем сразу, чтобы материал можно было поднять обратно
    if(typeof THEORY_FLUSH_DRAFT === 'function'){ try{ THEORY_FLUSH_DRAFT(); }catch(e){} }
    THEORY_DIRTY = false;
  }
  return ok;
}
// Закрытие вкладки/приложения с несохранённой лекцией — браузер сам спросит подтверждение.
window.addEventListener('beforeunload', (e)=>{
  if(THEORY_EDIT_STATE && THEORY_DIRTY){ e.preventDefault(); e.returnValue = ''; return ''; }
});
let THEORY_COLLAPSED = {}; // materialId -> false, если явно развёрнута (по умолчанию все свёрнуты — видно только тему)

// Ставит в планер задачу-напоминание на дату повторения лекции. На одну дату+категорию — одна задача
// в планере (чтобы не засорять план), но КАЖДАЯ лекция обязательно туда попадает: если на эту дату уже
// есть задача по этой категории (от другой лекции), название новой лекции дописывается в неё, а не теряется.
function scheduleLectureReviewReminder(catKey, date, title){
  if(!STORE.planTasks) STORE.planTasks = [];
  const name = getCategoryDisplayName(catKey);
  const existing = STORE.planTasks.find(t=>t.srAutoLec && t.srCat===catKey && t.date===date && !t.done);
  if(existing){
    if(!existing.text.includes(title)) existing.text += `, ${title}`;
    return;
  }
  STORE.planTasks.push({
    id: uid('plan'), done:false, createdDate:todayISO(), date,
    text: `Повторить лекцию: ${name} — ${title}`, tier:'min', quadrant:'uiq', deadline:null,
    srAutoLec:true, srCat:catKey
  });
}
const SR_INTERVALS = [1,3,7,14,30];
// Первая постановка лекции в spaced repetition сразу после её создания/сохранения.
function scheduleLectureInitial(m, catKey, fromDate){
  m.srLevel = 0;
  m.nextReview = addDays(fromDate || todayISO(), SR_INTERVALS[0]);
  scheduleLectureReviewReminder(catKey, m.nextReview, m.title);
}
// Отметить лекцию повторённой — продвигает по тем же интервалам, что и карточки.
function reviewMaterial(m, catKey){
  m.srLevel = Math.min((m.srLevel||0)+1, SR_INTERVALS.length-1);
  m.nextReview = addDays(todayISO(), SR_INTERVALS[m.srLevel]);
  scheduleLectureReviewReminder(catKey, m.nextReview, m.title);
  saveStore();
}

function renderTheory(body,key){
  if(THEORY_EDIT_STATE && THEORY_EDIT_STATE.catKey===key){
    renderTheoryEditor(body,key);
    return;
  }
  const materials = (STORE.materials[key]||[]);
  let html = `<div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary" id="btnAddTheory">Добавить материал</button>

    <button class="btn" id="btnImportTheory">Импортировать из файла</button>
    <input type="file" id="importTheoryFile" accept="application/json" style="display:none">
  </div>
  ${aiInstructionsHtml('Как импортировать сразу несколько лекций из файла', [
    'Отправь свои конспекты (текст/фото/pdf) в чат с любым ИИ-ассистентом и попроси собрать по ним материалы и карточки платформы PRIMUS.',
    `Поля карточек этой категории строго такие ключи: <code>${(APP_DATA[key].meta.fields||['front','back']).join(', ')}</code>.`,

  ])}`;
  if(materials.length===0){

    materials.slice().reverse().forEach(m=>{

        <div class="theory-collapsible">

        <div class="theory-block"><div class="tb-label">Главные вопросы</div><div class="tb-body">${m.mainQuestions||'<span style="opacity:.5">пока не заполнено</span>'}</div></div>
        <div class="theory-block"><div class="tb-label">Материал лекции</div><div class="tb-body theory-material-preview">${m.materialText||'<span style="opacity:.5">пусто</span>'}</div></div>
        ${m.notes?`<div class="theory-block"><div class="tb-label">Заметки</div><div class="tb-body">${m.notes}</div></div>`:''}
        ${m.explanation?`<div class="theory-block"><div class="tb-label">Выжимка простыми словами</div><div class="tb-body">${m.explanation}</div></div>`:''}
        ${m.unclear?`<div class="theory-block"><div class="tb-label">Разбор непонятного (?)</div><div class="tb-body">${m.unclear}</div></div>`:''}

  };
  body.querySelectorAll('[data-collapse-mat]').forEach(btn=>btn.onclick=(e)=>{
    e.stopPropagation();
    const id = btn.dataset.collapseMat;
    THEORY_COLLAPSED[id] = !(THEORY_COLLAPSED[id]!==false);
    renderTheory(body,key);
  });
  body.querySelectorAll('[data-mkcard]').forEach(btn=>btn.onclick=()=>{
    const m = materials.find(x=>x.id===btn.dataset.mkcard);
    if(m) openCardModal(key, null, m);
  });
  body.querySelectorAll('[data-review-mat]').forEach(btn=>btn.onclick=()=>{
    const m = materials.find(x=>x.id===btn.dataset.reviewMat);
    if(m) reviewMaterial(m, key);
    renderTheory(body,key);
  });
  body.querySelectorAll('[data-addsr-mat]').forEach(btn=>btn.onclick=()=>{
    const m = materials.find(x=>x.id===btn.dataset.addsrMat);
    if(m){ scheduleLectureInitial(m, key, todayISO()); saveStore(); }
    renderTheory(body,key);
  });
  body.querySelectorAll('[data-edittheory]').forEach(btn=>btn.onclick=()=>{ THEORY_EDIT_STATE={catKey:key, materialId:btn.dataset.edittheory}; renderTheory(body,key); });
  body.querySelectorAll('[data-deltheory]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Удалить материал лекции? Его можно будет вернуть из корзины в разделе Storage.')) return;
    const mat = (STORE.materials[key]||[]).find(x=>x.id===btn.dataset.deltheory);
    if(mat) trashPush('material', mat.title, {material:JSON.parse(JSON.stringify(mat))}, key, getCategoryDisplayName(key));
    STORE.materials[key] = (STORE.materials[key]||[]).filter(x=>x.id!==btn.dataset.deltheory);
    saveStore(); renderTheory(body,key);
  });
}

/* ---------- Полноэкранный редактор материала лекции («как новый файл в Ворде») ---------- */
function extractKeywordsFromHtml(html){
  if(!html) return [];
  const div = document.createElement('div');
  div.innerHTML = html;
  const found = [];
  // Ключевое слово — только то, что помечено кнопкой «Ключевое слово + карточка».
  // Жирный текст больше в ключевые слова не попадает: жирный — это просто жирный.
  div.querySelectorAll('.kw-mark').forEach(el=>{
    const t = el.textContent.trim();
    if(t && t.length<60 && !found.includes(t)) found.push(t);
  });
  return found;
}
// Раскладывает пару «слово → контекст» в поля карточки конкретного предмета так, чтобы
// слово оказалось на лицевой стороне, а контекст — в основном описании (см. renderCardFace).
function cardFieldsFromKeyword(catKey, word, context){
  const type = (APP_DATA[catKey] && APP_DATA[catKey].meta.type) || 'custom';
  switch(type){
    case 'geo':    return {country:word, capital:'', fact1:context, fact2:'', usage:''};
    case 'latin':  return {latin:word, translation:'', meaning:context, usage:''};
    case 'legal':  return {term:word, translation:'', definition:context, example:''};
    case 'law':    return {term:word, enTerm:'', definition:context, example:''};
    case 'lit':    return {author:'', title:word, context:context, legalConn:''};
    case 'art':    return {style:'', artist:'', work:word, period:'', usage:context};
    case 'ita':    return {phrase:word, translation:'', grammar:context, usage:''};
    case 'lingvo':
    case 'hist':   return {kind:'', name:word, sub:'', description:context, connection:''};
    default:       return {front:word, back:context, note:''};
  }
}

function renderTheoryEditor(body, key){
  const editing = THEORY_EDIT_STATE.materialId ? (STORE.materials[key]||[]).find(m=>m.id===THEORY_EDIT_STATE.materialId) : null;

  let draft = editing || { title:'', dateStart:todayISO(), dateEnd:'', topicId:'general', mainQuestions:'', keywords:[], materialText:'', notes:'', explanation:'', unclear:'', facts:'', connections:'', application:'', attachments:[] };

  if(sd && sd.catKey===key && (sd.materialId||null)===(THEORY_EDIT_STATE.materialId||null) && (sd.title || sd.materialText)){

  body.innerHTML = `
    <div class="theory-editor">
